  const SPRITES = {
    imp:   [impFrame1, impFrame2],
    grunt: [gruntFrame1, gruntFrame2],
    exit:  [exitFrame, exitFrame],
  };

  // ---------------------------------------------------------------------------
  // Enemy entities. Schema: { x, y, type, hp, moveSpeed, rangedDamage, alive,
  // animPhase, dirX, dirY, hitFlashUntil, fireFlashUntil, mode, modeUntil,
  // damage(amount) }. mode ∈ { 'idle', 'chase', 'wind', 'cool' }.
  // ---------------------------------------------------------------------------
  // Per-type stats. meleeRadius is consumed by the contact-damage check.
  const TYPE_TABLE = {
    imp:   { moveSpeed: 1.8, hp: 3, rangedDamage: 5,  meleeRadius: 0.6, windupMs: 350, cooldownMs: 700 },
    grunt: { moveSpeed: 1.0, hp: 5, rangedDamage: 10, meleeRadius: 0.6, windupMs: 900, cooldownMs: 1600 },
  };
  function makeEnemy(x, y, type) {
    const t = TYPE_TABLE[type];
    return {
      x, y, type,
      hp: t.hp,
      moveSpeed: t.moveSpeed,
      rangedDamage: t.rangedDamage,
      alive: true,
      animPhase: Math.random() * 1000, // de-sync animation between enemies
      dirX: 0, dirY: -1,
      hitFlashUntil: 0,
      fireFlashUntil: 0,
      mode: 'idle',
      modeUntil: 0,
      damage(amount) {
        if (!this.alive) return;
        this.hp -= amount;
        if (this.hp <= 0) this.alive = false;
      },
    };
  }
  // Spawn data is rebuilt by applyDungeon() on startup and on each N-regen;
  // resetRun() then rebuilds the live `enemies` array from `enemySpawns`.
  let enemySpawns = [];
  let PLAYER_SPAWN = { x: 1.5, y: 1.5, dirX: 1, dirY: 0, planeX: 0, planeY: 0.66 };
  let EXIT = { cellX: 0, cellY: 0 };
  let enemies = [];

  // level-exit-progression: shared by resetRun() (R after death + N debug regen)
  // and advanceLevel() (exit-step transition). Flushes leftover flashes / pops /
  // arrows / banner / queued input so they don't bleed across the boundary.
  // lastFireTime is intentionally NOT reset here: advanceLevel carries cooldown
  // forward (matching the HP/ammo carry-over), and resetRun clears it inline.
  function clearTransientFeedback() {
    muzzleFlashUntil = 0;
    hitTintUntil = 0;
    nextContactHurtMs = 0;
    dmgFlashUntil = 0;
    dmgFlashAt = 0;
    nextDmgFlashMs = 0;
    dmgArrow = null;
    killPops.length = 0;
    levelBannerAtMs = 0;
    levelBannerUntilMs = 0;
    mouseDx = 0;
    // gun-viewmodel: spec #14 — gun reappears in idle on respawn, with
    // bobPhase = 0 and kickState = 'idle'. Same applies after N-regen and
    // level transitions, which both call this helper.
    bobPhase = 0;
    bobIntensity = 0;
    kickState = 'idle';
    kickKind = 'shot';
    kickStart = 0;
    for (const k in keys) keys[k] = false;
  }

  function resetRun() {
    enemies = enemySpawns.map(s => makeEnemy(s.x, s.y, s.type));
    player.x = PLAYER_SPAWN.x;
    player.y = PLAYER_SPAWN.y;
    player.dirX = PLAYER_SPAWN.dirX;
    player.dirY = PLAYER_SPAWN.dirY;
    player.planeX = PLAYER_SPAWN.planeX;
    player.planeY = PLAYER_SPAWN.planeY;
    player.hp = MAX_HP;
    ammo = MAX_AMMO;
    level = 1;
    lastFireTime = -Infinity;
    clearTransientFeedback();
  }

  // ---------------------------------------------------------------------------
  // Procedural dungeon: a seeded mulberry32 PRNG drives both map carving and
  // enemy placement. ?seed=<u32> in the URL pins the layout for bug reports;
  // pressing N generates a fresh seed and rebuilds the world.
  // ---------------------------------------------------------------------------
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function parseSeedFromUrl() {
    try {
      const sp = new URL(window.location.href).searchParams.get('seed');
      if (sp == null || sp === '') return null;
      const n = Number.parseInt(sp, 10);
      if (!Number.isFinite(n) || n < 0 || n > 0xFFFFFFFF) return null;
      return n >>> 0;
    } catch (_) {
      return null;
    }
  }

  function pickRandomSeed() {
    return Math.floor(Math.random() * 0x100000000) >>> 0;
  }

  function generateDungeon(seed) {
    const rand = mulberry32(seed);
    // 48x48 grid, in the spec's required 40-60 range.
    const W = 48, H = 48;
    const TARGET_MIN = 6, TARGET_MAX = 12;
    const ROOM_MIN = 4, ROOM_MAX = 8;
    const PLACE_ATTEMPTS = 80;
    const MAX_TRIES = 60;

    for (let attempt = 0; attempt < MAX_TRIES; attempt++) {
      // Allocate as walls; type assignment happens after carving.
      const map = new Array(H);
      for (let y = 0; y < H; y++) map[y] = new Array(W).fill(1);

      // Pick non-overlapping rooms with a 1-cell buffer between rooms and from
      // the outer boundary. Up to PLACE_ATTEMPTS tries, capped at TARGET_MAX.
      const rooms = [];
      for (let i = 0; i < PLACE_ATTEMPTS && rooms.length < TARGET_MAX; i++) {
        const w = ROOM_MIN + Math.floor(rand() * (ROOM_MAX - ROOM_MIN + 1));
        const h = ROOM_MIN + Math.floor(rand() * (ROOM_MAX - ROOM_MIN + 1));
        // 1-cell outer wall buffer: x in [1, W-w-1].
        const x = 1 + Math.floor(rand() * (W - w - 1));
        const y = 1 + Math.floor(rand() * (H - h - 1));
        let overlap = false;
        for (let r = 0; r < rooms.length; r++) {
          const o = rooms[r];
          // 1-cell wall buffer between rooms: their AABBs must be separated by
          // at least one cell on at least one axis.
          if (!(x + w + 1 <= o.x || o.x + o.w + 1 <= x ||
                y + h + 1 <= o.y || o.y + o.h + 1 <= y)) {
            overlap = true;
            break;
          }
        }
        if (!overlap) rooms.push({ x, y, w, h });
      }
      if (rooms.length < TARGET_MIN) continue;

      // Carve room interiors to floor.
      for (let r = 0; r < rooms.length; r++) {
        const room = rooms[r];
        for (let y = room.y; y < room.y + room.h; y++) {
          for (let x = room.x; x < room.x + room.w; x++) {
            map[y][x] = 0;
          }
        }
      }

      // L-corridors between consecutive rooms by carve order; this guarantees
      // connectivity by construction. The BFS below is a defensive sanity check.
      for (let i = 1; i < rooms.length; i++) {
        const a = rooms[i - 1];
        const b = rooms[i];
        const ax = a.x + ((a.w / 2) | 0);
        const ay = a.y + ((a.h / 2) | 0);
        const bx = b.x + ((b.w / 2) | 0);
        const by = b.y + ((b.h / 2) | 0);
        if (rand() < 0.5) {
          // HV: horizontal at ay from ax to bx, then vertical at bx from ay to by.
          for (let x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) map[ay][x] = 0;
          for (let y = Math.min(ay, by); y <= Math.max(ay, by); y++) map[y][bx] = 0;
        } else {
          // VH: vertical at ax from ay to by, then horizontal at by from ax to bx.
          for (let y = Math.min(ay, by); y <= Math.max(ay, by); y++) map[y][ax] = 0;
          for (let x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) map[by][x] = 0;
        }
      }

      // Assign wall types: weighted per-cell (~70% brick, ~30% stone). The
      // count guard below forces a flip in the (essentially impossible) case
      // where one type ended up at zero so the spec's "both types present"
      // requirement is never silently violated.
      let count1 = 0, count2 = 0;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          if (map[y][x] !== 0) {
            const t = rand() < 0.7 ? 1 : 2;
            map[y][x] = t;
            if (t === 1) count1++; else count2++;
          }
        }
      }
      if (count1 === 0 || count2 === 0) {
        outer: for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            if (map[y][x] !== 0) {
              map[y][x] = (count1 === 0) ? 1 : 2;
              break outer;
            }
          }
        }
      }

      // Pick starting room and player spawn at its center, facing a random
      // cardinal direction. plane is perpendicular to dir with magnitude 0.66.
      const startIdx = Math.floor(rand() * rooms.length);
      const startRoom = rooms[startIdx];
      const psCellX = startRoom.x + ((startRoom.w / 2) | 0);
      const psCellY = startRoom.y + ((startRoom.h / 2) | 0);
      const dirOpt = Math.floor(rand() * 4);
      let dirX, dirY, planeX, planeY;
      if (dirOpt === 0)      { dirX =  1; dirY =  0; planeX =  0;    planeY =  0.66; }
      else if (dirOpt === 1) { dirX = -1; dirY =  0; planeX =  0;    planeY = -0.66; }
      else if (dirOpt === 2) { dirX =  0; dirY =  1; planeX = -0.66; planeY =  0;    }
      else                   { dirX =  0; dirY = -1; planeX =  0.66; planeY =  0;    }
      const playerSpawn = {
        x: psCellX + 0.5, y: psCellY + 0.5,
        dirX, dirY, planeX, planeY,
      };

      // 4-connected BFS from the spawn cell. Anything unreachable triggers
      // a fresh attempt with a different room layout. The dist array doubles
      // as the connectivity check (any -1 floor cell at the end => unreachable)
      // and as the metric used to pick the farthest non-start room as the exit.
      const dist = new Array(H);
      for (let y = 0; y < H; y++) dist[y] = new Array(W).fill(-1);
      dist[psCellY][psCellX] = 0;
      const queue = [[psCellX, psCellY]];
      let head = 0, visitedCount = 1, totalFloor = 0;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) if (map[y][x] === 0) totalFloor++;
      }
      const dxs = [1, -1, 0, 0], dys = [0, 0, 1, -1];
      while (head < queue.length) {
        const c = queue[head++];
        const cx = c[0], cy = c[1];
        for (let n = 0; n < 4; n++) {
          const nx = cx + dxs[n], ny = cy + dys[n];
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          if (dist[ny][nx] !== -1) continue;
          if (map[ny][nx] !== 0) continue;
          dist[ny][nx] = dist[cy][cx] + 1;
          visitedCount++;
          queue.push([nx, ny]);
        }
      }
      if (visitedCount !== totalFloor) continue;

      // Pick the farthest non-start room (by BFS walking distance to its
      // center) as the exit. Tiebreak by smaller room index for determinism.
      let bestRoom = -1, bestD = -1;
      for (let i = 0; i < rooms.length; i++) {
        if (i === startIdx) continue;
        const r = rooms[i];
        const rx = r.x + ((r.w / 2) | 0);
        const ry = r.y + ((r.h / 2) | 0);
        const d = dist[ry][rx];
        if (d > bestD) { bestD = d; bestRoom = i; }
      }
      // bestRoom can't stay -1: TARGET_MIN >= 6 rooms and the BFS above
      // confirmed full connectivity, so every non-start room is reachable.
      const er = rooms[bestRoom];
      const exitCell = {
        x: er.x + ((er.w / 2) | 0),
        y: er.y + ((er.h / 2) | 0),
      };

      // Enemy spawns: 1-3 per non-starting room at distinct interior floor
      // cells, capped at MAX_ENEMIES total. Type chosen per-spawn from the
      // existing TYPE_TABLE (imp / grunt only).
      const newSpawns = [];
      const MAX_ENEMIES = 36;
      for (let i = 0; i < rooms.length && newSpawns.length < MAX_ENEMIES; i++) {
        if (i === startIdx) continue;
        const room = rooms[i];
        const cells = [];
        for (let y = room.y; y < room.y + room.h; y++) {
          for (let x = room.x; x < room.x + room.w; x++) {
            if (map[y][x] === 0) cells.push({ x, y });
          }
        }
        // Fisher-Yates with the seeded PRNG.
        for (let s = cells.length - 1; s > 0; s--) {
          const j = Math.floor(rand() * (s + 1));
          const tmp = cells[s]; cells[s] = cells[j]; cells[j] = tmp;
        }
        const want = 1 + Math.floor(rand() * 3); // 1..3 inclusive
        const count = Math.min(want, cells.length);
        for (let k = 0; k < count && newSpawns.length < MAX_ENEMIES; k++) {
          const cell = cells[k];
          newSpawns.push({
            x: cell.x + 0.5,
            y: cell.y + 0.5,
            type: rand() < 0.5 ? 'imp' : 'grunt',
          });
        }
      }

      return { map, mapW: W, mapH: H, rooms, playerSpawn, enemySpawns: newSpawns, exitCell, seed };
    }
    // Should be unreachable with sane parameters; guard against silent failure.
    throw new Error('dungeon generation failed after retries');
  }

  function applyDungeon(d) {
    MAP = d.map;
    MAP_W = d.mapW;
    MAP_H = d.mapH;
    PLAYER_SPAWN = d.playerSpawn;
    enemySpawns = d.enemySpawns;
    EXIT = { cellX: d.exitCell.x, cellY: d.exitCell.y };
  }

  function regenerateDungeon() {
    const seed = pickRandomSeed();
    console.info('[seed] ' + seed);
    applyDungeon(generateDungeon(seed));
    resetRun();
  }

  // level-exit-progression: triggered when the player steps onto the exit
  // cell. Carries HP, ammo, and lastFireTime forward; everything else is
  // a fresh dungeon. Always picks a random seed (?seed=<u32> only pins the
  // initial map, not transitions).
  function advanceLevel() {
    const seed = pickRandomSeed();
    console.info('[seed] ' + seed);
    applyDungeon(generateDungeon(seed));
    level += 1;
    enemies = enemySpawns.map(s => makeEnemy(s.x, s.y, s.type));
    player.x = PLAYER_SPAWN.x;
    player.y = PLAYER_SPAWN.y;
    player.dirX = PLAYER_SPAWN.dirX;
    player.dirY = PLAYER_SPAWN.dirY;
    player.planeX = PLAYER_SPAWN.planeX;
    player.planeY = PLAYER_SPAWN.planeY;
    clearTransientFeedback();
    sfxLevelExit();
    levelBannerAtMs = nowMs;
    levelBannerUntilMs = nowMs + 1200;
  }

  // Initial dungeon: honour ?seed=<u32> when supplied so reloads reproduce a
  // bug-report layout exactly. Logged once per generation.
  {
    const initialSeed = parseSeedFromUrl();
    const seed = (initialSeed != null) ? initialSeed : pickRandomSeed();
    console.info('[seed] ' + seed);
    applyDungeon(generateDungeon(seed));
    resetRun();
  }

  // ---------------------------------------------------------------------------
  // AI: line-of-sight + per-enemy state machine. Modes:
  //   idle  — no LOS or LOS just lost; stand still, face the player.
  //   chase — LOS true and dist > ATTACK_RANGE; walk toward player.
  //   wind  — LOS true and dist <= ATTACK_RANGE; stop, telegraph red, fire on expiry.
  //   cool  — post-fire (hit or miss); freeze for TYPE_TABLE[type].cooldownMs, then re-evaluate.
  // ---------------------------------------------------------------------------

  // True iff a DDA ray from the enemy reaches player.{x,y} before any wall.
  // Other enemies do NOT block LOS — only walls do.
  function enemyCanSeePlayer(e) {
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 1e-6) return true;
    const rx = dx / dist, ry = dy / dist;
    let mx = Math.floor(e.x), my = Math.floor(e.y);
    const stepX = rx < 0 ? -1 : 1;
    const stepY = ry < 0 ? -1 : 1;
    const ddx = rx === 0 ? Infinity : Math.abs(1 / rx);
    const ddy = ry === 0 ? Infinity : Math.abs(1 / ry);
    let sideX = (rx < 0 ? e.x - mx : mx + 1 - e.x) * ddx;
    let sideY = (ry < 0 ? e.y - my : my + 1 - e.y) * ddy;
    let traveled = 0;
    // Bound the loop; DDA terminates well before this in any 16x16 map.
    let safety = MAP_W + MAP_H + 4;
    while (traveled < dist && safety-- > 0) {
      if (sideX < sideY) { traveled = sideX; sideX += ddx; mx += stepX; }
      else               { traveled = sideY; sideY += ddy; my += stepY; }
      if (mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H) return false;
      // If we hit a wall before reaching the player's distance, LOS is blocked.
      // traveled >= dist means the wall sits at-or-past the player — still visible.
      if (isWall(mx, my)) return traveled >= dist;
    }
    return true;
  }

  // Axis-resolved enemy collision; mirrors the player's moveAxisX/Y but on `e`.
  function moveEnemyAxisX(e, delta) {
    if (delta === 0) return;
    const r = ENEMY_AI_RADIUS;
    const nx = e.x + delta;
    const probe = nx + (delta > 0 ? r : -r);
    const cellX = Math.floor(probe);
    const cellY1 = Math.floor(e.y - r);
    const cellY2 = Math.floor(e.y + r);
    if (!isWall(cellX, cellY1) && !isWall(cellX, cellY2)) {
      e.x = nx;
    }
  }
  function moveEnemyAxisY(e, delta) {
    if (delta === 0) return;
    const r = ENEMY_AI_RADIUS;
    const ny = e.y + delta;
    const probe = ny + (delta > 0 ? r : -r);
    const cellY = Math.floor(probe);
    const cellX1 = Math.floor(e.x - r);
    const cellX2 = Math.floor(e.x + r);
    if (!isWall(cellX1, cellY) && !isWall(cellX2, cellY)) {
      e.y = ny;
    }
  }

  // Soft enemy-vs-enemy separation; O(N^2) over alive pairs (N <= 16).
  // Smaller push for wind/cool enemies so they don't visibly drift off aim.
  function separateEnemies() {
    const r = ENEMY_SEPARATION_R;
    const r2 = r * r;
    for (let i = 0; i < enemies.length; i++) {
      const a = enemies[i];
      if (!a.alive) continue;
      for (let j = i + 1; j < enemies.length; j++) {
        const b = enemies[j];
        if (!b.alive) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy;
        if (d2 >= r2) continue;
        const d = Math.sqrt(d2);
        if (d < 1e-6) continue;
        const overlap = r - d;
        const ux = dx / d, uy = dy / d;
        const aLocked = a.mode === 'wind' || a.mode === 'cool';
        const bLocked = b.mode === 'wind' || b.mode === 'cool';
        const aFactor = aLocked ? 0.15 : 0.5;
        const bFactor = bLocked ? 0.15 : 0.5;
        moveEnemyAxisX(a, -ux * overlap * aFactor);
        moveEnemyAxisY(a, -uy * overlap * aFactor);
        moveEnemyAxisX(b,  ux * overlap * bFactor);
        moveEnemyAxisY(b,  uy * overlap * bFactor);
      }
    }
  }

  // Per-type windup-tell. Plays exactly once on idle/chase → wind transitions;
  // cancellation paths (wind → idle/chase) must not call this.
  function enterWind(e, now) {
    e.mode = 'wind';
    e.modeUntil = now + TYPE_TABLE[e.type].windupMs;
    const vol = distanceVolume(e.x, e.y);
    if (e.type === 'imp') sfxImpWindup(vol);
    else if (e.type === 'grunt') sfxGruntWindup(vol);
  }

  // Resolve a hitscan shot fired by enemy `e` at the moment its windup expires.
  // Counts enemyShotsFired regardless of outcome; counts enemyShotsHit only on hit.
  // Misses if: enemy dead, LOS lost, dist > ATTACK_RANGE+0.5, or wall blocks the ray.
  function enemyFireShot(e, now) {
    stats.enemyShotsFired++;
    e.fireFlashUntil = now + ENEMY_FIRE_FLASH_MS;
    // Fire SFX sits above the gates so a windup-completed shot still gets
    // audible feedback even when the ray ends up blocked or out of range.
    const fireVol = distanceVolume(e.x, e.y);
    if (e.type === 'imp') sfxImpFire(fireVol);
    else if (e.type === 'grunt') sfxGruntFire(fireVol);

    if (!e.alive) return;
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist > ATTACK_RANGE + 0.5) return;
    if (!enemyCanSeePlayer(e)) return;
    if (dist > 1e-6) {
      const rx = dx / dist, ry = dy / dist;
      const wallDist = castRay(e.x, e.y, rx, ry);
      if (wallDist < dist) return;
    }

    stats.enemyShotsHit++;
    player.hp -= e.rangedDamage;
    sfxHurt();
    triggerDamageFlash(now);
    setDamageArrow(e, now);
    if (player.hp <= 0) {
      player.hp = 0;
      stats.deaths++;
    }
  }

  function aiTick(dt) {
    const now = performance.now();
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      e.animPhase += dt * 4; // ~4 Hz between two frames

      // cool → idle on expiry; let the mode-eval block below pick the next mode.
      if (e.mode === 'cool' && now >= e.modeUntil) {
        e.mode = 'idle';
        e.modeUntil = 0;
      }

      const dx = player.x - e.x, dy = player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 1e-6) { e.dirX = dx / dist; e.dirY = dy / dist; }

      // wind → fire & cool on expiry. Fire happens before any cancellation check
      // so the player can't squeeze a one-frame escape after the windup elapses.
      if (e.mode === 'wind' && now >= e.modeUntil) {
        enemyFireShot(e, now);
        e.mode = 'cool';
        e.modeUntil = now + TYPE_TABLE[e.type].cooldownMs;
        continue;
      }

      const seen = enemyCanSeePlayer(e);

      if (e.mode === 'idle') {
        if (seen && dist <= ATTACK_RANGE) {
          enterWind(e, now);
        } else if (seen) {
          e.mode = 'chase';
        }
      } else if (e.mode === 'chase') {
        if (!seen) {
          e.mode = 'idle';
        } else if (dist <= ATTACK_RANGE) {
          enterWind(e, now);
        } else if (dist > 1e-6) {
          const stepLen = e.moveSpeed * dt;
          moveEnemyAxisX(e, (dx / dist) * stepLen);
          moveEnemyAxisY(e, (dy / dist) * stepLen);
        }
      } else if (e.mode === 'wind') {
        // Cancellation: lost LOS or stepped out of range → bail out without
        // costing a cooldown. Fired windups (above) go to cool instead.
        if (!seen) {
          e.mode = 'idle';
          e.modeUntil = 0;
        } else if (dist > ATTACK_RANGE + 0.5) {
          e.mode = 'chase';
          e.modeUntil = 0;
        }
      }
      // 'cool': hold position; re-evaluated when modeUntil expires next tick.
    }

    separateEnemies();
  }

  // DDA along an arbitrary unit ray. Mirrors castColumn's wall logic but
  // takes origin + direction explicitly; returns perpendicular wall distance.
  function castRay(originX, originY, rayDirX, rayDirY) {
    let mapX = Math.floor(originX);
    let mapY = Math.floor(originY);
    const deltaDistX = rayDirX === 0 ? Infinity : Math.abs(1 / rayDirX);
    const deltaDistY = rayDirY === 0 ? Infinity : Math.abs(1 / rayDirY);
    let stepX, stepY, sideDistX, sideDistY;
    if (rayDirX < 0) { stepX = -1; sideDistX = (originX - mapX) * deltaDistX; }
    else             { stepX =  1; sideDistX = (mapX + 1.0 - originX) * deltaDistX; }
    if (rayDirY < 0) { stepY = -1; sideDistY = (originY - mapY) * deltaDistY; }
    else             { stepY =  1; sideDistY = (mapY + 1.0 - originY) * deltaDistY; }
    let side = 0;
    let safety = MAP_W + MAP_H + 4;
    while (safety-- > 0) {
      if (sideDistX < sideDistY) { sideDistX += deltaDistX; mapX += stepX; side = 0; }
      else                       { sideDistY += deltaDistY; mapY += stepY; side = 1; }
      if (mapX < 0 || mapY < 0 || mapX >= MAP_W || mapY >= MAP_H) break;
      if (MAP[mapY][mapX] > 0) break;
    }
    let perp;
    if (side === 0) perp = (mapX - originX + (1 - stepX) * 0.5) / rayDirX;
    else            perp = (mapY - originY + (1 - stepY) * 0.5) / rayDirY;
    if (!(perp > 0.0001)) perp = 0.0001;
    return perp;
  }

  function fireShot() {
    if (player.hp <= 0) return;            // frozen death state — no fire
    const now = performance.now();
    if (now - lastFireTime < FIRE_COOLDOWN_MS) return; // cooldown drops input
    if (ammo <= 0) {
      // Dry trigger — counters untouched, but a distinct click plays.
      sfxDryFire();
      onPlayerFire('dry');
      return;
    }
    lastFireTime = now;
    ammo--;
    stats.shotsFired++;
    sfxShot();
    muzzleFlashUntil = now + MUZZLE_FLASH_MS;
    onPlayerFire('shot');

    const dWall = castRay(player.x, player.y, player.dirX, player.dirY);

    // Nearest enemy along the ray within enemyRadius perpendicular and < dWall.
    let bestT = Infinity;
    let bestE = null;
    const r2 = ENEMY_RADIUS * ENEMY_RADIUS;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const lx = e.x - player.x;
      const ly = e.y - player.y;
      const tProj = lx * player.dirX + ly * player.dirY;
      if (tProj <= 0 || tProj >= dWall) continue;
      const perp2 = lx * lx + ly * ly - tProj * tProj;
      if (perp2 > r2) continue;
      if (tProj < bestT) { bestT = tProj; bestE = e; }
    }

    if (bestE) {
      stats.shotsHit++;
      sfxHit();
      hitTintUntil = now + HIT_TINT_MS;
      bestE.hitFlashUntil = now + ENEMY_FLASH_MS;
      bestE.hp -= SHOT_DAMAGE;
      if (bestE.hp <= 0) {
        bestE.alive = false;
        stats.kills++;
        sfxKill();
        ammo = Math.min(MAX_AMMO, ammo + AMMO_REFUND);
        // hud-feedback-polish: spawn a "+1" pop at the kill location. Cap at
        // KILL_POP_MAX so a long burst can't grow the array unbounded.
        if (killPops.length < KILL_POP_MAX) {
          killPops.push({ x: bestE.x, y: bestE.y, atMs: now, untilMs: now + 500 });
        }
      }
    }
  }

  function applyContactDamage(dt) {
    if (player.hp <= 0) return;
    const r2 = CONTACT_RADIUS * CONTACT_RADIUS;
    // Track the nearest touching enemy; the direction arrow points at it so
    // that walking around a clump of enemies aims at whichever is currently
    // hugging the player.
    let nearestE = null;
    let nearestD2 = Infinity;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const dx = e.x - player.x;
      const dy = e.y - player.y;
      const d2 = dx * dx + dy * dy;
      if (d2 <= r2 && d2 < nearestD2) {
        nearestE = e;
        nearestD2 = d2;
      }
    }
    if (!nearestE) return;
    player.hp -= CONTACT_DPS * dt;
    // Throttle: continuous DPS would otherwise stack a buzz every frame.
    if (nowMs >= nextContactHurtMs) {
      sfxHurt();
      nextContactHurtMs = nowMs + 300;
    }
    // hud-feedback-polish: mirror the audio cadence for the vignette so the
    // red flash pulses instead of going opaque while in continuous contact.
    if (nowMs >= nextDmgFlashMs) {
      triggerDamageFlash(nowMs);
      nextDmgFlashMs = nowMs + 300;
    }
    setDamageArrow(nearestE, nowMs);
    if (player.hp <= 0) {
      player.hp = 0;
      stats.deaths++;
    }
  }

  // Per-row floor/ceiling cast (Lode-Vandevenne). Replaces the old flat
  // fillBackground and the sky/ground gradient fills: every floor row's
  // perpendicular distance is recomputed from screen y, then the texture is
  // sampled across the row with stepX/Y increments. The ceiling row at H-1-y
  // mirrors the floor row using the same (fx, fy) world coords but a
  // different texture. The lighting branch is hoisted out of the inner x
  // loop so per-pixel work stays integer-only.
  function castFloorCeiling() {
    const FLOOR_TEX = TEXTURES.floor;
    const CEIL_TEX  = TEXTURES.ceiling;
    const rayDirX0 = player.dirX - player.planeX;
    const rayDirY0 = player.dirY - player.planeY;
    const rayDirX1 = player.dirX + player.planeX;
    const rayDirY1 = player.dirY + player.planeY;
    const dRayX = (rayDirX1 - rayDirX0) / W;
    const dRayY = (rayDirY1 - rayDirY0) / W;
    const fogR = FOG_C & 0xff;
    const fogG = (FOG_C >> 8) & 0xff;
    const fogB = (FOG_C >> 16) & 0xff;
    const fogDenom = FOG_FAR - FOG_NEAR;

    for (let y = HALF_H + 1; y < H; y++) {
      const p = y - HALF_H;
      const rowDist = HALF_H / p;
      const stepX = rowDist * dRayX;
      const stepY = rowDist * dRayY;
      let fx = player.x + rowDist * rayDirX0;
      let fy = player.y + rowDist * rayDirY0;
      let iFloor = y * W;
      let iCeil  = (H - 1 - y) * W;

      if (lightingEnabled) {
        let t = (rowDist - FOG_NEAR) / fogDenom;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        const it = (t * 256) | 0;
        const ib = 256 - it;
        for (let xx = 0; xx < W; xx++) {
          const tx = ((fx * TEX_SIZE) | 0) & TEX_MASK;
          const ty = ((fy * TEX_SIZE) | 0) & TEX_MASK;
          const idx = ty * TEX_SIZE + tx;
          const cF = FLOOR_TEX[idx];
          const cC = CEIL_TEX[idx];
          const fr = (((cF        ) & 0xff) * ib + fogR * it) >> 8;
          const fg = (((cF >>>  8) & 0xff) * ib + fogG * it) >> 8;
          const fb = (((cF >>> 16) & 0xff) * ib + fogB * it) >> 8;
          buf32[iFloor++] = (255 << 24) | (fb << 16) | (fg << 8) | fr;
          const cr = (((cC        ) & 0xff) * ib + fogR * it) >> 8;
          const cg = (((cC >>>  8) & 0xff) * ib + fogG * it) >> 8;
          const cb = (((cC >>> 16) & 0xff) * ib + fogB * it) >> 8;
          buf32[iCeil++] = (255 << 24) | (cb << 16) | (cg << 8) | cr;
          fx += stepX;
          fy += stepY;
        }
      } else {
        const shade = Math.min(1, 5 / (rowDist + 0.5));
        const shadeI = (shade * 256) | 0;
        for (let xx = 0; xx < W; xx++) {
          const tx = ((fx * TEX_SIZE) | 0) & TEX_MASK;
          const ty = ((fy * TEX_SIZE) | 0) & TEX_MASK;
          const idx = ty * TEX_SIZE + tx;
          const cF = FLOOR_TEX[idx];
          const cC = CEIL_TEX[idx];
          const fr = ((cF         & 0xff) * shadeI) >>> 8;
          const fg = (((cF >>>  8) & 0xff) * shadeI) >>> 8;
          const fb = (((cF >>> 16) & 0xff) * shadeI) >>> 8;
          buf32[iFloor++] = (255 << 24) | (fb << 16) | (fg << 8) | fr;
          const cr = ((cC         & 0xff) * shadeI) >>> 8;
          const cg = (((cC >>>  8) & 0xff) * shadeI) >>> 8;
          const cb = (((cC >>> 16) & 0xff) * shadeI) >>> 8;
          buf32[iCeil++] = (255 << 24) | (cb << 16) | (cg << 8) | cr;
          fx += stepX;
          fy += stepY;
        }
      }
    }
    // Horizon row (p === 0 ⇒ rowDist === Infinity). Walls usually overwrite
    // it; pure black is the limit of both the fog blend and the distance
    // shade as rowDist → ∞.
    buf32.fill(0xff000000, HALF_H * W, HALF_H * W + W);
  }

  function render() {
    castFloorCeiling();

    // Hoist fog channel constants out of the column loop.
    const fogR = FOG_C & 0xff;
    const fogG = (FOG_C >> 8) & 0xff;
    const fogB = (FOG_C >> 16) & 0xff;
    const fogDenom = FOG_FAR - FOG_NEAR;

    for (let x = 0; x < W; x++) {
      const hit = castColumn(x);
      const d = hit.perpWallDist;
      zBuffer[x] = d;

      const tex = WALL_TEX[hit.wallType] || TEXTURES.brick;
      const rayDirX = hit.rayDirX;
      const rayDirY = hit.rayDirY;

      let wallX = (hit.side === 0)
        ? (player.y + d * rayDirY)
        : (player.x + d * rayDirX);
      wallX -= Math.floor(wallX);
      let texX = (wallX * TEX_SIZE) | 0;
      if ((hit.side === 0 && rayDirX > 0) || (hit.side === 1 && rayDirY < 0)) {
        texX = TEX_MASK - texX;
      }

      let lineHeight = (H / d) | 0;
      if (lineHeight < 1) lineHeight = 1;
      const drawStart = (H - lineHeight) >> 1;
      const drawEnd   = drawStart + lineHeight;
      const yStart = drawStart < 0 ? 0 : drawStart;
      const yEnd   = drawEnd > H ? H : drawEnd;
      const step   = ((TEX_SIZE << 16) / lineHeight) | 0;
      let texPos   = ((yStart - drawStart) * step) | 0;

      const sideMul = (hit.side === 1) ? 0.6 : 1.0;

      if (lightingEnabled) {
        // Distance fog replaces the old 1/d shade — running both produces a
        // muddy mid-distance band (see spec / "common pitfalls").
        let t = (d - FOG_NEAR) / fogDenom;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        const it = (t * 256) | 0;
        const ib = 256 - it;
        const sideI = (sideMul * 256) | 0;
        let i = yStart * W + x;
        for (let y = yStart; y < yEnd; y++) {
          const tY = (texPos >>> 16) & TEX_MASK;
          texPos = (texPos + step) | 0;
          const c = tex[tY * TEX_SIZE + texX];
          const r0 = ((c         & 0xff) * sideI) >>> 8;
          const g0 = (((c >>>  8) & 0xff) * sideI) >>> 8;
          const b0 = (((c >>> 16) & 0xff) * sideI) >>> 8;
          const r = (r0 * ib + fogR * it) >> 8;
          const g = (g0 * ib + fogG * it) >> 8;
          const b = (b0 * ib + fogB * it) >> 8;
          buf32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
          i += W;
        }
      } else {
        const shade = Math.min(1, 5 / (d + 0.5));
        const shadeI = (shade * sideMul * 256) | 0;
        let i = yStart * W + x;
        for (let y = yStart; y < yEnd; y++) {
          const tY = (texPos >>> 16) & TEX_MASK;
          texPos = (texPos + step) | 0;
          const c = tex[tY * TEX_SIZE + texX];
          const r = ((c         & 0xff) * shadeI) >>> 8;
          const g = (((c >>>  8) & 0xff) * shadeI) >>> 8;
          const b = (((c >>> 16) & 0xff) * shadeI) >>> 8;
          buf32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
          i += W;
        }
      }
    }

    drawSprites();

    if (lightingEnabled) {
      // Vignette: per-pixel multiply against the precomputed table. One pass
      // over W*H ≈ 130k pixels, well under a millisecond on modern hardware.
      const N = W * H;
      for (let i = 0; i < N; i++) {
        const m = VIGNETTE[i];
        if (m === 256) continue; // no-op band near screen center
        const c = buf32[i];
        const r = ((c & 0xff) * m) >> 8;
        const g = (((c >> 8) & 0xff) * m) >> 8;
        const b = (((c >> 16) & 0xff) * m) >> 8;
        buf32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
      }
    }

    // gun-viewmodel: blit the procedural pistol + (conditional) muzzle flash
    // into buf32 after the vignette pass so the gun reads as HUD-class and
    // is not darkened at the screen corners. Skipped when the player is dead.
    drawGunViewmodel();

    ctx.putImageData(buf, 0, 0);

    drawEnemyMuzzleFlashes();

    // Crosshair: 3-pixel cross in the middle. Tints red briefly after a hit.
    // 1-px black outline (drawn first, beneath) keeps the crosshair legible
    // against bright walls on both desktop and touch.
    const crossColor = (nowMs < hitTintUntil) ? '#f44' : '#fff';
    const cx = W >> 1, cy = H >> 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - 2, cy - 1, 5, 3);
    ctx.fillRect(cx - 1, cy - 2, 3, 5);
    ctx.fillStyle = crossColor;
    ctx.fillRect(cx - 1, cy, 3, 1);
    ctx.fillRect(cx, cy - 1, 1, 3);

    // Additive muzzle flash overlay: lower-center, decays after MUZZLE_FLASH_MS.
    if (nowMs < muzzleFlashUntil) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255, 220, 80, 0.55)';
      ctx.fillRect((W * 0.30) | 0, (H * 0.55) | 0, (W * 0.40) | 0, (H * 0.25) | 0);
      ctx.globalCompositeOperation = 'source-over';
    }

    // hud-feedback-polish: vignette + heartbeat sit under the HUD strip; kill
    // pops sit between the vignette and the HUD so they never cover readouts.
    drawDamageEdges();
    drawKillPops();

    drawMinimap();

    // FPS counter overlay.
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(2, 2, 64, 16);
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText(fps.toFixed(0) + ' fps', 6, 4);

    // atmosphere-lighting: brief debug overlay after each L toggle.
    if (nowMs - lightingToggledAtMs < 2000) {
      const a = 1 - (nowMs - lightingToggledAtMs) / 2000;
      const text = 'lighting: ' + (lightingEnabled ? 'on' : 'off');
      ctx.fillStyle = `rgba(0,0,0,${(a * 0.55).toFixed(3)})`;
      ctx.fillRect(2, 20, 96, 16);
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.fillText(text, 6, 22);
    }

    drawHUD();

    // hud-feedback-polish: damage arrow draws on top of the HUD strip so it
    // stays visible when the player is huddled in a corner; under death overlay.
    drawDamageArrow();

    // level-exit-progression: "LEVEL N" banner on transition. Sits under the
    // death overlay so "YOU DIED" wins when both are simultaneously active.
    if (nowMs < levelBannerUntilMs) {
      const elapsed = nowMs - levelBannerAtMs;
      const fadeStart = (levelBannerUntilMs - levelBannerAtMs) - 400;
      const a = elapsed < fadeStart
        ? 1
        : Math.max(0, 1 - (elapsed - fadeStart) / 400);
      const stripY = (H * 0.32) | 0;
      ctx.fillStyle = `rgba(0,0,0,${(a * 0.55).toFixed(3)})`;
      ctx.fillRect(0, stripY, W, 28);
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.font = '18px monospace';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL ' + level, W >> 1, stripY + 14);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
    }

    if (player.hp <= 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, (H >> 1) - 14, W, 28);
      ctx.fillStyle = '#f55';
      ctx.font = '12px monospace';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'center';
      const deathText = isTouchDevice
        ? 'YOU DIED — tap RESET to restart'
        : 'YOU DIED — press R to restart';
      ctx.fillText(deathText, W >> 1, (H >> 1) - 6);
      ctx.textAlign = 'left';
    }

    // mobile-touch-controls: touch HUD overlays (joystick / fire / util
    // row or RESET). Early-returns on desktop. Drawn after the death
    // overlay so RESET / util buttons are not dimmed by it.
    drawTouchHUD();

    // mobile-touch-polish: tap-to-begin overlay. Drawn last so it sits
    // above everything (including the death overlay and touchHUD). One-
    // shot: gated on isTouchDevice && !audioStarted, so desktop pays a
    // single boolean check per frame.
    if (isTouchDevice && !audioStarted) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      const panelW = 160, panelH = 32;
      const px = ((W - panelW) >> 1), py = ((H - panelH) >> 1);
      ctx.fillStyle   = 'rgba(0,0,0,0.55)';
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 1;
      roundRect(px, py, panelW, panelH, BTN_R);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = '14px monospace';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillText('TAP TO BEGIN', px + panelW / 2, py + panelH / 2);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
    }
  }

  // ---------------------------------------------------------------------------
  // hud-feedback-polish: damage vignette + heartbeat, kill "+1" pops, and the
  // damage-direction arrow. All four helpers consume `nowMs` directly so the
  // timers stay in sync with the rest of the frame.
  // ---------------------------------------------------------------------------
  function triggerDamageFlash(t) {
    dmgFlashAt = t;
    dmgFlashUntil = t + 250;
  }

  function setDamageArrow(srcEnemy, t) {
    const dx = srcEnemy.x - player.x;
    const dy = srcEnemy.y - player.y;
    if (dx === 0 && dy === 0) return;
    dmgArrow = {
      worldAngle: Math.atan2(dy, dx),
      atMs: t,
      untilMs: t + 600,
    };
  }

  function drawDamageEdges() {
    let alphaFlash = 0;
    if (nowMs < dmgFlashUntil) {
      const t = (nowMs - dmgFlashAt) / 250;       // 0 -> 1 over the flash
      alphaFlash = 0.45 * (1 - t);
    }
    let alphaPulse = 0;
    if (player.hp > 0 && player.hp <= 30) {
      const hpFrac = player.hp / 30;              // 1 at HP=30, 0 at HP=0
      const rateHz = 1 + (1 - hpFrac) * 1.5;      // 1 Hz -> 2.5 Hz
      const phase = (nowMs / 1000) * rateHz * 2 * Math.PI;
      alphaPulse = 0.10 + 0.10 * (Math.sin(phase) * 0.5 + 0.5);
    }
    // Max (not sum) so simultaneous flash + pulse never saturate to opaque red.
    const a = Math.max(alphaFlash, alphaPulse);
    if (a <= 0) return;
    ctx.fillStyle = `rgba(220, 30, 30, ${a.toFixed(3)})`;
    const T = 28;
    ctx.fillRect(0, 0, W, T);
    ctx.fillRect(0, H - T, W, T);
    ctx.fillRect(0, 0, T, H);
    ctx.fillRect(W - T, 0, T, H);
  }

  function drawKillPops() {
    if (killPops.length === 0) return;
    // Same camera math as drawSprites(); kept inline (4 lines) so this section
    // is self-contained.
    const invDet = 1 / (player.planeX * player.dirY - player.dirX * player.planeY);
    const halfW = W >> 1;
    const halfH = H >> 1;
    ctx.font = '10px monospace';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    for (let i = killPops.length - 1; i >= 0; i--) {
      const p = killPops[i];
      if (nowMs >= p.untilMs) { killPops.splice(i, 1); continue; }
      const t = (nowMs - p.atMs) / (p.untilMs - p.atMs); // 0 -> 1
      const camX = p.x - player.x;
      const camY = p.y - player.y;
      const transformX = invDet * (player.dirY * camX - player.dirX * camY);
      const transformY = invDet * (-player.planeY * camX + player.planeX * camY);
      // Behind the player: hide this frame but keep the pop alive.
      if (transformY <= 0) continue;
      const screenX = (halfW * (1 + transformX / transformY)) | 0;
      const screenY = (halfH - 12 * t) | 0;       // float up ~12 px
      const a = 1 - t;
      ctx.fillStyle = `rgba(0,0,0,${(a * 0.7).toFixed(3)})`;
      ctx.fillText('+1', screenX + 1, screenY + 1);
      ctx.fillStyle = `rgba(255,255,224,${a.toFixed(3)})`;
      ctx.fillText('+1', screenX, screenY);
    }
    // Restore defaults the rest of the HUD code expects.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
  }

  // mobile-touch-polish: 4-corner rounded-rect path builder. Builds a
  // path via moveTo + arcTo so callers can stroke and / or fill on the
  // same path. Caller is responsible for beginPath / fill / stroke.
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  // mobile-touch-controls: render the touch HUD overlay (joystick base /
  // thumb when active, fire button, util row or RESET when dead). Drawn
  // in framebuffer coordinates so its hit-test math (in the same pixel
  // space) and visual pixels stay locked together.
  function drawTouchHUD() {
    if (!isTouchDevice) return;
    // mobile-touch-polish: joystick fades in / out over FADE_MS via an
    // ease-linear alpha envelope. Input is gated on active && !fading in
    // update(), so the fade-out doesn't keep moving the player.
    const FADE_MS = 120;
    let joyAlpha = 0;
    if (joyVec.active) {
      if (joyVec.fading) {
        joyAlpha = Math.max(0, 1 - (nowMs - joyVec.hiddenAtMs) / FADE_MS);
        if (joyAlpha === 0) {
          joyVec.active = false;
          joyVec.fading = false;
          joyVec.id = -1;
          joyVec.x = 0;
          joyVec.y = 0;
        }
      } else {
        joyAlpha = Math.min(1, (nowMs - joyVec.shownAtMs) / FADE_MS);
      }
    }
    if (joyVec.active && joyAlpha > 0) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.25 * joyAlpha).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(joyVec.ax, joyVec.ay, JOY_RADIUS, 0, Math.PI * 2);
      ctx.stroke();
      const tx = joyVec.ax + joyVec.x * JOY_RADIUS;
      const ty = joyVec.ay + joyVec.y * JOY_RADIUS;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.35 * joyAlpha).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(tx, ty, 12, 0, Math.PI * 2);
      ctx.fill();
    }
    // Fire button (circle — softer resting fill so the red pressed state
    // stands out more; press visual is immediate per AC #3).
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.fillStyle = firePressed ? 'rgba(255,80,80,0.25)' : 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.arc(W - 36, H - 36, FIRE_BTN_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Util row / RESET — rounded-rect background with press-state palette.
    ctx.font = '12px monospace';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    if (player.hp <= 0) {
      const x = (W / 2) - 40, y = (H / 2) + 32;
      const pressed = utilPressed.RESET !== 0;
      ctx.fillStyle   = pressed ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.55)';
      ctx.strokeStyle = pressed ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.65)';
      roundRect(x, y, 80, 24, BTN_R);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillText('RESET', x + 40, y + 12);
    } else {
      const y0 = 22;
      const labels = ['N', 'L', 'M'];
      const xs = [2, 26, 50];
      for (let i = 0; i < 3; i++) {
        const x = xs[i];
        const label = labels[i];
        const pressed = utilPressed[label] !== 0;
        ctx.fillStyle   = pressed ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.55)';
        ctx.strokeStyle = pressed ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.65)';
        roundRect(x, y0, BTN_W, BTN_H, BTN_R);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.fillText(label, x + BTN_W / 2, y0 + BTN_H / 2);
        // Mute indicator: 1-px diagonal strikethrough through the M label.
        if (label === 'M' && muted) {
          ctx.strokeStyle = 'rgba(255,80,80,0.9)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + 3,           y0 + 3);
          ctx.lineTo(x + BTN_W - 3,   y0 + BTN_H - 3);
          ctx.stroke();
        }
      }
    }
    // Restore defaults the rest of the HUD code expects.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
  }

  function drawDamageArrow() {
    if (!dmgArrow) return;
    if (nowMs >= dmgArrow.untilMs) { dmgArrow = null; return; }
    const t = (nowMs - dmgArrow.atMs) / (dmgArrow.untilMs - dmgArrow.atMs);
    const a = 1 - t;
    // Player forward (dirX, dirY) maps to "up" on screen, so screenAngle =
    // worldAngle - playerForwardAngle - pi/2. Verified against the four
    // cardinal directions (front/back/left/right) of the player.
    const fwd = Math.atan2(player.dirY, player.dirX);
    const screenAngle = dmgArrow.worldAngle - fwd - Math.PI / 2;
    const cx = W / 2, cy = H / 2;
    const radius = Math.min(W, H) / 2 - 28;
    const ax = cx + Math.cos(screenAngle) * radius;
    const ay = cy + Math.sin(screenAngle) * radius;
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(screenAngle + Math.PI / 2); // local triangle points up; rotate so tip faces outward
    ctx.fillStyle = `rgba(220, 30, 30, ${a.toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.lineTo(-5, 4);
    ctx.lineTo(5, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    // mobile-touch-polish: bump strip + font on touch so HP/AMMO/LEVEL/KILLS
    // are readable at thumb-distance. Desktop branch stays byte-identical.
    const HUD_FONT_PX = isTouchDevice ? 14 : 12;
    const HUD_STRIP_H = isTouchDevice ? 22 : 18;
    const textY = H - HUD_STRIP_H + 4;
    const hpFrac = Math.max(0, Math.min(1, player.hp / MAX_HP));
    // HUD strip background to keep text legible against any wall colour.
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H - HUD_STRIP_H, W, HUD_STRIP_H);
    // Thin red HP bar always sits exactly 2 px above the strip.
    ctx.fillStyle = '#400';
    ctx.fillRect(0, H - HUD_STRIP_H - 2, W, 2);
    ctx.fillStyle = '#e22';
    ctx.fillRect(0, H - HUD_STRIP_H - 2, (W * hpFrac) | 0, 2);

    ctx.font = HUD_FONT_PX + 'px monospace';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('HP   ' + (Math.ceil(player.hp) | 0), 4, textY);

    // hud-feedback-polish: AMMO turns warning-red at 5 and pulses at 0.
    let ammoColor = '#fff';
    if (ammo === 0) {
      // ~3 Hz pulse between two reds: 167 ms ≈ 1/(2*3 Hz).
      ammoColor = (Math.floor(nowMs / 167) % 2 === 0) ? '#f55' : '#a22';
    } else if (ammo <= 5) {
      ammoColor = '#f55';
    }
    ctx.fillStyle = ammoColor;
    ctx.textAlign = 'center';
    ctx.fillText('AMMO  ' + ammo + ' / ' + MAX_AMMO, (W * 0.40) | 0, textY);

    // level-exit-progression: LEVEL readout sits between AMMO and KILLS.
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + level, (W * 0.65) | 0, textY);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'right';
    ctx.fillText('KILLS ' + stats.kills, W - 4, textY);
    ctx.textAlign = 'left';
  }

  // ---------------------------------------------------------------------------
  // Minimap: 96x96 px, top-left (8 px inset), centered on the player. Drawn
  // via ctx after the world blit so the triangle and dots stay crisp.
  // ---------------------------------------------------------------------------
  const MM_X = 8;
  const MM_Y = 8;
  const MM_SIZE = 96;
  const MM_CELLS = 12;
  const MM_CELL_PX = MM_SIZE / MM_CELLS; // 8 px per world cell

  function drawMinimap() {
    const cellPx = MM_CELL_PX;
    const half = MM_SIZE / 2;
    const cx = MM_X + half;
    const cy = MM_Y + half;

    // Backdrop
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(MM_X, MM_Y, MM_SIZE, MM_SIZE);

    // Player-centered camera in world cells.
    const originX = player.x - MM_CELLS / 2;
    const originY = player.y - MM_CELLS / 2;
    const startX = Math.floor(originX);
    const startY = Math.floor(originY);
    const endX = startX + MM_CELLS + 1;
    const endY = startY + MM_CELLS + 1;

    // Clip so partial cells at the edges don't bleed past the minimap rect.
    ctx.save();
    ctx.beginPath();
    ctx.rect(MM_X, MM_Y, MM_SIZE, MM_SIZE);
    ctx.clip();

    for (let my = startY; my <= endY; my++) {
      if (my < 0 || my >= MAP_H) continue;
      const row = MAP[my];
      for (let mx = startX; mx <= endX; mx++) {
        if (mx < 0 || mx >= MAP_W) continue;
        const cell = row[mx];
        if (cell === 0) continue;
        const sx = (mx - originX) * cellPx + MM_X;
        const sy = (my - originY) * cellPx + MM_Y;
        // Approximate the in-world wall colours (brick = red, stone = blue).
        ctx.fillStyle = (cell === 2) ? '#4a78c8' : '#c8503c';
        ctx.fillRect(sx, sy, cellPx, cellPx);
      }
    }

    // level-exit-progression: paint the exit cell after walls and before
    // enemy dots / player triangle, so live enemies and the player still
    // draw on top when standing on it.
    if (EXIT.cellX >= startX && EXIT.cellX <= endX &&
        EXIT.cellY >= startY && EXIT.cellY <= endY) {
      const ex = (EXIT.cellX - originX) * cellPx + MM_X;
      const ey = (EXIT.cellY - originY) * cellPx + MM_Y;
      ctx.fillStyle = '#3f3';
      ctx.fillRect(ex, ey, cellPx, cellPx);
    }

    // Live enemies as 2x2 red dots (centered on the enemy's cell position).
    ctx.fillStyle = '#f33';
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const sx = (e.x - originX) * cellPx + MM_X - 1;
      const sy = (e.y - originY) * cellPx + MM_Y - 1;
      if (sx < MM_X - 2 || sx > MM_X + MM_SIZE) continue;
      if (sy < MM_Y - 2 || sy > MM_Y + MM_SIZE) continue;
      ctx.fillRect(sx, sy, 2, 2);
    }

    ctx.restore();

    // Player triangle, rotated to face along (dirX, dirY). The local "tip"
    // sits at (0, -3) (screen-up in local space). Under canvas Y-down, rotating
    // local "up" (0, -1) onto world facing (dirX, dirY) needs +pi/2, not -pi/2.
    const angle = Math.atan2(player.dirY, player.dirX) + Math.PI / 2;
    const cs = Math.cos(angle), sn = Math.sin(angle);
    const tri = [[0, -3], [-2, 2], [2, 2]];
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    for (let i = 0; i < tri.length; i++) {
      const lx = tri[i][0], ly = tri[i][1];
      const wx = lx * cs - ly * sn + cx;
      const wy = lx * sn + ly * cs + cy;
      if (i === 0) ctx.moveTo(wx, wy);
      else ctx.lineTo(wx, wy);
    }
    ctx.closePath();
    ctx.fill();
  }

  // ---------------------------------------------------------------------------
  // Sprite renderer. Runs after the wall pass populates `zBuffer` and before
  // the single putImageData blit. Per-screen-column z-test against `zBuffer`.
  // ---------------------------------------------------------------------------
  // Scratch list reused each frame to avoid allocation in the hot loop.
  const spriteOrder = [];
  // level-exit-progression: synthetic "entity" used to feed the exit pillar
  // into the existing sprite pipeline. Reused across frames so we don't
  // allocate; only x/y are updated when EXIT changes via the getter below.
  const exitSpriteEntity = {
    x: 0, y: 0,
    type: 'exit',
    animPhase: 0,
    hitFlashUntil: 0,
    fireFlashUntil: 0,
    mode: 'idle',
    modeUntil: 0,
  };

  function drawSprites() {
    spriteOrder.length = 0;
    const px = player.x, py = player.y;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const dx = e.x - px;
      const dy = e.y - py;
      spriteOrder.push({ e, dx, dy, d2: dx * dx + dy * dy, id: i });
    }
    // Push the exit pillar as a synthetic entry. id: -1 keeps the sort
    // stable in the (rare) tie case where a sprite sits at the same d2.
    exitSpriteEntity.x = EXIT.cellX + 0.5;
    exitSpriteEntity.y = EXIT.cellY + 0.5;
    {
      const dx = exitSpriteEntity.x - px;
      const dy = exitSpriteEntity.y - py;
      spriteOrder.push({ e: exitSpriteEntity, dx, dy, d2: dx * dx + dy * dy, id: -1 });
    }
    if (spriteOrder.length === 0) return;
    // Farthest first so nearer sprites overdraw. Stable tiebreak on id.
    spriteOrder.sort((a, b) => (b.d2 - a.d2) || (a.id - b.id));

    const invDet = 1.0 / (player.planeX * player.dirY - player.dirX * player.planeY);
    const halfW = W >> 1;
    const halfH = H >> 1;

    for (let s = 0; s < spriteOrder.length; s++) {
      const o = spriteOrder[s];
      const transformX = invDet * (player.dirY * o.dx - player.dirX * o.dy);
      const transformY = invDet * (-player.planeY * o.dx + player.planeX * o.dy);
      if (transformY <= 0.01) continue; // behind / on camera plane

      const screenX = (halfW * (1 + transformX / transformY)) | 0;
      const spriteH = Math.abs((H / transformY) | 0);
      const spriteW = spriteH;
      if (spriteH < 1) continue;

      const drawStartX = -((spriteW >> 1)) + screenX;
      const drawStartY = -((spriteH >> 1)) + halfH;
      const drawEndX = drawStartX + spriteW;
      const drawEndY = drawStartY + spriteH;

      let clipStartX = drawStartX < 0 ? 0 : drawStartX;
      let clipEndX   = drawEndX   > W ? W : drawEndX;
      let clipStartY = drawStartY < 0 ? 0 : drawStartY;
      let clipEndY   = drawEndY   > H ? H : drawEndY;
      if (clipStartX >= clipEndX || clipStartY >= clipEndY) continue;

      const frames = SPRITES[o.e.type];
      const sprite = frames[(o.e.animPhase | 0) & 1];
      const flash = nowMs < o.e.hitFlashUntil;
      const tint = o.e.mode === 'wind';

      // atmosphere-lighting: when on, fog blend on transformY mirrors the
      // wall path; when off, fall back to the legacy 1/d shade so the L
      // toggle is a true A/B comparison.
      let shade = 1, fogIt = 0, fogIb = 256;
      const fogR = FOG_C & 0xff, fogG = (FOG_C >> 8) & 0xff, fogB = (FOG_C >> 16) & 0xff;
      if (lightingEnabled) {
        let t = (transformY - FOG_NEAR) / (FOG_FAR - FOG_NEAR);
        if (t < 0) t = 0; else if (t > 1) t = 1;
        fogIt = (t * 256) | 0;
        fogIb = 256 - fogIt;
      } else {
        shade = Math.min(1, 5 / (transformY + 0.5));
      }
      const sStep = SPRITE_SIZE / spriteH;
      const tStep = SPRITE_SIZE / spriteW;

      for (let stripe = clipStartX; stripe < clipEndX; stripe++) {
        if (transformY >= zBuffer[stripe]) continue;
        const texX = (((stripe - drawStartX) * tStep) | 0);
        if (texX < 0 || texX >= SPRITE_SIZE) continue;

        let texY = (clipStartY - drawStartY) * sStep;
        let bufIdx = clipStartY * W + stripe;
        for (let y = clipStartY; y < clipEndY; y++) {
          const ty = texY | 0;
          texY += sStep;
          if (ty >= 0 && ty < SPRITE_SIZE) {
            const c = sprite[ty * SPRITE_SIZE + texX];
            if (c !== 0) {
              if (flash) {
                buf32[bufIdx] = 0xffffffff; // full white silhouette
              } else {
                let r, g, b;
                if (lightingEnabled) {
                  r = (c       ) & 0xff;
                  g = (c >>  8) & 0xff;
                  b = (c >> 16) & 0xff;
                } else {
                  r = (((c       ) & 0xff) * shade) | 0;
                  g = (((c >>  8) & 0xff) * shade) | 0;
                  b = (((c >> 16) & 0xff) * shade) | 0;
                }
                if (tint) {
                  r = r + 80; if (r > 255) r = 255;
                  g = (g * 0.4) | 0;
                  b = (b * 0.4) | 0;
                }
                if (lightingEnabled) {
                  // Same fog blend formula as the wall path.
                  r = (r * fogIb + fogR * fogIt) >> 8;
                  g = (g * fogIb + fogG * fogIt) >> 8;
                  b = (b * fogIb + fogB * fogIt) >> 8;
                }
                buf32[bufIdx] = (255 << 24) | ((b & 0xff) << 16) | ((g & 0xff) << 8) | (r & 0xff);
              }
            }
          }
          bufIdx += W;
        }
      }
    }
  }

  // Single-frame additive flash at each firing enemy's projected screen
  // position. Drawn over the buf blit so it's cheap and always on top.
  function drawEnemyMuzzleFlashes() {
    const invDet = 1.0 / (player.planeX * player.dirY - player.dirX * player.planeY);
    const halfW = W >> 1;
    const halfH = H >> 1;
    let active = false;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      if (nowMs >= e.fireFlashUntil) continue;
      const dx = e.x - player.x;
      const dy = e.y - player.y;
      const tx = invDet * (player.dirY * dx - player.dirX * dy);
      const ty = invDet * (-player.planeY * dx + player.planeX * dy);
      if (ty <= 0.01) continue; // behind / on camera plane
      const screenX = (halfW * (1 + tx / ty)) | 0;
      if (screenX < -8 || screenX >= W + 8) continue;
      if (!active) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255, 220, 80, 0.85)';
        active = true;
      }
      const size = Math.max(3, (16 / ty) | 0);
      ctx.fillRect(screenX - (size >> 1), halfH - (size >> 1), size, size);
    }
    if (active) ctx.globalCompositeOperation = 'source-over';
  }

  // ---------------------------------------------------------------------------
  // gun-viewmodel: procedural pistol + muzzle flash, blitted into buf32 between
  // drawSprites() and putImageData so it's part of the world frame but lives
  // above the wall/sprite pass. The sprites are baked once at startup; only
  // the per-frame offsets (bob + kick) change.
  // ---------------------------------------------------------------------------
  function gunFillRect(spr, x, y, w, h, color) {
    for (let yy = y; yy < y + h; yy++) {
      if (yy < 0 || yy >= GUN_H) continue;
      for (let xx = x; xx < x + w; xx++) {
        if (xx < 0 || xx >= GUN_W) continue;
        spr[yy * GUN_W + xx] = color;
      }
    }
  }
  function gunOutlineRect(spr, x, y, w, h, color) {
    gunFillRect(spr, x, y, w, 1, color);
    gunFillRect(spr, x, y + h - 1, w, 1, color);
    gunFillRect(spr, x, y, 1, h, color);
    gunFillRect(spr, x + w - 1, y, 1, h, color);
  }

  function buildGun() {
    const PALETTE = {
      outline:  rgba32( 20,  18,  22),
      bodyDark: rgba32( 60,  60,  70),
      bodyMid:  rgba32(100, 100, 110),
      bodyHi:   rgba32(170, 170, 180),
      grip:     rgba32( 95,  60,  35),
      gripHi:   rgba32(120,  78,  45),
      gripDark: rgba32( 55,  35,  20),
      sight:    rgba32(220, 200,  80),
    };
    const spr = new Uint32Array(GUN_W * GUN_H);

    // Per-row x-offset (cant). Pivot at the frame/grip joint so the grip
    // — which is rendered without cant — meets the canted frame seamlessly.
    // Rate ≈ 1/6 → ~9° tilt, in spec range. Integer-only via `| 0`.
    const CANT_PIVOT_Y = 50;
    function cantOf(y) { return ((y - CANT_PIVOT_Y) / 6) | 0; }
    function fillCant(x, y, w, h, color) {
      for (let yy = y; yy < y + h; yy++) {
        if (yy < 0 || yy >= GUN_H) continue;
        const c = cantOf(yy);
        for (let xx = x; xx < x + w; xx++) {
          const px = xx + c;
          if (px < 0 || px >= GUN_W) continue;
          spr[yy * GUN_W + px] = color;
        }
      }
    }
    function setCant(x, y, color) {
      if (y < 0 || y >= GUN_H) return;
      const px = x + cantOf(y);
      if (px < 0 || px >= GUN_W) return;
      spr[y * GUN_W + px] = color;
    }
    function outlineCant(x, y, w, h, color) {
      fillCant(x, y, w, 1, color);
      fillCant(x, y + h - 1, w, 1, color);
      for (let yy = y + 1; yy < y + h - 1; yy++) {
        setCant(x, yy, color);
        setCant(x + w - 1, yy, color);
      }
    }

    // 1. Slide (foreshortened, canted). Body fill, top highlight strip,
    //    dark vertical strips along the slide's left/right "walls" as seen
    //    from above-rear, then an outline pass.
    fillCant(22, 6, 28, 24, PALETTE.bodyMid);
    fillCant(24, 7, 24, 2, PALETTE.bodyHi);
    fillCant(22, 8, 2, 20, PALETTE.bodyDark);
    fillCant(48, 8, 2, 20, PALETTE.bodyDark);
    // Center spine highlight along the top of the slide.
    fillCant(34, 9, 4, 12, PALETTE.bodyHi);
    outlineCant(22, 6, 28, 24, PALETTE.outline);

    // 2. Muzzle hole — dark spot at the far end (top) of the slide.
    //    Center lands at sprite (BARREL_X, BARREL_Y) after the cant; the
    //    flash blit anchors there.
    fillCant(37, 6, 5, 4, PALETTE.outline);

    // 3. Front sight — bright nub above the slide top.
    fillCant(37, 2, 5, 4, PALETTE.sight);
    outlineCant(37, 2, 5, 4, PALETTE.outline);

    // 4. Rear sight — two notched blocks at the near end (bottom) of the
    //    slide. Bright sight cap on top of each.
    fillCant(25, 24, 4, 5, PALETTE.bodyDark);
    fillCant(25, 24, 4, 1, PALETTE.sight);
    outlineCant(25, 24, 4, 5, PALETTE.outline);
    fillCant(43, 24, 4, 5, PALETTE.bodyDark);
    fillCant(43, 24, 4, 1, PALETTE.sight);
    outlineCant(43, 24, 4, 5, PALETTE.outline);

    // 5. Frame (lower receiver) — wider than the slide, sits below it,
    //    canted with the same per-row offset. Trigger guard is a hollow
    //    cut-out; trigger is a vertical sliver inside.
    fillCant(18, 30, 36, 20, PALETTE.bodyDark);
    fillCant(20, 31, 32, 2, PALETTE.bodyMid);
    outlineCant(18, 30, 36, 20, PALETTE.outline);
    fillCant(26, 35, 20, 12, 0);
    outlineCant(26, 35, 20, 12, PALETTE.outline);
    fillCant(34, 37, 2, 8, PALETTE.bodyMid);

    // 6. Grip — vertical (NOT canted; the hand wouldn't tilt with the
    //    slide). Brown, with a subtle highlight strip and stippled
    //    checkering. Bottom edge runs to GUN_H - 1 so the existing
    //    baseY = H - GUN_H + 4 trim hides the last 4 rows (hand off-frame).
    const GRIP_X = 25, GRIP_Y = 50, GRIP_W = 22, GRIP_H = GUN_H - GRIP_Y;
    gunFillRect(spr, GRIP_X, GRIP_Y, GRIP_W, GRIP_H, PALETTE.grip);
    gunFillRect(spr, GRIP_X + 1, GRIP_Y + 1, 2, GRIP_H - 2, PALETTE.gripHi);
    for (let yy = GRIP_Y + 2; yy < GRIP_Y + GRIP_H - 1; yy += 3) {
      if (yy >= GUN_H) continue;
      const base = yy * GUN_W;
      for (let dotX = GRIP_X + 4; dotX < GRIP_X + GRIP_W - 2; dotX += 3) {
        spr[base + dotX] = PALETTE.gripDark;
      }
    }
    gunOutlineRect(spr, GRIP_X, GRIP_Y, GRIP_W, GRIP_H, PALETTE.outline);

    return spr;
  }

  function buildFlash1() {
    const spr = new Uint32Array(FLASH_W * FLASH_H);
    const cx = FLASH_W >> 1, cy = FLASH_H >> 1;
    for (let y = 0; y < FLASH_H; y++) {
      for (let x = 0; x < FLASH_W; x++) {
        const dx = x - cx, dy = y - cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d <= 3.5) {
          spr[y * FLASH_W + x] = rgba32(255, 250, 230); // bright white core
        } else if (d <= 6) {
          spr[y * FLASH_W + x] = rgba32(255, 220,  90); // warm yellow ring
        } else if (d <= 8) {
          spr[y * FLASH_W + x] = rgba32(160, 110,  30); // dim warm-orange falloff
        }
      }
    }
    return spr;
  }

  function buildFlash2() {
    const spr = new Uint32Array(FLASH_W * FLASH_H);
    const cx = FLASH_W >> 1, cy = FLASH_H >> 1;
    for (let y = 0; y < FLASH_H; y++) {
      for (let x = 0; x < FLASH_W; x++) {
        const dx = x - cx, dy = y - cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d <= 4) {
          spr[y * FLASH_W + x] = rgba32(255, 235, 160); // hot center
        } else if (d <= 7) {
          spr[y * FLASH_W + x] = rgba32(220, 170,  60); // mid yellow
        }
      }
    }
    // 6 radial rays out to ~11 px, taper warm-yellow → dim orange.
    for (let r = 0; r < 6; r++) {
      const angle = (r / 6) * 2 * Math.PI;
      const ca = Math.cos(angle), sa = Math.sin(angle);
      for (let i = 5; i <= 11; i++) {
        const x = (cx + ca * i + 0.5) | 0;
        const y = (cy + sa * i + 0.5) | 0;
        if (x < 0 || x >= FLASH_W || y < 0 || y >= FLASH_H) continue;
        const t = (i - 5) / 6;
        const r8 = Math.max(0, (220 - t * 100) | 0);
        const g8 = Math.max(0, (160 - t *  90) | 0);
        const b8 = Math.max(0, ( 60 - t *  40) | 0);
        const idx = y * FLASH_W + x;
        if (spr[idx] === 0) spr[idx] = rgba32(r8, g8, b8);
      }
    }
    return spr;
  }

  const GUN_SPRITE = buildGun();
  const FLASH_FRAME_1 = buildFlash1();
  const FLASH_FRAME_2 = buildFlash2();

  // Hitscan-weapon's fireShot() calls this on a successful shot ('shot') and
  // on a dry-fire click with empty mag ('dry'). The dry-fire path uses smaller
  // magnitudes and never shows a muzzle flash.
  function onPlayerFire(kind) {
    kickState = 'kicking';
    kickKind  = (kind === 'dry') ? 'dry' : 'shot';
    kickStart = performance.now();
  }

  function tickKick(now) {
    if (kickState === 'kicking') {
      const t = (now - kickStart) / KICK_UP_MS;
      if (t >= 1) {
        kickState = 'recovering';
        kickStart = now;
      }
    } else if (kickState === 'recovering') {
      const t = (now - kickStart) / KICK_RECOVER_MS;
      if (t >= 1) {
        kickState = 'idle';
        kickStart = now;
      }
    }
  }

  // Returns the per-frame additional kick offset + flash frame index. Dry-fire
  // paths never set flashFrame > 0; only 'shot' kicks during the kicking phase
  // produce a muzzle flash.
  function getKickOffsets(now) {
    let kickX = 0, kickY = 0, flashFrame = 0;
    if (kickState === 'kicking') {
      const t = Math.min(1, (now - kickStart) / KICK_UP_MS);
      if (kickKind === 'shot') {
        kickX = -2;
        kickY = -10;
        flashFrame = (t < 0.5) ? 1 : 2; // 1 → 2 over the 60 ms
      } else {
        kickX = 0;
        kickY = -2;
        flashFrame = 0;
      }
    } else if (kickState === 'recovering') {
      const t = Math.min(1, (now - kickStart) / KICK_RECOVER_MS);
      const ease = (1 - t) * (1 - t); // quadratic ease-out
      if (kickKind === 'shot') {
        kickX = -2  * ease;
        kickY = -10 * ease;
      } else {
        kickX = 0;
        kickY = -2  * ease;
      }
      flashFrame = 0;
    }
    return { kickX, kickY, flashFrame };
  }

  // World-frame blit: gun first, then optional muzzle flash with saturating-add
  // (per spec #9). Both anchored to gunX/gunY + bob + kick. Skipped entirely
  // when the player is dead (the kick state machine still ticks elsewhere).
  function drawGunViewmodel() {
    if (player.hp <= 0) return;

    const bobOffX = Math.sin(bobPhase) * 3 * bobIntensity;
    const bobOffY = -Math.abs(Math.sin(bobPhase * 2)) * 2 * bobIntensity;
    const k = getKickOffsets(performance.now());
    const baseX = ((W - GUN_W) >> 1) + GUN_RIGHT_SHIFT;
    const baseY = H - GUN_H + 4;
    const dx = baseX + Math.round(bobOffX + k.kickX);
    const dy = baseY + Math.round(bobOffY + k.kickY);

    // Gun blit (alpha-test: 0 ⇒ skip).
    for (let sy = 0; sy < GUN_H; sy++) {
      const py = dy + sy;
      if (py < 0 || py >= H) continue;
      for (let sx = 0; sx < GUN_W; sx++) {
        const px = dx + sx;
        if (px < 0 || px >= W) continue;
        const sc = GUN_SPRITE[sy * GUN_W + sx];
        if (sc === 0) continue;
        buf32[py * W + px] = sc;
      }
    }

    // Muzzle flash (saturating add) anchored at the barrel exit.
    if (k.flashFrame > 0) {
      const flash = (k.flashFrame === 1) ? FLASH_FRAME_1 : FLASH_FRAME_2;
      const barrelX = dx + BARREL_X;
      const barrelY = dy + BARREL_Y;
      const fdx = barrelX - (FLASH_W >> 1);
      const fdy = barrelY - (FLASH_H >> 1);
      for (let sy = 0; sy < FLASH_H; sy++) {
        const py = fdy + sy;
        if (py < 0 || py >= H) continue;
        for (let sx = 0; sx < FLASH_W; sx++) {
          const px = fdx + sx;
          if (px < 0 || px >= W) continue;
          const sc = flash[sy * FLASH_W + sx];
          if (sc === 0) continue;
          const i = py * W + px;
          const dst = buf32[i];
          const r = Math.min(255, (dst         & 0xff) + (sc         & 0xff));
          const g = Math.min(255, ((dst >>  8) & 0xff) + ((sc >>  8) & 0xff));
          const b = Math.min(255, ((dst >> 16) & 0xff) + ((sc >> 16) & 0xff));
          buf32[i] = (255 << 24) | ((b & 0xff) << 16) | ((g & 0xff) << 8) | (r & 0xff);
        }
      }
    }
  }

  // mobile-touch-polish: one-shot look-sensitivity auto-tune. canvas.clientWidth
  // can be 0 during initial IIFE execution, so defer one frame. Map fb-px
  // touch deltas back to a CSS-px-equivalent feel; clamp to a sane range so
  // odd viewports don't go wild. Fixed for the session — does not recompute
  // on resize / orientation change.
  if (isTouchDevice) {
    requestAnimationFrame(() => {
      const cw = canvas.clientWidth || W;
      touchLookScale = Math.max(0.6, Math.min(2.0, cw / W));
    });
  }

  // Game loop.
  let lastTime = performance.now();
  let fps = 0;
  let fpsAcc = 0, fpsFrames = 0;

  function loop(now) {
    nowMs = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05; // avoid teleport on tab refocus
    if (!(dt >= 0)) dt = 0;

    update(dt);
    render();

    fpsAcc += dt;
    fpsFrames++;
    if (fpsAcc >= 0.5) {
      fps = fpsFrames / fpsAcc;
      fpsAcc = 0;
      fpsFrames = 0;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
