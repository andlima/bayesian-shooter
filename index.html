  // stats.shotsFired += 1 per non-dry pull; stats.shotsHit += 1 iff at least
  // one pellet connected (never the pellet count).
  function fireShot() {
    if (player.hp <= 0) return;            // frozen death state — no fire
    const wpn = WEAPONS[weapon];
    const now = performance.now();
    if (now - lastFireTime < wpn.cooldownMs) return; // cooldown drops input
    if (ammo < wpn.ammoCost) {
      // Dry trigger — counters untouched, but a distinct click plays.
      sfxDryFire();
      onPlayerFire('dry');
      return;
    }
    lastFireTime = now;
    ammo = Math.max(0, ammo - wpn.ammoCost); // shared pool; never below 0
    stats.shotsFired++;
    sfxShot();
    muzzleFlashUntil = now + MUZZLE_FLASH_MS;
    onPlayerFire('shot');

    const pellets = wpn.pellets;
    const spread = wpn.spreadRad;
    const r2 = ENEMY_RADIUS * ENEMY_RADIUS;
    let anyHit = false;
    for (let p = 0; p < pellets; p++) {
      // Fixed, deterministic, symmetric fan across [-spread, +spread]; the
      // middle pellet is dead center. No randomness — same aim, same pattern.
      const ang = (pellets > 1)
        ? (-spread + (2 * spread) * (p / (pellets - 1)))
        : 0;
      const cosA = Math.cos(ang), sinA = Math.sin(ang);
      const dirX = player.dirX * cosA - player.dirY * sinA;
      const dirY = player.dirX * sinA + player.dirY * cosA;

      // Same wall-block + ray-vs-circle primitive the pistol uses today.
      const dWall = castRay(player.x, player.y, dirX, dirY);
      let bestT = Infinity;
      let bestE = null;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (!e.alive) continue;
        const lx = e.x - player.x;
        const ly = e.y - player.y;
        const tProj = lx * dirX + ly * dirY;
        if (tProj <= 0 || tProj >= dWall) continue;
        const perp2 = lx * lx + ly * ly - tProj * tProj;
        if (perp2 > r2) continue;
        if (tProj < bestT) { bestT = tProj; bestE = e; }
      }

      if (bestE) {
        anyHit = true;
        bestE.hitFlashUntil = now + ENEMY_FLASH_MS;
        bestE.hp -= wpn.damage;
        if (bestE.hp <= 0) {
          bestE.alive = false;
          stats.kills++;
          sfxKill();
          // hud-feedback-polish: spawn a "+1" pop at the kill location. Cap at
          // KILL_POP_MAX so a long burst can't grow the array unbounded.
          if (killPops.length < KILL_POP_MAX) {
            killPops.push({ x: bestE.x, y: bestE.y, atMs: now, untilMs: now + 500 });
          }
        }
      }
    }

    // One Bernoulli success iff ANY pellet connected (not the pellet count).
    if (anyHit) {
      stats.shotsHit++;
      sfxHit();
      hitTintUntil = now + HIT_TINT_MS;
    }
  }

  function applyContactDamage(dt) {
    if (player.hp <= 0) return;
    const r2 = CONTACT_RADIUS * CONTACT_RADIUS;
    // Track the nearest touching enemy; the direction arrow points at it so
    // that walking around a clump of enemies aims at whichever is currently
    // hugging the player.
    let nearestE = null;
    let nearestD2 = Infinity;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const dx = e.x - player.x;
      const dy = e.y - player.y;
      const d2 = dx * dx + dy * dy;
      if (d2 <= r2 && d2 < nearestD2) {
        nearestE = e;
        nearestD2 = d2;
      }
    }
    if (!nearestE) return;
    player.hp -= CONTACT_DPS * dt;
    // Throttle: continuous DPS would otherwise stack a buzz every frame.
    if (nowMs >= nextContactHurtMs) {
      sfxHurt();
      nextContactHurtMs = nowMs + 300;
    }
    // hud-feedback-polish: mirror the audio cadence for the vignette so the
    // red flash pulses instead of going opaque while in continuous contact.
    if (nowMs >= nextDmgFlashMs) {
      triggerDamageFlash(nowMs);
      nextDmgFlashMs = nowMs + 300;
    }
    setDamageArrow(nearestE, nowMs);
    if (player.hp <= 0) {
      player.hp = 0;
      stats.deaths++;
    }
  }

  // pickups-health-ammo: walk-on grant. Single pass per frame; per-pickup
  // squared-distance test against PICKUP_RADIUS. "Skip if full" leaves the
  // pickup in place so the player can come back later; partial grants are
  // accepted and clamped to MAX_HP / MAX_AMMO.
  function applyPickups() {
    if (player.hp <= 0) return;
    const r2 = PICKUP_RADIUS * PICKUP_RADIUS;
    for (let i = 0; i < pickups.length; i++) {
      const p = pickups[i];
      if (!p.alive) continue;
      const dx = p.x - player.x;
      const dy = p.y - player.y;
      if (dx * dx + dy * dy > r2) continue;
      if (p.type === 'health_small' || p.type === 'health_large') {
        if (player.hp >= MAX_HP) continue;
        const amt = (p.type === 'health_large') ? PICKUP_HEALTH_LARGE : PICKUP_HEALTH_SMALL;
        player.hp = Math.min(MAX_HP, player.hp + amt);
        spawnPickupPop(p.x, p.y, '+' + amt + ' HP', 'health');
        sfxPickupHealth();
        p.alive = false;
      } else if (p.type === 'ammo_small' || p.type === 'ammo_large') {
        if (ammo >= MAX_AMMO) continue;
        const amt = (p.type === 'ammo_large') ? PICKUP_AMMO_LARGE : PICKUP_AMMO_SMALL;
        ammo = Math.min(MAX_AMMO, ammo + amt);
        spawnPickupPop(p.x, p.y, '+' + amt + ' AMMO', 'ammo');
        sfxPickupAmmo();
        p.alive = false;
      } else if (p.type === 'weapon_shotgun') {
        // shotgun-weapon-pickup: grant the shotgun, auto-equip it (re-arm
        // the equip slide-in), pop + distinct SFX, mark taken. If already
        // owned, leave it in place and grant nothing — mirrors the
        // "skip if full" health/ammo pattern (no dup / ammo / re-SFX).
        if (hasShotgun) continue;
        hasShotgun = true;
        setWeapon('shotgun');
        spawnPickupPop(p.x, p.y, 'SHOTGUN', 'weapon');
        sfxPickupShotgun();
        p.alive = false;
      }
    }
  }

  function spawnPickupPop(x, y, text, kind) {
    if (pickupPops.length >= PICKUP_POP_MAX) return;
    pickupPops.push({
      x, y, text,
      color: kind,
      atMs: nowMs,
      untilMs: nowMs + PICKUP_POP_MS,
    });
  }

  // Per-row floor/ceiling cast (Lode-Vandevenne). Replaces the old flat
  // fillBackground and the sky/ground gradient fills: every floor row's
  // perpendicular distance is recomputed from screen y, then the texture is
  // sampled across the row with stepX/Y increments. The ceiling row at H-1-y
  // mirrors the floor row using the same (fx, fy) world coords but a
  // different texture. The lighting branch is hoisted out of the inner x
  // loop so per-pixel work stays integer-only.
  function castFloorCeiling() {
    const rayDirX0 = player.dirX - player.planeX * fovPunch;
    const rayDirY0 = player.dirY - player.planeY * fovPunch;
    const rayDirX1 = player.dirX + player.planeX * fovPunch;
    const rayDirY1 = player.dirY + player.planeY * fovPunch;
    const dRayX = (rayDirX1 - rayDirX0) / W;
    const dRayY = (rayDirY1 - rayDirY0) / W;
    const fogR = FOG_C & 0xff;
    const fogG = (FOG_C >> 8) & 0xff;
    const fogB = (FOG_C >> 16) & 0xff;
    const fogDenom = FOG_FAR - FOG_NEAR;
    // theme-runtime-selector: frame-constant override, hoisted once per call
    // (loop-invariant for the whole floor/ceiling pass).
    const forced = forcedThemeIdx;

    for (let y = HALF_H + 1; y < H; y++) {
      const p = y - HALF_H;
      const rowDist = HALF_H / p;
      const stepX = rowDist * dRayX;
      const stepY = rowDist * dRayY;
      let fx = player.x + rowDist * rayDirX0;
      let fy = player.y + rowDist * rayDirY0;
      let iFloor = y * W;
      let iCeil  = (H - 1 - y) * W;

      if (lightingEnabled) {
        let t = (rowDist - FOG_NEAR) / fogDenom;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        const it = (t * 256) | 0;
        const ib = 256 - it;
        for (let xx = 0; xx < W; xx++) {
          const mx = fx | 0;
          const my = fy | 0;
          let theme;
          if (forced >= 0) {
            theme = forced;
          } else {
            theme = 0;
            if (mx >= 0 && mx < MAP_W && my >= 0 && my < MAP_H) {
              theme = THEME_MAP[my * MAP_W + mx];
            }
          }
          const FLOOR_TEX = FLOOR_VARIANTS[theme];
          const CEIL_TEX  = CEIL_VARIANTS[theme];
          const tx = ((fx * TEX_SIZE) | 0) & TEX_MASK;
          const ty = ((fy * TEX_SIZE) | 0) & TEX_MASK;
          const idx = ty * TEX_SIZE + tx;
          const cF = FLOOR_TEX[idx];
          const cC = CEIL_TEX[idx];
          const fr = (((cF        ) & 0xff) * ib + fogR * it) >> 8;
          const fg = (((cF >>>  8) & 0xff) * ib + fogG * it) >> 8;
          const fb = (((cF >>> 16) & 0xff) * ib + fogB * it) >> 8;
          buf32[iFloor++] = (255 << 24) | (fb << 16) | (fg << 8) | fr;
          const cr = (((cC        ) & 0xff) * ib + fogR * it) >> 8;
          const cg = (((cC >>>  8) & 0xff) * ib + fogG * it) >> 8;
          const cb = (((cC >>> 16) & 0xff) * ib + fogB * it) >> 8;
          buf32[iCeil++] = (255 << 24) | (cb << 16) | (cg << 8) | cr;
          fx += stepX;
          fy += stepY;
        }
      } else {
        const shade = Math.min(1, 5 / (rowDist + 0.5));
        const shadeI = (shade * 256) | 0;
        for (let xx = 0; xx < W; xx++) {
          const mx = fx | 0;
          const my = fy | 0;
          let theme;
          if (forced >= 0) {
            theme = forced;
          } else {
            theme = 0;
            if (mx >= 0 && mx < MAP_W && my >= 0 && my < MAP_H) {
              theme = THEME_MAP[my * MAP_W + mx];
            }
          }
          const FLOOR_TEX = FLOOR_VARIANTS[theme];
          const CEIL_TEX  = CEIL_VARIANTS[theme];
          const tx = ((fx * TEX_SIZE) | 0) & TEX_MASK;
          const ty = ((fy * TEX_SIZE) | 0) & TEX_MASK;
          const idx = ty * TEX_SIZE + tx;
          const cF = FLOOR_TEX[idx];
          const cC = CEIL_TEX[idx];
          const fr = ((cF         & 0xff) * shadeI) >>> 8;
          const fg = (((cF >>>  8) & 0xff) * shadeI) >>> 8;
          const fb = (((cF >>> 16) & 0xff) * shadeI) >>> 8;
          buf32[iFloor++] = (255 << 24) | (fb << 16) | (fg << 8) | fr;
          const cr = ((cC         & 0xff) * shadeI) >>> 8;
          const cg = (((cC >>>  8) & 0xff) * shadeI) >>> 8;
          const cb = (((cC >>> 16) & 0xff) * shadeI) >>> 8;
          buf32[iCeil++] = (255 << 24) | (cb << 16) | (cg << 8) | cr;
          fx += stepX;
          fy += stepY;
        }
      }
    }
    // Horizon row (p === 0 ⇒ rowDist === Infinity). Walls usually overwrite
    // it; pure black is the limit of both the fog blend and the distance
    // shade as rowDist → ∞.
    buf32.fill(0xff000000, HALF_H * W, HALF_H * W + W);
  }

  function render() {
    castFloorCeiling();

    // Hoist fog channel constants out of the column loop.
    const fogR = FOG_C & 0xff;
    const fogG = (FOG_C >> 8) & 0xff;
    const fogB = (FOG_C >> 16) & 0xff;
    const fogDenom = FOG_FAR - FOG_NEAR;

    for (let x = 0; x < W; x++) {
      const hit = castColumn(x);
      const d = hit.perpWallDist;
      zBuffer[x] = d;

      // theme-runtime-selector: when an override is active, re-encode the cell
      // under the forced theme while preserving its material variant (one
      // branch per screen column, outside the per-pixel inner loop).
      let wt = hit.wallType;
      if (forcedThemeIdx >= 0 && wt > 0) {
        const variant = (wt - 1) % 3;          // 0/1/2, the cell's material
        wt = forcedThemeIdx * 3 + variant + 1; // same material, forced theme
      }
      const tex = WALL_VARIANTS[wt] || WALL_VARIANTS[1];
      const rayDirX = hit.rayDirX;
      const rayDirY = hit.rayDirY;

      let wallX = (hit.side === 0)
        ? (player.y + d * rayDirY)
        : (player.x + d * rayDirX);
      wallX -= Math.floor(wallX);
      let texX = (wallX * TEX_SIZE) | 0;
      if ((hit.side === 0 && rayDirX > 0) || (hit.side === 1 && rayDirY < 0)) {
        texX = TEX_MASK - texX;
      }

      let lineHeight = (H / d) | 0;
      if (lineHeight < 1) lineHeight = 1;
      const drawStart = (H - lineHeight) >> 1;
      const drawEnd   = drawStart + lineHeight;
      const yStart = drawStart < 0 ? 0 : drawStart;
      const yEnd   = drawEnd > H ? H : drawEnd;
      const step   = ((TEX_SIZE << 16) / lineHeight) | 0;
      let texPos   = ((yStart - drawStart) * step) | 0;

      const sideMul = (hit.side === 1) ? 0.6 : 1.0;

      if (lightingEnabled) {
        // Distance fog replaces the old 1/d shade — running both produces a
        // muddy mid-distance band (see spec / "common pitfalls").
        let t = (d - FOG_NEAR) / fogDenom;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        const it = (t * 256) | 0;
        const ib = 256 - it;
        const sideI = (sideMul * 256) | 0;
        let i = yStart * W + x;
        for (let y = yStart; y < yEnd; y++) {
          const tY = (texPos >>> 16) & TEX_MASK;
          texPos = (texPos + step) | 0;
          const c = tex[tY * TEX_SIZE + texX];
          const r0 = ((c         & 0xff) * sideI) >>> 8;
          const g0 = (((c >>>  8) & 0xff) * sideI) >>> 8;
          const b0 = (((c >>> 16) & 0xff) * sideI) >>> 8;
          const r = (r0 * ib + fogR * it) >> 8;
          const g = (g0 * ib + fogG * it) >> 8;
          const b = (b0 * ib + fogB * it) >> 8;
          buf32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
          i += W;
        }
      } else {
        const shade = Math.min(1, 5 / (d + 0.5));
        const shadeI = (shade * sideMul * 256) | 0;
        let i = yStart * W + x;
        for (let y = yStart; y < yEnd; y++) {
          const tY = (texPos >>> 16) & TEX_MASK;
          texPos = (texPos + step) | 0;
          const c = tex[tY * TEX_SIZE + texX];
          const r = ((c         & 0xff) * shadeI) >>> 8;
          const g = (((c >>>  8) & 0xff) * shadeI) >>> 8;
          const b = (((c >>> 16) & 0xff) * shadeI) >>> 8;
          buf32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
          i += W;
        }
      }
    }

    drawSprites();

    if (lightingEnabled) {
      // Vignette: per-pixel multiply against the precomputed table. One pass
      // over W*H ≈ 130k pixels, well under a millisecond on modern hardware.
      const N = W * H;
      for (let i = 0; i < N; i++) {
        const m = VIGNETTE[i];
        if (m === 256) continue; // no-op band near screen center
        const c = buf32[i];
        const r = ((c & 0xff) * m) >> 8;
        const g = (((c >> 8) & 0xff) * m) >> 8;
        const b = (((c >> 16) & 0xff) * m) >> 8;
        buf32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
      }
    }

    // gun-viewmodel: blit the procedural pistol + (conditional) muzzle flash
    // into buf32 after the vignette pass so the gun reads as HUD-class and
    // is not darkened at the screen corners. Skipped when the player is dead.
    // gun-feel-polish: shadow first (darkens the wall pixels under the gun),
    // gun second (opaque pixels overwrite the shadowed wall).
    drawGunShadow();
    drawGunViewmodel();

    ctx.putImageData(buf, 0, 0);

    drawEnemyMuzzleFlashes();

    // Crosshair: 3-pixel cross in the middle. Tints red briefly after a hit.
    // 1-px black outline (drawn first, beneath) keeps the crosshair legible
    // against bright walls on both desktop and touch.
    const crossColor = (nowMs < hitTintUntil) ? '#f44' : '#fff';
    const cx = W >> 1, cy = H >> 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - 2, cy - 1, 5, 3);
    ctx.fillRect(cx - 1, cy - 2, 3, 5);
    ctx.fillStyle = crossColor;
    ctx.fillRect(cx - 1, cy, 3, 1);
    ctx.fillRect(cx, cy - 1, 1, 3);

    drawMuzzleScreenWash(nowMs);

    // hud-feedback-polish: vignette + heartbeat sit under the HUD strip; kill
    // pops sit between the vignette and the HUD so they never cover readouts.
    drawDamageEdges();
    drawKillPops();
    drawPickupPops();

    drawMinimap();

    // FPS counter overlay.
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(2, 2, 64, 16);
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText(fps.toFixed(0) + ' fps', 6, 4);

    // atmosphere-lighting: brief debug overlay after each L toggle.
    if (nowMs - lightingToggledAtMs < 2000) {
      const a = 1 - (nowMs - lightingToggledAtMs) / 2000;
      const text = 'lighting: ' + (lightingEnabled ? 'on' : 'off');
      ctx.fillStyle = `rgba(0,0,0,${(a * 0.55).toFixed(3)})`;
      ctx.fillRect(2, 20, 96, 16);
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.fillText(text, 6, 22);
    }

    // theme-runtime-selector: brief overlay after each T toggle, one row below
    // the lighting label so the two coexist without overlapping. Same font/
    // baseline/colors and alpha ramp; no HUD presence after the 2 s window.
    if (nowMs - themeToggledAtMs < 2000) {
      const a = 1 - (nowMs - themeToggledAtMs) / 2000;
      const text = 'theme: ' +
        (forcedThemeIdx < 0 ? 'natural' : THEMES[forcedThemeIdx]);
      ctx.fillStyle = `rgba(0,0,0,${(a * 0.55).toFixed(3)})`;
      ctx.fillRect(2, 38, 96, 16);
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.fillText(text, 6, 40);
    }

    drawHUD();

    // hud-feedback-polish: damage arrow draws on top of the HUD strip so it
    // stays visible when the player is huddled in a corner; under death overlay.
    drawDamageArrow();

    // level-exit-progression: "LEVEL N" banner on transition. Sits under the
    // death overlay so "YOU DIED" wins when both are simultaneously active.
    if (nowMs < levelBannerUntilMs) {
      const elapsed = nowMs - levelBannerAtMs;
      const fadeStart = (levelBannerUntilMs - levelBannerAtMs) - 400;
      const a = elapsed < fadeStart
        ? 1
        : Math.max(0, 1 - (elapsed - fadeStart) / 400);
      const stripY = (H * 0.32) | 0;
      ctx.fillStyle = `rgba(0,0,0,${(a * 0.55).toFixed(3)})`;
      ctx.fillRect(0, stripY, W, 28);
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.font = '18px monospace';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL ' + level, W >> 1, stripY + 14);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
    }

    if (player.hp <= 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, (H >> 1) - 14, W, 28);
      ctx.fillStyle = '#f55';
      ctx.font = '12px monospace';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'center';
      const deathText = isTouchDevice
        ? 'YOU DIED — tap RESET to restart'
        : 'YOU DIED — press R to restart';
      ctx.fillText(deathText, W >> 1, (H >> 1) - 6);
      ctx.textAlign = 'left';
    }

    // mobile-touch-controls: touch HUD overlays (joystick / fire / util
    // row or RESET). Early-returns on desktop. Drawn after the death
    // overlay so RESET / util buttons are not dimmed by it.
    drawTouchHUD();

    // mobile-touch-polish: tap-to-begin overlay. Drawn last so it sits
    // above everything (including the death overlay and touchHUD). One-
    // shot: gated on isTouchDevice && !audioStarted, so desktop pays a
    // single boolean check per frame.
    if (isTouchDevice && !audioStarted) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      const panelW = 160, panelH = 32;
      const px = ((W - panelW) >> 1), py = ((H - panelH) >> 1);
      ctx.fillStyle   = 'rgba(0,0,0,0.55)';
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 1;
      roundRect(px, py, panelW, panelH, BTN_R);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = '14px monospace';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillText('TAP TO BEGIN', px + panelW / 2, py + panelH / 2);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
    }
  }

  // ---------------------------------------------------------------------------
  // hud-feedback-polish: damage vignette + heartbeat, kill "+1" pops, and the
  // damage-direction arrow. All four helpers consume `nowMs` directly so the
  // timers stay in sync with the rest of the frame.
  // ---------------------------------------------------------------------------
  function triggerDamageFlash(t) {
    dmgFlashAt = t;
    dmgFlashUntil = t + 250;
  }

  // enemy-projectile-attacks: arrow source is an arbitrary world-space point so
  // a projectile can point at the spawn site even after the firing enemy has
  // moved or died. setDamageArrow(e, t) delegates here for the contact path.
  function setDamageArrowFromPoint(sx, sy, t) {
    const dx = sx - player.x;
    const dy = sy - player.y;
    if (dx === 0 && dy === 0) return;
    dmgArrow = {
      worldAngle: Math.atan2(dy, dx),
      atMs: t,
      untilMs: t + 600,
    };
  }

  function setDamageArrow(srcEnemy, t) {
    setDamageArrowFromPoint(srcEnemy.x, srcEnemy.y, t);
  }

  function drawDamageEdges() {
    let alphaFlash = 0;
    if (nowMs < dmgFlashUntil) {
      const t = (nowMs - dmgFlashAt) / 250;       // 0 -> 1 over the flash
      alphaFlash = 0.45 * (1 - t);
    }
    let alphaPulse = 0;
    if (player.hp > 0 && player.hp <= 30) {
      const hpFrac = player.hp / 30;              // 1 at HP=30, 0 at HP=0
      const rateHz = 1 + (1 - hpFrac) * 1.5;      // 1 Hz -> 2.5 Hz
      const phase = (nowMs / 1000) * rateHz * 2 * Math.PI;
      alphaPulse = 0.10 + 0.10 * (Math.sin(phase) * 0.5 + 0.5);
    }
    // Max (not sum) so simultaneous flash + pulse never saturate to opaque red.
    const a = Math.max(alphaFlash, alphaPulse);
    if (a <= 0) return;
    ctx.fillStyle = `rgba(220, 30, 30, ${a.toFixed(3)})`;
    const T = 28;
    ctx.fillRect(0, 0, W, T);
    ctx.fillRect(0, H - T, W, T);
    ctx.fillRect(0, 0, T, H);
    ctx.fillRect(W - T, 0, T, H);
  }

  function drawKillPops() {
    if (killPops.length === 0) return;
    // Same camera math as drawSprites(); kept inline (4 lines) so this section
    // is self-contained.
    const invDet = 1 / (player.planeX * fovPunch * player.dirY - player.dirX * player.planeY * fovPunch);
    const halfW = W >> 1;
    const halfH = H >> 1;
    ctx.font = '10px monospace';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    for (let i = killPops.length - 1; i >= 0; i--) {
      const p = killPops[i];
      if (nowMs >= p.untilMs) { killPops.splice(i, 1); continue; }
      const t = (nowMs - p.atMs) / (p.untilMs - p.atMs); // 0 -> 1
      const camX = p.x - player.x;
      const camY = p.y - player.y;
      const transformX = invDet * (player.dirY * camX - player.dirX * camY);
      const transformY = invDet * (-player.planeY * fovPunch * camX + player.planeX * fovPunch * camY);
      // Behind the player: hide this frame but keep the pop alive.
      if (transformY <= 0) continue;
      const screenX = (halfW * (1 + transformX / transformY)) | 0;
      const screenY = (halfH - 12 * t) | 0;       // float up ~12 px
      const a = 1 - t;
      ctx.fillStyle = `rgba(0,0,0,${(a * 0.7).toFixed(3)})`;
      ctx.fillText('+1', screenX + 1, screenY + 1);
      ctx.fillStyle = `rgba(255,255,224,${a.toFixed(3)})`;
      ctx.fillText('+1', screenX, screenY);
    }
    // Restore defaults the rest of the HUD code expects.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
  }

  // pickups-health-ammo: worldspace "+N HP" / "+N AMMO" float + fade pop.
  // Mirrors drawKillPops camera math; per-pop palette comes from p.color.
  function drawPickupPops() {
    if (pickupPops.length === 0) return;
    const invDet = 1 / (player.planeX * fovPunch * player.dirY - player.dirX * player.planeY * fovPunch);
    const halfW = W >> 1;
    const halfH = H >> 1;
    ctx.font = '10px monospace';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    for (let i = pickupPops.length - 1; i >= 0; i--) {
      const p = pickupPops[i];
      if (nowMs >= p.untilMs) { pickupPops.splice(i, 1); continue; }
      const t = (nowMs - p.atMs) / (p.untilMs - p.atMs);
      const camX = p.x - player.x;
      const camY = p.y - player.y;
      const transformX = invDet * (player.dirY * camX - player.dirX * camY);
      const transformY = invDet * (-player.planeY * fovPunch * camX + player.planeX * fovPunch * camY);
      if (transformY <= 0) continue;
      const screenX = (halfW * (1 + transformX / transformY)) | 0;
      const screenY = (halfH - 16 * t) | 0;
      const a = 1 - t;
      const tint = (p.color === 'health') ? '180,255,200'
                 : (p.color === 'weapon') ? '120,210,255'
                 : '255,230,140';
      ctx.fillStyle = `rgba(0,0,0,${(a * 0.7).toFixed(3)})`;
      ctx.fillText(p.text, screenX + 1, screenY + 1);
      ctx.fillStyle = `rgba(${tint},${a.toFixed(3)})`;
      ctx.fillText(p.text, screenX, screenY);
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
  }

  // mobile-touch-polish: 4-corner rounded-rect path builder. Builds a
  // path via moveTo + arcTo so callers can stroke and / or fill on the
  // same path. Caller is responsible for beginPath / fill / stroke.
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  // mobile-touch-controls: render the touch HUD overlay (joystick base /
  // thumb when active, fire button, util row or RESET when dead). Drawn
  // in framebuffer coordinates so its hit-test math (in the same pixel
  // space) and visual pixels stay locked together.
  function drawTouchHUD() {
    if (!isTouchDevice) return;
    // Util row / RESET — rounded-rect background with press-state palette.
    ctx.font = '12px monospace';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    if (player.hp <= 0) {
      const x = (W / 2) - 40, y = (H / 2) + 32;
      const pressed = utilPressed.RESET !== 0;
      ctx.fillStyle   = pressed ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.55)';
      ctx.strokeStyle = pressed ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.65)';
      roundRect(x, y, 80, 24, BTN_R);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillText('RESET', x + 40, y + 12);
    } else {
      const labels = ['N', 'L', 'M'];
      for (let i = 0; i < 3; i++) {
        const x = UTIL_XS[i];
        const label = labels[i];
        const pressed = utilPressed[label] !== 0;
        ctx.fillStyle   = pressed ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.55)';
        ctx.strokeStyle = pressed ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.65)';
        roundRect(x, UTIL_ROW_Y, BTN_W, BTN_H, BTN_R);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.fillText(label, x + BTN_W / 2, UTIL_ROW_Y + BTN_H / 2);
        // Mute indicator: 1-px diagonal strikethrough through the M label.
        if (label === 'M' && muted) {
          ctx.strokeStyle = 'rgba(255,80,80,0.9)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + 3,                 UTIL_ROW_Y + 3);
          ctx.lineTo(x + BTN_W - 3, UTIL_ROW_Y + BTN_H - 3);
          ctx.stroke();
        }
      }
    }
    // Restore defaults the rest of the HUD code expects.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
  }

  function drawDamageArrow() {
    if (!dmgArrow) return;
    if (nowMs >= dmgArrow.untilMs) { dmgArrow = null; return; }
    const t = (nowMs - dmgArrow.atMs) / (dmgArrow.untilMs - dmgArrow.atMs);
    const a = 1 - t;
    // Player forward (dirX, dirY) maps to "up" on screen, so screenAngle =
    // worldAngle - playerForwardAngle - pi/2. Verified against the four
    // cardinal directions (front/back/left/right) of the player.
    const fwd = Math.atan2(player.dirY, player.dirX);
    const screenAngle = dmgArrow.worldAngle - fwd - Math.PI / 2;
    const cx = W / 2, cy = H / 2;
    const radius = Math.min(W, H) / 2 - 28;
    const ax = cx + Math.cos(screenAngle) * radius;
    const ay = cy + Math.sin(screenAngle) * radius;
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(screenAngle + Math.PI / 2); // local triangle points up; rotate so tip faces outward
    ctx.fillStyle = `rgba(220, 30, 30, ${a.toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.lineTo(-5, 4);
    ctx.lineTo(5, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    // mobile-touch-polish: bump strip + font on touch so HP/AMMO/LEVEL/KILLS
    // are readable at thumb-distance. Desktop branch stays byte-identical.
    // mobile-mc-feel: extra bump for narrow viewports (clientWidth <= 380).
    const HUD_FONT_PX = !isTouchDevice ? 12 : (touchHudTier === 'narrow' ? 16 : 14);
    const HUD_STRIP_H = !isTouchDevice ? 18 : (touchHudTier === 'narrow' ? 26 : 22);
    const textY = H - HUD_STRIP_H + 4;
    const hpFrac = Math.max(0, Math.min(1, player.hp / MAX_HP));
    // HUD strip background to keep text legible against any wall colour.
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H - HUD_STRIP_H, W, HUD_STRIP_H);
    // Thin red HP bar always sits exactly 2 px above the strip.
    ctx.fillStyle = '#400';
    ctx.fillRect(0, H - HUD_STRIP_H - 2, W, 2);
    ctx.fillStyle = '#e22';
    ctx.fillRect(0, H - HUD_STRIP_H - 2, (W * hpFrac) | 0, 2);

    ctx.font = HUD_FONT_PX + 'px monospace';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('HP   ' + (Math.ceil(player.hp) | 0), 4, textY);

    // hud-feedback-polish: AMMO turns warning-red at 5 and pulses at 0.
    let ammoColor = '#fff';
    if (ammo === 0) {
      // ~3 Hz pulse between two reds: 167 ms ≈ 1/(2*3 Hz).
      ammoColor = (Math.floor(nowMs / 167) % 2 === 0) ? '#f55' : '#a22';
    } else if (ammo <= 5) {
      ammoColor = '#f55';
    }
    ctx.fillStyle = ammoColor;
    ctx.textAlign = 'center';
    ctx.fillText('AMMO  ' + ammo + ' / ' + MAX_AMMO, (W * 0.40) | 0, textY);

    // shotgun-weapon-pickup: compact active-weapon name, a separate token in
    // the gap between the HP and AMMO readouts (the HP / AMMO / LEVEL / KILLS
    // strings themselves are unchanged). Drawn at a small fixed font so it
    // never overflows the strip on the desktop / medium / narrow tiers; its
    // left edge is anchored just right of the *measured* HP text so it can't
    // collide with HP, and the small font keeps it clear of AMMO. The rect is
    // cached for the touch weapon-switch hit-test (same edge-tap precedence as
    // the util buttons, AC #17).
    const WPN_FONT_PX = (HUD_FONT_PX >= 16) ? 9 : 10;
    const hpW = ctx.measureText('HP   ' + (Math.ceil(player.hp) | 0)).width;
    ctx.font = WPN_FONT_PX + 'px monospace';
    const wpnName = WEAPONS[weapon].name;
    const wpnW = ctx.measureText(wpnName).width;
    const wpnX = 4 + hpW + 6;
    const wpnY = textY + ((HUD_FONT_PX - WPN_FONT_PX) >> 1);
    ctx.fillStyle = '#7fd3ff';
    ctx.textAlign = 'left';
    ctx.fillText(wpnName, wpnX, wpnY);
    weaponHudRect = { x: wpnX, y: H - HUD_STRIP_H, w: wpnW, h: HUD_STRIP_H };
    ctx.font = HUD_FONT_PX + 'px monospace';

    // level-exit-progression: LEVEL readout sits between AMMO and KILLS.
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + level, (W * 0.65) | 0, textY);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'right';
    ctx.fillText('KILLS ' + stats.kills, W - 4, textY);
    ctx.textAlign = 'left';
  }

  // ---------------------------------------------------------------------------
  // Minimap: 96x96 px, top-left (8 px inset), centered on the player. Drawn
  // via ctx after the world blit so the triangle and dots stay crisp.
  // ---------------------------------------------------------------------------
  const MM_X = 8;
  const MM_Y = 8;
  const MM_SIZE = 96;
  const MM_CELLS = 12;
  const MM_CELL_PX = MM_SIZE / MM_CELLS; // 8 px per world cell
  // Per-theme minimap fill colors. Indexed by THEME_MAP cell value
  // (0=crypt, 1=foundry, 2=cavern). Functional dots — instantly recognizable
  // per theme at minimap scale, not pixel-accurate samples of the wall textures.
  const MM_THEME_COLOR = ['#5a6878', '#a85c30', '#52744a',
                          '#5a6aa8', '#c8a83a', '#b58a48'];
  // crypt = slate blue-grey, foundry = rust orange, cavern = mossy green,
  // abyss = cold blue, bunker = caution yellow, sanctum = warm gold.

  function drawMinimap() {
    const cellPx = MM_CELL_PX;
    const half = MM_SIZE / 2;
    const cx = MM_X + half;
    const cy = MM_Y + half;

    // Backdrop
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(MM_X, MM_Y, MM_SIZE, MM_SIZE);

    // Player-centered camera in world cells.
    const originX = player.x - MM_CELLS / 2;
    const originY = player.y - MM_CELLS / 2;
    const startX = Math.floor(originX);
    const startY = Math.floor(originY);
    const endX = startX + MM_CELLS + 1;
    const endY = startY + MM_CELLS + 1;

    // Clip so partial cells at the edges don't bleed past the minimap rect.
    ctx.save();
    ctx.beginPath();
    ctx.rect(MM_X, MM_Y, MM_SIZE, MM_SIZE);
    ctx.clip();

    for (let my = startY; my <= endY; my++) {
      if (my < 0 || my >= MAP_H) continue;
      const row = MAP[my];
      for (let mx = startX; mx <= endX; mx++) {
        if (mx < 0 || mx >= MAP_W) continue;
        const cell = row[mx];
        if (cell === 0) continue;
        const sx = (mx - originX) * cellPx + MM_X;
        const sy = (my - originY) * cellPx + MM_Y;
        const t = (forcedThemeIdx >= 0) ? forcedThemeIdx
                                        : THEME_MAP[my * MAP_W + mx];
        ctx.fillStyle = MM_THEME_COLOR[t];
        ctx.fillRect(sx, sy, cellPx, cellPx);
      }
    }

    // level-exit-progression: paint the exit cell after walls and before
    // enemy dots / player triangle, so live enemies and the player still
    // draw on top when standing on it.
    if (EXIT.cellX >= startX && EXIT.cellX <= endX &&
        EXIT.cellY >= startY && EXIT.cellY <= endY) {
      const ex = (EXIT.cellX - originX) * cellPx + MM_X;
      const ey = (EXIT.cellY - originY) * cellPx + MM_Y;
      ctx.fillStyle = '#3f3';
      ctx.fillRect(ex, ey, cellPx, cellPx);
    }

    // Live enemies as 2x2 red dots (centered on the enemy's cell position).
    ctx.fillStyle = '#f33';
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const sx = (e.x - originX) * cellPx + MM_X - 1;
      const sy = (e.y - originY) * cellPx + MM_Y - 1;
      if (sx < MM_X - 2 || sx > MM_X + MM_SIZE) continue;
      if (sy < MM_Y - 2 || sy > MM_Y + MM_SIZE) continue;
      ctx.fillRect(sx, sy, 2, 2);
    }

    // pickups-health-ammo: 2x2 dots — green for health, yellow for ammo.
    // Sits inside the clipped player-centered region; player triangle draws
    // after ctx.restore() so it always layers on top.
    for (let i = 0; i < pickups.length; i++) {
      const p = pickups[i];
      if (!p.alive) continue;
      const sx = (p.x - originX) * cellPx + MM_X - 1;
      const sy = (p.y - originY) * cellPx + MM_Y - 1;
      if (sx < MM_X - 2 || sx > MM_X + MM_SIZE) continue;
      if (sy < MM_Y - 2 || sy > MM_Y + MM_SIZE) continue;
      ctx.fillStyle = (p.type === 'health_small' || p.type === 'health_large')
        ? '#3c8'
        : '#fc3';
      ctx.fillRect(sx, sy, 2, 2);
    }

    ctx.restore();

    // Player triangle, rotated to face along (dirX, dirY). The local "tip"
    // sits at (0, -3) (screen-up in local space). Under canvas Y-down, rotating
    // local "up" (0, -1) onto world facing (dirX, dirY) needs +pi/2, not -pi/2.
    const angle = Math.atan2(player.dirY, player.dirX) + Math.PI / 2;
    const cs = Math.cos(angle), sn = Math.sin(angle);
    const tri = [[0, -3], [-2, 2], [2, 2]];
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    for (let i = 0; i < tri.length; i++) {
      const lx = tri[i][0], ly = tri[i][1];
      const wx = lx * cs - ly * sn + cx;
      const wy = lx * sn + ly * cs + cy;
      if (i === 0) ctx.moveTo(wx, wy);
      else ctx.lineTo(wx, wy);
    }
    ctx.closePath();
    ctx.fill();
  }

  // ---------------------------------------------------------------------------
  // Sprite renderer. Runs after the wall pass populates `zBuffer` and before
  // the single putImageData blit. Per-screen-column z-test against `zBuffer`.
  // ---------------------------------------------------------------------------
  // Scratch list reused each frame to avoid allocation in the hot loop.
  const spriteOrder = [];
  // level-exit-progression: synthetic "entity" used to feed the exit pillar
  // into the existing sprite pipeline. Reused across frames so we don't
  // allocate; only x/y are updated when EXIT changes via the getter below.
  const exitSpriteEntity = {
    x: 0, y: 0,
    type: 'exit',
    animPhase: 0,
    hitFlashUntil: 0,
    fireFlashUntil: 0,
    mode: 'idle',
    modeUntil: 0,
  };

  function drawSprites() {
    spriteOrder.length = 0;
    const px = player.x, py = player.y;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const dx = e.x - px;
      const dy = e.y - py;
      spriteOrder.push({ e, dx, dy, d2: dx * dx + dy * dy, id: i });
    }
    // enemy-projectile-attacks: in-flight projectiles share the entity
    // pipeline. id offset keeps them out of the enemy id range so the
    // stable-sort tiebreak never interleaves enemies and projectiles.
    for (let i = 0; i < projectiles.length; i++) {
      const p = projectiles[i];
      if (!p.alive) continue;
      const dx = p.x - px;
      const dy = p.y - py;
      spriteOrder.push({ e: p, dx, dy, d2: dx * dx + dy * dy, id: 1000 + i });
    }
    // pickups-health-ammo: id offset 2000 keeps the stable-sort tiebreak
    // deterministic across the four entity categories (enemies 0..N,
    // projectiles 1000..1000+M, pickups 2000..2000+P, exit -1).
    for (let i = 0; i < pickups.length; i++) {
      const p = pickups[i];
      if (!p.alive) continue;
      const dx = p.x - px;
      const dy = p.y - py;
      spriteOrder.push({ e: p, dx, dy, d2: dx * dx + dy * dy, id: 2000 + i });
    }
    // Push the exit pillar as a synthetic entry. id: -1 keeps the sort
    // stable in the (rare) tie case where a sprite sits at the same d2.
    exitSpriteEntity.x = EXIT.cellX + 0.5;
    exitSpriteEntity.y = EXIT.cellY + 0.5;
    {
      const dx = exitSpriteEntity.x - px;
      const dy = exitSpriteEntity.y - py;
      spriteOrder.push({ e: exitSpriteEntity, dx, dy, d2: dx * dx + dy * dy, id: -1 });
    }
    if (spriteOrder.length === 0) return;
    // Farthest first so nearer sprites overdraw. Stable tiebreak on id.
    spriteOrder.sort((a, b) => (b.d2 - a.d2) || (a.id - b.id));

    const invDet = 1.0 / (player.planeX * fovPunch * player.dirY - player.dirX * player.planeY * fovPunch);
    const halfW = W >> 1;
    const halfH = H >> 1;

    for (let s = 0; s < spriteOrder.length; s++) {
      const o = spriteOrder[s];
      const transformX = invDet * (player.dirY * o.dx - player.dirX * o.dy);
      const transformY = invDet * (-player.planeY * fovPunch * o.dx + player.planeX * fovPunch * o.dy);
      if (transformY <= 0.01) continue; // behind / on camera plane

      const screenX = (halfW * (1 + transformX / transformY)) | 0;
      const spriteH = Math.abs((H / transformY) | 0);
      const spriteW = spriteH;
      if (spriteH < 1) continue;

      const drawStartX = -((spriteW >> 1)) + screenX;
      const drawStartY = -((spriteH >> 1)) + halfH;
      const drawEndX = drawStartX + spriteW;
      const drawEndY = drawStartY + spriteH;

      let clipStartX = drawStartX < 0 ? 0 : drawStartX;
      let clipEndX   = drawEndX   > W ? W : drawEndX;
      let clipStartY = drawStartY < 0 ? 0 : drawStartY;
      let clipEndY   = drawEndY   > H ? H : drawEndY;
      if (clipStartX >= clipEndX || clipStartY >= clipEndY) continue;

      const frames = SPRITES[o.e.type];
      const sprite = frames[(o.e.animPhase | 0) & 1];
      const flash = nowMs < o.e.hitFlashUntil;
      const tint = o.e.mode === 'wind';

      // atmosphere-lighting: when on, fog blend on transformY mirrors the
      // wall path; when off, fall back to the legacy 1/d shade so the L
      // toggle is a true A/B comparison.
      let shade = 1, fogIt = 0, fogIb = 256;
      const fogR = FOG_C & 0xff, fogG = (FOG_C >> 8) & 0xff, fogB = (FOG_C >> 16) & 0xff;
      if (lightingEnabled) {
        let t = (transformY - FOG_NEAR) / (FOG_FAR - FOG_NEAR);
        if (t < 0) t = 0; else if (t > 1) t = 1;
        fogIt = (t * 256) | 0;
        fogIb = 256 - fogIt;
      } else {
        shade = Math.min(1, 5 / (transformY + 0.5));
      }
      const sStep = SPRITE_SIZE / spriteH;
      const tStep = SPRITE_SIZE / spriteW;

      for (let stripe = clipStartX; stripe < clipEndX; stripe++) {
        if (transformY >= zBuffer[stripe]) continue;
        const texX = (((stripe - drawStartX) * tStep) | 0);
        if (texX < 0 || texX >= SPRITE_SIZE) continue;

        let texY = (clipStartY - drawStartY) * sStep;
        let bufIdx = clipStartY * W + stripe;
        for (let y = clipStartY; y < clipEndY; y++) {
          const ty = texY | 0;
          texY += sStep;
          if (ty >= 0 && ty < SPRITE_SIZE) {
            const c = sprite[ty * SPRITE_SIZE + texX];
            if (c !== 0) {
              if (flash) {
                buf32[bufIdx] = 0xffffffff; // full white silhouette
              } else {
                let r, g, b;
                if (lightingEnabled) {
                  r = (c       ) & 0xff;
                  g = (c >>  8) & 0xff;
                  b = (c >> 16) & 0xff;
                } else {
                  r = (((c       ) & 0xff) * shade) | 0;
                  g = (((c >>  8) & 0xff) * shade) | 0;
                  b = (((c >> 16) & 0xff) * shade) | 0;
                }
                if (tint) {
                  r = r + 80; if (r > 255) r = 255;
                  g = (g * 0.4) | 0;
                  b = (b * 0.4) | 0;
                }
                if (lightingEnabled) {
                  // Same fog blend formula as the wall path.
                  r = (r * fogIb + fogR * fogIt) >> 8;
                  g = (g * fogIb + fogG * fogIt) >> 8;
                  b = (b * fogIb + fogB * fogIt) >> 8;
                }
                buf32[bufIdx] = (255 << 24) | ((b & 0xff) << 16) | ((g & 0xff) << 8) | (r & 0xff);
              }
            }
          }
          bufIdx += W;
        }
      }
    }
  }

  // Single-frame additive flash at each firing enemy's projected screen
  // position. Drawn over the buf blit so it's cheap and always on top.
  function drawEnemyMuzzleFlashes() {
    const invDet = 1.0 / (player.planeX * player.dirY - player.dirX * player.planeY);
    const halfW = W >> 1;
    const halfH = H >> 1;
    let active = false;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      if (nowMs >= e.fireFlashUntil) continue;
      const dx = e.x - player.x;
      const dy = e.y - player.y;
      const tx = invDet * (player.dirY * dx - player.dirX * dy);
      const ty = invDet * (-player.planeY * dx + player.planeX * dy);
      if (ty <= 0.01) continue; // behind / on camera plane
      const screenX = (halfW * (1 + tx / ty)) | 0;
      if (screenX < -8 || screenX >= W + 8) continue;
      if (!active) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255, 220, 80, 0.85)';
        active = true;
      }
      const size = Math.max(3, (16 / ty) | 0);
      ctx.fillRect(screenX - (size >> 1), halfH - (size >> 1), size, size);
    }
    if (active) ctx.globalCompositeOperation = 'source-over';
  }

  // gun-muzzle-wash: soft additive radial light wash anchored at the gun's
  // barrel screen position. Replaces the flat yellow rectangle scrim. Peaks
  // at fire and decays quadratically over MUZZLE_FLASH_MS.
  function drawMuzzleScreenWash(now) {
    if (player.hp <= 0) return;
    if (now >= muzzleFlashUntil) return;
    // t goes from 1 at the moment of firing to 0 at expiry.
    const t = (muzzleFlashUntil - now) / MUZZLE_FLASH_MS;
    // Quadratic ease-out: bright spike at fire, fast fade. Matches the
    // perceptual "punch" of a real muzzle blast — peaks instantly, decays
    // in <1 frame at 60 FPS to ~70% then trails off.
    const a = MUZZLE_WASH_PEAK_A * t * t;
    if (a <= 0) return;
    const R = Math.min(W, H) * MUZZLE_WASH_RADIUS_FRAC;
    const grad = ctx.createRadialGradient(
      muzzleAnchorX, muzzleAnchorY, 0,
      muzzleAnchorX, muzzleAnchorY, R
    );
    // Three-stop palette mirrors FLASH_FRAME_1: hot white core, warm
    // yellow ring, dim orange falloff, fully transparent at the edge.
    grad.addColorStop(0.00, `rgba(255, 250, 230, ${(a       ).toFixed(3)})`);
    grad.addColorStop(0.25, `rgba(255, 220,  90, ${(a * 0.72).toFixed(3)})`);
    grad.addColorStop(0.55, `rgba(220, 130,  40, ${(a * 0.32).toFixed(3)})`);
    grad.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------------------------------------------------------------------------
  // gun-viewmodel: procedural pistol + muzzle flash, blitted into buf32 between
  // drawSprites() and putImageData so it's part of the world frame but lives
  // above the wall/sprite pass. The sprites are baked once at startup; only
  // the per-frame offsets (bob + kick) change.
  // ---------------------------------------------------------------------------
  function gunFillRect(spr, x, y, w, h, color) {
    for (let yy = y; yy < y + h; yy++) {
      if (yy < 0 || yy >= GUN_H) continue;
      for (let xx = x; xx < x + w; xx++) {
        if (xx < 0 || xx >= GUN_W) continue;
        spr[yy * GUN_W + xx] = color;
      }
    }
  }
  function gunOutlineRect(spr, x, y, w, h, color) {
    gunFillRect(spr, x, y, w, 1, color);
    gunFillRect(spr, x, y + h - 1, w, 1, color);
    gunFillRect(spr, x, y, 1, h, color);
    gunFillRect(spr, x + w - 1, y, 1, h, color);
  }

  function buildGun() {
    const PALETTE = {
      outline:  rgba32( 20,  18,  22),
      bodyDark: rgba32( 60,  60,  70),
      bodyMid:  rgba32(100, 100, 110),
      bodyHi:   rgba32(170, 170, 180),
      grip:     rgba32( 95,  60,  35),
      gripHi:   rgba32(120,  78,  45),
      gripDark: rgba32( 55,  35,  20),
      sight:    rgba32(220, 200,  80),
    };
    const spr = new Uint32Array(GUN_W * GUN_H);

    // 1. Slide — flat, mirror-symmetric across the sprite seam (between
    //    columns 35 and 36). Body fill, top highlight strip, dark vertical
    //    side walls, centered spine highlight, then outline.
    gunFillRect(spr, 22, 6, 28, 24, PALETTE.bodyMid);
    gunFillRect(spr, 24, 7, 24,  2, PALETTE.bodyHi);
    gunFillRect(spr, 22, 8,  2, 20, PALETTE.bodyDark);
    gunFillRect(spr, 48, 8,  2, 20, PALETTE.bodyDark);
    gunFillRect(spr, 34, 9,  4, 12, PALETTE.bodyHi);
    gunOutlineRect(spr, 22, 6, 28, 24, PALETTE.outline);

    // 2. Muzzle hole — centered on the seam, anchors the muzzle flash at
    //    (BARREL_X, BARREL_Y).
    gunFillRect(spr, 34, 6, 4, 4, PALETTE.outline);

    // 3. Front sight — bright nub above the slide, centered on the seam.
    gunFillRect(spr,    34, 2, 4, 4, PALETTE.sight);
    gunOutlineRect(spr, 34, 2, 4, 4, PALETTE.outline);

    // 4. Rear sights — mirror pair at the back of the slide with a bright
    //    cap on top of each block.
    gunFillRect(spr,    25, 24, 4, 5, PALETTE.bodyDark);
    gunFillRect(spr,    25, 24, 4, 1, PALETTE.sight);
    gunOutlineRect(spr, 25, 24, 4, 5, PALETTE.outline);
    gunFillRect(spr,    43, 24, 4, 5, PALETTE.bodyDark);
    gunFillRect(spr,    43, 24, 4, 1, PALETTE.sight);
    gunOutlineRect(spr, 43, 24, 4, 5, PALETTE.outline);

    // 5. Frame (lower receiver) — wider than the slide, centered. The
    //    trigger guard interior is filled with PALETTE.outline so the
    //    world never shows through; the trigger sliver sits centered on
    //    the seam in PALETTE.bodyMid.
    gunFillRect(spr,    18, 30, 36, 20, PALETTE.bodyDark);
    gunFillRect(spr,    20, 31, 32,  2, PALETTE.bodyMid);
    gunOutlineRect(spr, 18, 30, 36, 20, PALETTE.outline);
    gunFillRect(spr,    26, 35, 20, 12, PALETTE.outline);
    gunFillRect(spr,    35, 37,  2,  8, PALETTE.bodyMid);

    // 6. Grip — vertical, centered on the seam, with mirrored highlight
    //    stripes hugging the left/right walls and symmetric checkering.
    //    Bottom edge runs to GUN_H - 1 so the existing baseY trim hides
    //    the last 4 rows (hand off-frame).
    const GRIP_X = 25, GRIP_Y = 50, GRIP_W = 22, GRIP_H = GUN_H - GRIP_Y;
    gunFillRect(spr, GRIP_X, GRIP_Y, GRIP_W, GRIP_H, PALETTE.grip);
    gunFillRect(spr, GRIP_X + 1,          GRIP_Y + 1, 2, GRIP_H - 2, PALETTE.gripHi);
    gunFillRect(spr, GRIP_X + GRIP_W - 3, GRIP_Y + 1, 2, GRIP_H - 2, PALETTE.gripHi);
    for (let yy = GRIP_Y + 2; yy < GRIP_Y + GRIP_H - 1; yy += 3) {
      if (yy >= GUN_H) continue;
      const base = yy * GUN_W;
      for (let dotX = GRIP_X + 3; dotX <= GRIP_X + GRIP_W - 3; dotX += 3) {
        spr[base + dotX] = PALETTE.gripDark;
      }
    }
    gunOutlineRect(spr, GRIP_X, GRIP_Y, GRIP_W, GRIP_H, PALETTE.outline);

    return spr;
  }

  // shotgun-weapon-pickup: procedural pump shotgun viewmodel, built once at
  // startup into the same Uint32Array(GUN_W * GUN_H) / 0-transparent contract
  // as buildGun() so it drops straight into the existing drawGunViewmodel
  // blit with no change to the blit math, bob, sway, equip-slide, or shadow.
  // Flat Doom-style centered framing about the col-35/36 seam; reads as a
  // shotgun (long twin barrels to the muzzle, wooden pump under the barrel,
  // broad stock to the lower-rear), visibly chunkier than the pistol.
  function buildShotgun() {
    const P = {
      outline: rgba32( 18,  16,  18),
      mDark:   rgba32( 45,  47,  55),
      mMid:    rgba32( 88,  92, 104),
      mHi:     rgba32(150, 156, 170),
      wood:    rgba32(112,  72,  40),
      woodHi:  rgba32(146,  96,  54),
      woodDk:  rgba32( 72,  46,  24),
      bore:    rgba32(  8,   8,  10),
      bead:    rgba32(220, 200,  90),
    };
    const spr = new Uint32Array(GUN_W * GUN_H);

    // 1. Buttstock — broad wooden stock to the lower-rear. Drawn first so the
    //    receiver / trigger guard overlay it. Bottom runs to GUN_H - 1 so the
    //    existing baseY trim hides the last rows (hand off-frame).
    const STX = 23, STY = 70, STW = 26, STH = GUN_H - STY;
    gunFillRect(spr, STX, STY, STW, STH, P.wood);
    gunFillRect(spr, STX + 1,       STY + 1, 3, STH - 2, P.woodHi);
    gunFillRect(spr, STX + STW - 4, STY + 1, 3, STH - 2, P.woodDk);
    for (let yy = STY + 3; yy < GUN_H - 1; yy += 3) {
      const base = yy * GUN_W;
      for (let dx = STX + 4; dx <= STX + STW - 5; dx += 3) spr[base + dx] = P.woodDk;
    }
    gunOutlineRect(spr, STX, STY, STW, STH, P.outline);

    // 2. Receiver — metal box, wider than the barrel, with an offset
    //    ejection port. Drawn over the stock's upper edge.
    gunFillRect(spr, 18, 54, 36, 20, P.mMid);
    gunFillRect(spr, 20, 55, 32,  2, P.mHi);
    gunFillRect(spr, 18, 56,  2, 16, P.mDark);
    gunFillRect(spr, 52, 56,  2, 16, P.mDark);
    gunFillRect(spr, 39, 58, 12,  5, P.mDark);
    gunOutlineRect(spr, 18, 54, 36, 20, P.outline);

    // 3. Trigger guard — outline-filled loop hanging below the receiver so
    //    the world never shows through; centered trigger sliver on the seam.
    gunFillRect(spr, 28, 74, 16,  9, P.outline);
    gunFillRect(spr, 30, 76, 12,  5, P.mDark);
    gunFillRect(spr, 35, 76,  2,  7, P.mMid);

    // 4. Fore-end / pump — broad wooden slide wrapped under the barrels with
    //    vertical grip ridges so it reads as a pump-action fore-end.
    gunFillRect(spr, 22, 38, 28, 18, P.wood);
    gunFillRect(spr, 24, 39, 24,  2, P.woodHi);
    gunFillRect(spr, 24, 52, 24,  2, P.woodDk);
    for (let rx = 26; rx <= 46; rx += 4) gunFillRect(spr, rx, 41, 1, 11, P.woodDk);
    gunOutlineRect(spr, 22, 38, 28, 18, P.outline);

    // 5. Twin barrels — wide block to the muzzle, centered on the seam, with
    //    a rib between two bores. Anchors the muzzle flash at (36, 6).
    gunFillRect(spr, 26,  4, 20, 36, P.mMid);
    gunFillRect(spr, 28,  6,  7, 32, P.mHi);
    gunFillRect(spr, 37,  6,  7, 32, P.mHi);
    gunFillRect(spr, 35,  4,  2, 36, P.mDark);
    gunFillRect(spr, 26,  4, 20,  3, P.mDark);
    gunFillRect(spr, 29,  4,  5,  4, P.bore);
    gunFillRect(spr, 38,  4,  5,  4, P.bore);
    gunOutlineRect(spr, 26, 4, 20, 36, P.outline);

    // 6. Front bead sight — bright nub centered above the muzzle.
    gunFillRect(spr,    35, 1, 2, 4, P.bead);
    gunOutlineRect(spr, 35, 1, 2, 4, P.outline);

    return spr;
  }

  function buildFlash1() {
    const spr = new Uint32Array(FLASH_W * FLASH_H);
    const cx = FLASH_W >> 1, cy = FLASH_H >> 1;
    for (let y = 0; y < FLASH_H; y++) {
      for (let x = 0; x < FLASH_W; x++) {
        const dx = x - cx, dy = y - cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d <= 3.5) {
          spr[y * FLASH_W + x] = rgba32(255, 250, 230); // bright white core
        } else if (d <= 6) {
          spr[y * FLASH_W + x] = rgba32(255, 220,  90); // warm yellow ring
        } else if (d <= 8) {
          spr[y * FLASH_W + x] = rgba32(160, 110,  30); // dim warm-orange falloff
        }
      }
    }
    return spr;
  }

  function buildFlash2() {
    const spr = new Uint32Array(FLASH_W * FLASH_H);
    const cx = FLASH_W >> 1, cy = FLASH_H >> 1;
    for (let y = 0; y < FLASH_H; y++) {
      for (let x = 0; x < FLASH_W; x++) {
        const dx = x - cx, dy = y - cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d <= 4) {
          spr[y * FLASH_W + x] = rgba32(255, 235, 160); // hot center
        } else if (d <= 7) {
          spr[y * FLASH_W + x] = rgba32(220, 170,  60); // mid yellow
        }
      }
    }
    // 6 radial rays out to ~11 px, taper warm-yellow → dim orange.
    for (let r = 0; r < 6; r++) {
      const angle = (r / 6) * 2 * Math.PI;
      const ca = Math.cos(angle), sa = Math.sin(angle);
      for (let i = 5; i <= 11; i++) {
        const x = (cx + ca * i + 0.5) | 0;
        const y = (cy + sa * i + 0.5) | 0;
        if (x < 0 || x >= FLASH_W || y < 0 || y >= FLASH_H) continue;
        const t = (i - 5) / 6;
        const r8 = Math.max(0, (220 - t * 100) | 0);
        const g8 = Math.max(0, (160 - t *  90) | 0);
        const b8 = Math.max(0, ( 60 - t *  40) | 0);
        const idx = y * FLASH_W + x;
        if (spr[idx] === 0) spr[idx] = rgba32(r8, g8, b8);
      }
    }
    return spr;
  }

  const GUN_SPRITE = buildGun();
  const SHOTGUN_SPRITE = buildShotgun();
  const FLASH_FRAME_1 = buildFlash1();
  const FLASH_FRAME_2 = buildFlash2();

  // shotgun-weapon-pickup: module-scope weapon registry, keyed by id. The
  // pistol entry reproduces today's exact behavior (FIRE_COOLDOWN_MS,
  // ammoCost 1, a single ray, SHOT_DAMAGE, the existing GUN_SPRITE, and the
  // existing BARREL_X/BARREL_Y anchor) so the pistol path stays byte-for-byte
  // unchanged. kickScale is read in getKickOffsets — pistol is exactly 1.0
  // (× 1.0 is identity, so pistol kick magnitudes are unchanged); the shotgun
  // kicks harder through that single multiplier, not a forked state machine.
  // Defined after the sprites are built; only read from runtime-invoked
  // functions (fireShot / getKickOffsets / drawGunViewmodel / HUD).
  const WEAPONS = {
    pistol: {
      name: 'PISTOL',
      cooldownMs: FIRE_COOLDOWN_MS,
      ammoCost: 1,
      pellets: 1,
      spreadRad: 0,
      damage: SHOT_DAMAGE,
      sprite: GUN_SPRITE,
      barrelX: BARREL_X,
      barrelY: BARREL_Y,
      kickScale: 1.0,
    },
    shotgun: {
      name: 'SHOTGUN',
      cooldownMs: SHOTGUN_COOLDOWN_MS,
      ammoCost: SHOTGUN_AMMO_COST,
      pellets: SHOTGUN_PELLETS,
      spreadRad: SHOTGUN_SPREAD_RAD,
      damage: SHOTGUN_PELLET_DAMAGE,
      sprite: SHOTGUN_SPRITE,
      barrelX: 36,
      barrelY: 6,
      kickScale: 1.7,
    },
  };

  // Hitscan-weapon's fireShot() calls this on a successful shot ('shot') and
  // on a dry-fire click with empty mag ('dry'). The dry-fire path uses smaller
  // magnitudes and never shows a muzzle flash.
  function onPlayerFire(kind) {
    kickState = 'kicking';
    kickKind  = (kind === 'dry') ? 'dry' : 'shot';
    kickStart = performance.now();
    // gun-feel-polish: only 'shot' fires the FOV punch. Dry-fire stays small.
    if (kind !== 'dry') fovPunch = 1.0 + FOV_PUNCH_AMOUNT;
  }

  function tickKick(now) {
    if (kickState === 'kicking') {
      const t = (now - kickStart) / KICK_UP_MS;
      if (t >= 1) {
        kickState = 'recovering';
        kickStart = now;
      }
    } else if (kickState === 'recovering') {
      const t = (now - kickStart) / KICK_RECOVER_MS;
      if (t >= 1) {
        kickState = 'idle';
        kickStart = now;
      }
    }
  }

  // Returns the per-frame additional kick offset + flash frame index. Dry-fire
  // paths never set flashFrame > 0; only 'shot' kicks during the kicking phase
  // produce a muzzle flash.
  function getKickOffsets(now) {
    let kickX = 0, kickY = 0, flashFrame = 0;
    if (kickState === 'kicking') {
      const t = Math.min(1, (now - kickStart) / KICK_UP_MS);
      if (kickKind === 'shot') {
        kickX = -2;
        kickY = -10;
        flashFrame = (t < 0.5) ? 1 : 2; // 1 → 2 over the 60 ms
      } else {
        kickX = 0;
        kickY = -2;
        flashFrame = 0;
      }
    } else if (kickState === 'recovering') {
      const t = Math.min(1, (now - kickStart) / KICK_RECOVER_MS);
      const ease = (1 - t) * (1 - t); // quadratic ease-out
      if (kickKind === 'shot') {
        kickX = -2  * ease;
        kickY = -10 * ease;
      } else {
        kickX = 0;
        kickY = -2  * ease;
      }
      flashFrame = 0;
    }
    // shotgun-weapon-pickup: per-weapon kick punch. Only the 'shot' kick is
    // scaled (dry-fire kick stays identical for every weapon, as today).
    // Pistol kickScale is exactly 1.0 and × 1.0 is an identity on doubles,
    // so the pistol's kick magnitudes are byte-for-byte unchanged.
    if (kickKind === 'shot') {
      const sc = WEAPONS[weapon].kickScale;
      kickX *= sc;
      kickY *= sc;
    }
    return { kickX, kickY, flashFrame };
  }

  // gun-feel-polish: vertical gradient darkening the bottom band of buf32.
  // Drawn BEFORE the gun blit so opaque gun pixels are not darkened. Pure
  // RGB scale (alpha byte preserved). Suppressed during death so the
  // death-overlay frame doesn't show a darkened strip without the gun.
  function drawGunShadow() {
    if (player.hp <= 0) return;
    const top = H - SHADOW_H;
    for (let y = 0; y < SHADOW_H; y++) {
      const a   = (y / (SHADOW_H - 1)) * SHADOW_MAX_DARK;
      const inv = 1 - a;
      const py  = top + y;
      const rowBase = py * W;
      for (let x = 0; x < W; x++) {
        const i = rowBase + x;
        const c = buf32[i];
        const r = ((c       ) & 0xff) * inv;
        const g = ((c >>>  8) & 0xff) * inv;
        const b = ((c >>> 16) & 0xff) * inv;
        buf32[i] = (255 << 24) | ((b & 0xff) << 16) | ((g & 0xff) << 8) | (r & 0xff);
      }
    }
  }

  // World-frame blit: gun first, then optional muzzle flash with saturating-add
  // (per spec #9). Both anchored to gunX/gunY + bob + kick. Skipped entirely
  // when the player is dead (the kick state machine still ticks elsewhere).
  function drawGunViewmodel() {
    if (player.hp <= 0) return;

    // shotgun-weapon-pickup: sprite + barrel anchor come from the active
    // weapon. With the pistol selected these are GUN_SPRITE / BARREL_X /
    // BARREL_Y, so the blit is byte-identical to today.
    const wpn = WEAPONS[weapon];
    const sprite = wpn.sprite;

    const bobOffX = Math.sin(bobPhase) * 3 * bobIntensity;
    const bobOffY = -Math.abs(Math.sin(bobPhase * 2)) * 2 * bobIntensity;
    const k = getKickOffsets(performance.now());
    // gun-feel-polish: sub-pixel Lissajous breath driven by nowMs directly.
    // Quantization through Math.round produces an alternating ±1 px breath
    // that's overpowered by bob + kick in motion but visibly alive at idle.
    const swayX = Math.sin(nowMs * SWAY_FREQ_X) * SWAY_AMP_X;
    const swayY = Math.cos(nowMs * SWAY_FREQ_Y) * SWAY_AMP_Y;
    // gun-feel-polish: equip slide-in. Quadratic ease-out: most motion in the
    // first ~1/3 of the slide so the gun "lands" softly at baseY. | 0 keeps
    // the offset integer-pixel matching the rest of the blit. equipFramesLeft
    // is suspended through death (the early-return above skips this body).
    let equipOffY = 0;
    if (equipFramesLeft > 0) {
      const tProg = (EQUIP_FRAMES - equipFramesLeft) / EQUIP_FRAMES;
      const ease  = (1 - tProg) * (1 - tProg);
      equipOffY = (ease * EQUIP_DROP_PX) | 0;
      equipFramesLeft--;
    }
    const baseX = ((W - GUN_W) >> 1) + GUN_RIGHT_SHIFT;
    const baseY = H - GUN_H + 4;
    const dx = baseX + Math.round(bobOffX + k.kickX + swayX);
    const dy = baseY + Math.round(bobOffY + k.kickY + swayY) + equipOffY;

    // Gun blit (alpha-test: 0 ⇒ skip).
    for (let sy = 0; sy < GUN_H; sy++) {
      const py = dy + sy;
      if (py < 0 || py >= H) continue;
      for (let sx = 0; sx < GUN_W; sx++) {
        const px = dx + sx;
        if (px < 0 || px >= W) continue;
        const sc = sprite[sy * GUN_W + sx];
        if (sc === 0) continue;
        buf32[py * W + px] = sc;
      }
    }

    // Muzzle flash (saturating add) anchored at the active weapon's barrel.
    const barrelX = dx + wpn.barrelX;
    const barrelY = dy + wpn.barrelY;
    muzzleAnchorX = barrelX;
    muzzleAnchorY = barrelY;
    if (k.flashFrame > 0) {
      const flash = (k.flashFrame === 1) ? FLASH_FRAME_1 : FLASH_FRAME_2;
      const fdx = barrelX - (FLASH_W >> 1);
      const fdy = barrelY - (FLASH_H >> 1);
      for (let sy = 0; sy < FLASH_H; sy++) {
        const py = fdy + sy;
        if (py < 0 || py >= H) continue;
        for (let sx = 0; sx < FLASH_W; sx++) {
          const px = fdx + sx;
          if (px < 0 || px >= W) continue;
          const sc = flash[sy * FLASH_W + sx];
          if (sc === 0) continue;
          const i = py * W + px;
          const dst = buf32[i];
          const r = Math.min(255, (dst         & 0xff) + (sc         & 0xff));
          const g = Math.min(255, ((dst >>  8) & 0xff) + ((sc >>  8) & 0xff));
          const b = Math.min(255, ((dst >> 16) & 0xff) + ((sc >> 16) & 0xff));
          buf32[i] = (255 << 24) | ((b & 0xff) << 16) | ((g & 0xff) << 8) | (r & 0xff);
        }
      }
    }
  }

  // mobile-touch-polish: one-shot look-sensitivity auto-tune. canvas.clientWidth
  // can be 0 during initial IIFE execution, so defer one frame. Map fb-px
  // touch deltas back to a CSS-px-equivalent feel; clamp to a sane range so
  // odd viewports don't go wild. Fixed for the session — does not recompute
  // on resize / orientation change.
  if (isTouchDevice) {
    requestAnimationFrame(() => {
      const cw = canvas.clientWidth || W;
      touchLookScale = Math.max(0.6, Math.min(2.0, cw / W));
      // mobile-mc-feel: pick a HUD font tier from the same one-shot read so
      // narrow phones (~iPhone SE / 360-px Androids) get readable text.
      touchHudTier = (cw <= 380) ? 'narrow' : 'medium';
    });
  }

  // Game loop.
  let lastTime = performance.now();
  let fps = 0;
  let fpsAcc = 0, fpsFrames = 0;

  function loop(now) {
    nowMs = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05; // avoid teleport on tab refocus
    if (!(dt >= 0)) dt = 0;

    update(dt);
    render();

    fpsAcc += dt;
    fpsFrames++;
    if (fpsAcc >= 0.5) {
      fps = fpsFrames / fpsAcc;
      fpsAcc = 0;
      fpsFrames = 0;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
