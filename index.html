<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Raycaster MVP</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: monospace;
    color: #ccc;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
    display: block;
    background: #000;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .hint {
    position: fixed;
    bottom: 8px;
    left: 8px;
    font-size: 12px;
    color: #aaa;
    pointer-events: none;
    text-shadow: 0 1px 2px #000, 0 0 2px #000;
    user-select: none;
  }
  #touch-joy {
    display: none;
    position: fixed;
    left: calc(20px + env(safe-area-inset-left, 0px));
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.08);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    z-index: 10;
    box-sizing: border-box;
  }
  #touch-joy-thumb {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 44px;
    height: 44px;
    margin-left: -22px;
    margin-top: -22px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    pointer-events: none;
    transform: translate(0, 0);
    transition: none;
  }
  @media (pointer: coarse) {
    .hint { display: none; }
    #touch-joy { display: block; }
  }
</style>
</head>
<body>
<canvas id="c" width="480" height="270"></canvas>
<div id="touch-joy" aria-hidden="true">
  <div id="touch-joy-thumb"></div>
</div>
<div class="hint">Click to lock mouse &middot; WASD to move &middot; Mouse / arrows to look &middot; N to regenerate &middot; Esc to release</div>
<script>
'use strict';
(() => {
  const W = 480;
  const H = 270;

  // Combat tuning. These are the contract for spec hitscan-weapon and the
  // downstream Bayesian-skill spec; field names in `stats` must not change.
  const FIRE_COOLDOWN_MS = 250;
  const SHOT_DAMAGE = 2;
  const MAX_AMMO = 24;
  // shotgun-weapon-pickup: second weapon. Shared ammo pool; fixed,
  // deterministic, symmetric pellet fan (no randomness in the spread).
  // These values are the spec contract — do not "rebalance" them.
  const SHOTGUN_PELLETS       = 7;
  const SHOTGUN_SPREAD_RAD    = 0.13;  // total cone is ±SHOTGUN_SPREAD_RAD
  const SHOTGUN_PELLET_DAMAGE = 1;
  const SHOTGUN_AMMO_COST     = 3;
  const SHOTGUN_COOLDOWN_MS   = 650;
  const ENEMY_RADIUS = 0.4;
  const MAX_HP = 100;
  // pickups-health-ammo: walk-on consumable spawns. Values are clamped
  // to MAX_HP / MAX_AMMO; pickup is skipped (left in place) if the
  // player is already at max.
  const PICKUP_RADIUS         = 0.5;   // cells; contact distance for grab
  const PICKUP_HEALTH_SMALL   = 25;    // +HP from small medkit
  const PICKUP_HEALTH_LARGE   = 60;    // +HP from large medkit
  const PICKUP_AMMO_SMALL     = 6;     // +ammo from small crate
  const PICKUP_AMMO_LARGE     = 14;    // +ammo from large crate
  const PICKUP_LARGE_CHANCE   = 0.2;   // 20% large, 80% small
  const PICKUP_MAX_PER_ROOM   = 2;     // 0..2 inclusive per non-starting room
  const MAX_PICKUPS           = 18;    // hard cap per dungeon
  const PICKUP_POP_MS         = 600;   // worldspace text duration
  const PICKUP_POP_MAX        = 8;     // FIFO cap
  const CONTACT_RADIUS = 0.6;
  const CONTACT_DPS = 10;
  const MUZZLE_FLASH_MS = 80;
  const MUZZLE_WASH_RADIUS_FRAC = 0.45;  // fraction of min(W, H)
  const MUZZLE_WASH_PEAK_A      = 0.55;  // peak inner-stop alpha at t=1
  const HIT_TINT_MS = 120;
  const ENEMY_FLASH_MS = 80;
  // enemy-ai-combat: ranged-attack tuning. Times in ms; ranges in cells.
  const ATTACK_RANGE = 5.0;
  const MAX_AUDIBLE_DIST = 12; // cells; ~2.4× ATTACK_RANGE
  const ENEMY_AI_RADIUS = 0.3;
  const ENEMY_SEPARATION_R = 0.6;
  const ENEMY_FIRE_FLASH_MS = 80;
  // enemy-projectile-attacks: visible, dodgeable straight-line projectiles
  // replacing the hitscan resolve in enemyFireShot. Velocity locked at spawn.
  const PROJECTILE_SPEED = 7.0;        // cells per second
  const PROJECTILE_HIT_RADIUS = 0.35;  // cells; player-collision radius
  const PROJECTILE_SPAWN_OFFSET = 0.5; // cells; spawn distance ahead of shooter
  const PROJECTILE_TTL_MS = 2000;      // defensive despawn cap
  // gun-viewmodel: procedural pistol sprite + kick state machine.
  // Times in ms; bob speed in radians/sec scaled by movement intensity.
  // Doom-style layout: flat, mirror-symmetric about the sprite seam, drawn
  // dead-center on screen.
  const GUN_W = 72;
  const GUN_H = 96;
  const GUN_RIGHT_SHIFT = 0;
  const BARREL_X = 36;
  const BARREL_Y = 7;
  const FLASH_W = 24;
  const FLASH_H = 24;
  const BOB_SPEED = 8.0;
  const KICK_UP_MS = 60;
  const KICK_RECOVER_MS = 140;
  // gun-feel-polish: idle sway under the bob (Lissajous, sub-pixel). Different
  // x/y frequencies so the motion never reads as a simple loop. Quantization
  // through Math.round in drawGunViewmodel turns the sub-pixel amplitudes into
  // an alternating ±1 px breath when the bob has eased to rest.
  const SWAY_FREQ_X = 0.0011;
  const SWAY_FREQ_Y = 0.0014;
  const SWAY_AMP_X  = 0.6;
  const SWAY_AMP_Y  = 0.5;
  // gun-feel-polish: equip slide-in armed at user-facing transitions
  // (KeyR / touch RESET / regenerateDungeon / advanceLevel). Frame counter,
  // not timestamp — keeps the slide deterministic across reloads.
  const EQUIP_FRAMES   = 15;
  const EQUIP_DROP_PX  = 24;
  // gun-feel-polish: brief FOV widening on 'shot' kicks. Decays exponentially
  // toward 1.0 each frame; ~110 ms half-life at 60 fps with FOV_PUNCH_DECAY=12.
  const FOV_PUNCH_AMOUNT = 0.022;
  const FOV_PUNCH_DECAY  = 12;
  // gun-feel-polish: vertical drop-shadow band under the gun (last buf32 pass
  // before drawGunViewmodel). Anchors the gun to an implied torso/body.
  const SHADOW_H        = 28;
  const SHADOW_MAX_DARK = 0.40;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const buf = ctx.createImageData(W, H);
  const buf8 = buf.data;
  const buf32 = new Uint32Array(buf8.buffer);

  // Per-column perpendicular-distance z-buffer (used by future sprite specs).
  const zBuffer = new Float32Array(W);

  // Procedurally generated 48x48 map. 0 = empty, 1 = brick (red), 2 = stone (blue).
  // MAP / MAP_W / MAP_H are mutated by applyDungeon() at startup and each N-regen;
  // every reader (castColumn, castRay, isWall, enemyCanSeePlayer, drawMinimap)
  // reads through this live binding rather than a captured snapshot.
  let MAP = [];
  let MAP_W = 0;
  let MAP_H = 0;
  // Per-cell theme index (0=crypt, 1=foundry, 2=cavern). Allocated as a
  // Uint8Array(MAP_W * MAP_H) by generateDungeon and assigned in applyDungeon.
  // Read directly via THEME_MAP[my * MAP_W + mx] in the floor/ceiling cast hot
  // path; the bounds-check there guards the dungeon-edge grazing-ray case.
  let THEME_MAP = null;

  // Player state. dir is a unit vector; plane is perpendicular; |plane| ~ 0.66 -> ~66 deg FOV.
  const player = {
    x: 1.5,
    y: 8.5,
    dirX: 1, dirY: 0,
    planeX: 0, planeY: 0.66,
    hp: MAX_HP
  };

  // Schema is the contract consumed by the upcoming Bayesian-skill spec.
  // Each shot is a Bernoulli trial; success = hit. Do not rename fields.
  // enemyShotsFired/enemyShotsHit are the contract for the future
  // adaptive-spawning spec, which reads them as a player-dodge prior.
  const stats = {
    shotsFired: 0, shotsHit: 0, kills: 0, deaths: 0,
    enemyShotsFired: 0, enemyShotsHit: 0,
  };

  let ammo = MAX_AMMO;
  // shotgun-weapon-pickup: currently-selected weapon id + shotgun ownership.
  // Both carried forward by advanceLevel() (no reset there) and reset to
  // pistol-only by resetRun(). The shotgun cannot be selected while
  // hasShotgun is false (see setWeapon / cycleWeapon).
  let weapon = 'pistol';
  let hasShotgun = false;
  let level = 1;
  let lastFireTime = -Infinity;
  let muzzleFlashUntil = 0;
  let muzzleAnchorX = W >> 1;
  let muzzleAnchorY = (H * 0.85) | 0;
  let hitTintUntil = 0;
  let nowMs = 0;
  // Throttles continuous contact-damage SFX so it doesn't fire every frame.
  let nextContactHurtMs = 0;

  // hud-feedback-polish: transient feedback timers + slots. All cleared in
  // resetRun() so a second run starts without leftover flashes / pops.
  let dmgFlashUntil = 0;       // expiry for the red-edge damage flash
  let dmgFlashAt = 0;          // nowMs when the flash was triggered (fade math)
  let nextDmgFlashMs = 0;      // throttle so contact damage doesn't restart it every frame
  // Single-slot damage-direction arrow. worldAngle is captured at trigger time;
  // the screen-relative angle is re-derived each frame from current player.dir*.
  let dmgArrow = null;         // { worldAngle, atMs, untilMs } | null
  // FIFO of active kill pops, capped at KILL_POP_MAX to bound work per frame.
  const killPops = [];         // [{ x, y, atMs, untilMs }, ...]
  const KILL_POP_MAX = 16;
  // pickups-health-ammo: FIFO of active pickup pops, capped at PICKUP_POP_MAX.
  const pickupPops = [];       // [{ x, y, text, color, atMs, untilMs }, ...]
  // level-exit-progression: "LEVEL N" banner timing. Both fields are in nowMs.
  let levelBannerAtMs = 0;
  let levelBannerUntilMs = 0;

  // gun-viewmodel: bob accumulator + smoothed bob intensity. bobPhase advances
  // while moving and eases toward the nearest multiple of π when idle so the
  // gun glides to rest. bobIntensity is a low-pass on (mvLen / moveSpeed) so
  // motion ramp-up / ramp-down is gentle (~150 ms time constant).
  let bobPhase = 0;
  let bobIntensity = 0;
  // Kick state machine. kind ∈ { 'shot', 'dry' }; states: idle/kicking/recovering.
  let kickState = 'idle';
  let kickStart = 0;
  let kickKind = 'shot';
  // gun-feel-polish: equip slide-in counter. Ticked in drawGunViewmodel (the
  // only consumer). Starts at 0 (no slide on initial page load — preserves
  // byte-identical first frame). Set to EQUIP_FRAMES at the four user-facing
  // transitions (KeyR / touch RESET / regenerateDungeon / advanceLevel).
  let equipFramesLeft = 0;
  // gun-feel-polish: multiplier on player.planeX/Y at the four ray-emitting
  // reader sites. 1.0 = idle, briefly > 1.0 after a 'shot' kick. Decays
  // exponentially each frame back toward 1.0. Initial 1.0 keeps first-frame
  // raycasting byte-identical to today.
  let fovPunch = 1.0;

  // ---------------------------------------------------------------------------
  // Audio: lazily-created Web Audio context with a single master gain. Browsers
  // reject AudioContext creation before a user gesture, so ensureAudio() runs
  // from the keydown/mousedown handlers and is a silent no-op before then.
  // Each blip is one fresh OscillatorNode + GainNode that disconnects on end.
  // ---------------------------------------------------------------------------
  const MASTER_VOL = 0.4;
  let audioCtx = null;
  let masterGain = null;
  let muted = false;

  function ensureAudio() {
    if (audioCtx) return;
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    try {
      audioCtx = new Ctor();
    } catch (_) {
      audioCtx = null;
      return;
    }
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : MASTER_VOL;
    masterGain.connect(audioCtx.destination);
  }

  function blip(opts) {
    if (!audioCtx) return;
    const type = opts.type || 'square';
    const freq = opts.freq != null ? opts.freq : 440;
    const dur = opts.dur != null ? opts.dur : 0.08;
    const attack = opts.attack != null ? opts.attack : 0.005;
    const decay = opts.decay != null ? opts.decay : Math.max(0.005, dur - attack);
    const peak = opts.peak != null ? opts.peak : 1;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const env = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (opts.endFreq != null) {
      osc.frequency.linearRampToValueAtTime(opts.endFreq, t + dur);
    }
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(peak, t + attack);
    env.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    osc.connect(env);
    env.connect(masterGain);
    osc.start(t);
    osc.stop(t + dur + 0.02);
    osc.onended = () => {
      try { osc.disconnect(); env.disconnect(); } catch (_) { /* already gone */ }
    };
  }

  function sfxShot()    { blip({ type: 'square',   freq: 220, dur: 0.07, attack: 0.002, decay: 0.06,  peak: 0.7 }); }
  function sfxHit()     { blip({ type: 'square',   freq: 900, dur: 0.06, attack: 0.002, decay: 0.05,  peak: 0.55 }); }
  function sfxKill()    { blip({ type: 'sine',     freq: 400, endFreq: 100, dur: 0.18, attack: 0.005, decay: 0.17, peak: 0.6 }); }
  function sfxHurt()    { blip({ type: 'square',   freq: 120, dur: 0.15, attack: 0.005, decay: 0.14,  peak: 0.55 }); }
  function sfxDryFire() { blip({ type: 'triangle', freq: 80,  dur: 0.04, attack: 0.001, decay: 0.035, peak: 0.45 }); }
  function sfxPickupHealth() { blip({ type: 'sine',     freq: 660, endFreq: 880, dur: 0.18, attack: 0.005, decay: 0.17, peak: 0.5 }); }
  function sfxPickupAmmo()   { blip({ type: 'square',   freq: 500, endFreq: 700, dur: 0.10, attack: 0.002, decay: 0.09, peak: 0.4 }); }
  // shotgun-weapon-pickup: distinct low "ka-chunk" cue for grabbing the
  // shotgun. ≤ 200 ms, same blip() style; silenced by mute like every cue.
  function sfxPickupShotgun(){ blip({ type: 'square',   freq: 300, endFreq: 520, dur: 0.16, attack: 0.004, decay: 0.15, peak: 0.5 }); }

  // enemy-attack-feel-polish: per-type enemy SFX with linear distance rolloff.
  // Caller passes `vol = distanceVolume(srcX, srcY)`; vol === 0 ⇒ early return,
  // so far-away enemies schedule no Web Audio nodes at all.
  function distanceVolume(srcX, srcY) {
    const dx = srcX - player.x, dy = srcY - player.y;
    const d = Math.hypot(dx, dy);
    if (d >= MAX_AUDIBLE_DIST) return 0;
    return 1 - d / MAX_AUDIBLE_DIST;
  }
  function sfxImpFire(vol) {
    if (vol <= 0) return;
    blip({ type: 'square',   freq: 580, dur: 0.05, attack: 0.001, decay: 0.045, peak: 0.55 * vol });
  }
  function sfxGruntFire(vol) {
    if (vol <= 0) return;
    blip({ type: 'sawtooth', freq: 240, endFreq: 90,  dur: 0.12, attack: 0.003, decay: 0.115, peak: 0.65 * vol });
  }
  function sfxImpWindup(vol) {
    if (vol <= 0) return;
    blip({ type: 'sine',     freq: 700, endFreq: 900, dur: 0.10, attack: 0.005, decay: 0.090, peak: 0.40 * vol });
  }
  function sfxGruntWindup(vol) {
    if (vol <= 0) return;
    blip({ type: 'sawtooth', freq: 110, endFreq: 80,  dur: 0.18, attack: 0.005, decay: 0.170, peak: 0.45 * vol });
  }
  // level-exit-progression: short upward sine sweep when stepping onto the exit
  // cell. Player-action SFX, full volume (no distance rolloff).
  function sfxLevelExit() {
    blip({ type: 'sine', freq: 220, endFreq: 880, dur: 0.28, attack: 0.005, decay: 0.27, peak: 0.55 });
  }

  const keys = Object.create(null);
  let mouseDx = 0;
  let pointerLocked = false;

  const blockedKeys = new Set([
    'KeyW', 'KeyA', 'KeyS', 'KeyD',
    'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
    'Space', 'KeyN', 'AltLeft', 'AltRight'
  ]);

  // mobile-touch-controls: touch input layer. Detection is one-shot at
  // startup so a desktop user with no touch input never sees the HUD even
  // if a hover event fires on the canvas.
  const isTouchDevice =
    ('ontouchstart' in window) ||
    (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);
  const JOY_DEADZONE = 0.15;
  const JOY_RADIUS_CSS = 55;
  const BTN_W = 24, BTN_H = 24;
  const BTN_R = 4; // mobile-touch-polish: rounded-rect corner radius
  // mobile-mc-feel: util row sits below the minimap (MM_Y + MM_SIZE = 104)
  // so taps don't overlap the minimap rect. Both utilButtonAt and
  // drawTouchHUD read these.
  const UTIL_ROW_Y = 110;
  const UTIL_XS = [4, 32, 60];
  // mobile-mc-feel: sticky-slowdown aim assist. Touch only; sweeping the
  // crosshair near a visible alive enemy multiplies mouseDx by a factor in
  // [AIM_ASSIST_MIN_SCALE, 1]. No crosshair pull, no snap.
  const AIM_ASSIST_ANGLE_RAD = 0.18;
  const AIM_ASSIST_MIN_SCALE = 0.45;
  const AIM_ASSIST_MAX_DIST = 8;
  // mobile-touch-overlay: tap-vs-drag thresholds for the canvas tap-or-look
  // touch. Distance is in framebuffer-px (matches touchToFramebuffer output).
  const TAP_MAX_MS = 250;
  const TAP_MAX_DIST_FB = 4;
  // mobile-touch-overlay: ~3× base touch look sensitivity. Multiplicative on
  // touchLookScale so per-device auto-tune still applies.
  const TOUCH_LOOK_MULT = 3;
  const joyVec = { active: false, x: 0, y: 0 };
  let joyTouchId = -1;
  const tapTouch = { id: -1, startMs: 0, startX: 0, startY: 0, lastX: 0, lastY: 0, totalDist: 0 };
  const joyEl    = document.getElementById('touch-joy');
  const joyThumb = document.getElementById('touch-joy-thumb');
  const touches = new Map(); // id -> role: 'tap'|'util:<label>'
  // mobile-touch-polish: per-button press timestamps for visual feedback.
  // 0 = not pressed; nowMs at touchstart, cleared on touchend / touchcancel.
  const utilPressed = { N: 0, L: 0, M: 0, RESET: 0 };
  // mobile-touch-polish: flips true on first touch to dismiss the
  // tap-to-begin overlay. Stays true across resetRun().
  let audioStarted = false;
  // mobile-touch-polish: per-session look-sensitivity multiplier set once
  // on the first RAF after canvas sizing has stabilised. Stays 1 on desktop.
  let touchLookScale = 1;
  // mobile-mc-feel: HUD font tier. 'medium' = 14/22, 'narrow' = 16/26.
  // Set once on the first RAF after canvas sizing stabilises (parallel to
  // touchLookScale); stays 'medium' on desktop.
  let touchHudTier = 'medium';
  // shotgun-weapon-pickup: framebuffer-space bounding box of the HUD weapon
  // name, refreshed every drawHUD(). Read by the touch hit-test so tapping
  // the label cycles the weapon (same edge-tap precedence as utilButtonAt).
  // null until the first drawHUD() so a pre-HUD tap is a safe miss.
  let weaponHudRect = null;

  window.addEventListener('keydown', (e) => {
    ensureAudio();
    const wasDown = !!keys[e.code];
    keys[e.code] = true;
    if (blockedKeys.has(e.code)) e.preventDefault();
    if (wasDown) return; // ignore auto-repeat for edge-triggered actions
    if (e.code === 'Space') {
      fireShot();
    } else if (e.code === 'KeyR' && player.hp <= 0) {
      resetRun();
      equipFramesLeft = EQUIP_FRAMES;
    } else if (e.code === 'KeyN') {
      regenerateDungeon();
    } else if (e.code === 'KeyM') {
      // Mute toggle works even during the death freeze.
      muted = !muted;
      if (audioCtx && masterGain) {
        masterGain.gain.value = muted ? 0 : MASTER_VOL;
      }
    } else if (e.code === 'KeyL') {
      // atmosphere-lighting: visual debug toggle. Surfaces a small text
      // indicator for ~2 s; otherwise no HUD presence.
      lightingEnabled = !lightingEnabled;
      lightingToggledAtMs = nowMs;
    } else if (e.code === 'KeyT') {
      // theme-runtime-selector: cycle natural → crypt → … → sanctum → natural.
      // Purely cosmetic, so it is NOT gated on player.hp (works while dead).
      forcedThemeIdx = (forcedThemeIdx + 2) % (THEMES.length + 1) - 1;
      themeToggledAtMs = nowMs;
    } else if (e.code === 'Digit1') {
      // shotgun-weapon-pickup: weapon select. Edge-triggered (the wasDown
      // guard above drops auto-repeat) and inert during the death freeze,
      // like the other gameplay keys. Digit2 is a no-op until the shotgun is
      // owned; KeyQ cycles owned weapons (pistol-only ⇒ no-op).
      if (player.hp > 0) setWeapon('pistol');
    } else if (e.code === 'Digit2') {
      if (player.hp > 0) setWeapon('shotgun');
    } else if (e.code === 'KeyQ') {
      if (player.hp > 0) cycleWeapon();
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });
  window.addEventListener('blur', () => {
    for (const k in keys) keys[k] = false;
    mouseDx = 0;
  });

  canvas.addEventListener('click', () => {
    if (!isTouchDevice && !pointerLocked) {
      const p = canvas.requestPointerLock();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }
  });
  // Once pointer-locked, left-click fires; pre-lock click is for lock-grab.
  canvas.addEventListener('mousedown', (e) => {
    ensureAudio();
    if (e.button !== 0) return;
    if (!pointerLocked) return;
    e.preventDefault();
    fireShot();
  });
  document.addEventListener('pointerlockchange', () => {
    pointerLocked = (document.pointerLockElement === canvas);
    if (!pointerLocked) mouseDx = 0;
  });
  document.addEventListener('pointerlockerror', () => {
    pointerLocked = false;
  });
  document.addEventListener('mousemove', (e) => {
    if (pointerLocked) mouseDx += e.movementX || 0;
  });

  // mobile-touch-controls: convert a Touch's clientX/Y (CSS pixels relative
  // to the viewport) into framebuffer coordinates so hit-testing and
  // joystick math stay locked to the rendered HUD pixels regardless of
  // letterboxing or screen size.
  function touchToFramebuffer(t) {
    const r = canvas.getBoundingClientRect();
    return {
      x: ((t.clientX - r.left) / r.width)  * W,
      y: ((t.clientY - r.top)  / r.height) * H,
    };
  }
  function pointInRect(px, py, x, y, w, h) {
    return px >= x && px < x + w && py >= y && py < y + h;
  }
  function pointInResetBtn(px, py) {
    return pointInRect(px, py, (W / 2) - 40, (H / 2) + 32, 80, 24);
  }
  // Returns a util-row hit identifier or null. When alive we expose three
  // BTN_W x BTN_H buttons at UTIL_ROW_Y (N/L/M); when dead they swap to a
  // single RESET.
  function utilButtonAt(px, py) {
    if (player.hp <= 0) {
      if (pointInResetBtn(px, py)) return 'reset';
      return null;
    }
    if (pointInRect(px, py, UTIL_XS[0], UTIL_ROW_Y, BTN_W, BTN_H)) return 'N';
    if (pointInRect(px, py, UTIL_XS[1], UTIL_ROW_Y, BTN_W, BTN_H)) return 'L';
    if (pointInRect(px, py, UTIL_XS[2], UTIL_ROW_Y, BTN_W, BTN_H)) return 'M';
    return null;
  }
  // shotgun-weapon-pickup: true if (px,py) is over the HUD weapon-name label
  // (with a small fat-finger pad). Inert during the death freeze, matching
  // the keyboard switch. weaponHudRect is refreshed by drawHUD(); null until
  // the first HUD frame ⇒ a safe miss.
  function weaponLabelHit(px, py) {
    if (player.hp <= 0 || !weaponHudRect) return false;
    const PAD = 6;
    return pointInRect(px, py,
      weaponHudRect.x - PAD, weaponHudRect.y - PAD,
      weaponHudRect.w + PAD * 2, weaponHudRect.h + PAD * 2);
  }

  function onTouchStart(e) {
    ensureAudio();
    // mobile-touch-polish: set immediately after ensureAudio() so even if
    // the rest of the handler errors out, the tap-to-begin overlay
    // dismisses on the next frame.
    audioStarted = true;
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (touches.size >= 2) break; // 3rd simultaneous canvas touch ignored
      const fb = touchToFramebuffer(t);
      // Util buttons take priority — edge-triggered tap.
      const util = utilButtonAt(fb.x, fb.y);
      if (util) {
        const label = (util === 'reset') ? 'RESET' : util;
        utilPressed[label] = nowMs;
        touches.set(t.identifier, 'util:' + label);
        if (util === 'reset') {
          resetRun();
          equipFramesLeft = EQUIP_FRAMES;
        } else if (util === 'N') {
          regenerateDungeon();
        } else if (util === 'L') {
          lightingEnabled = !lightingEnabled;
          lightingToggledAtMs = nowMs;
        } else if (util === 'M') {
          muted = !muted;
          if (audioCtx && masterGain) {
            masterGain.gain.value = muted ? 0 : MASTER_VOL;
          }
        }
        continue;
      }
      // shotgun-weapon-pickup: weapon-label tap. Same edge-tap precedence as
      // the util buttons (checked before the tap-or-look slot and consumed),
      // so a tap there cycles the weapon and never also fires. With only the
      // pistol owned cycleWeapon() is a visible no-op; the tap is still
      // consumed (it must not fall through and fire).
      if (weaponLabelHit(fb.x, fb.y)) {
        cycleWeapon();
        touches.set(t.identifier, 'weapon');
        continue;
      }
      // Tap-or-look slot — single concurrent canvas touch. Becomes a tap on
      // lift if it stayed within TAP_MAX_DIST_FB / TAP_MAX_MS, otherwise a
      // look-drag accumulates into mouseDx and lift fires nothing.
      if (tapTouch.id === -1) {
        tapTouch.id = t.identifier;
        tapTouch.startMs = nowMs;
        tapTouch.startX = fb.x;
        tapTouch.startY = fb.y;
        tapTouch.lastX = fb.x;
        tapTouch.lastY = fb.y;
        tapTouch.totalDist = 0;
        touches.set(t.identifier, 'tap');
      }
    }
  }

  function onTouchMove(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      const role = touches.get(t.identifier);
      if (!role) continue;
      const fb = touchToFramebuffer(t);
      if (role === 'tap' && tapTouch.id === t.identifier) {
        const dx = fb.x - tapTouch.lastX;
        const dy = fb.y - tapTouch.lastY;
        tapTouch.totalDist += Math.hypot(dx, dy);
        // Feed the framebuffer-px delta into the same mouseDx accumulator
        // the desktop path uses; update() applies mouseSens once and
        // rotates the camera. The touchLookScale multiplier (set once at
        // startup, see RAF defer below) compensates for canvas widths that
        // are very different from W = 480 fb-px. TOUCH_LOOK_MULT bumps base
        // sensitivity ~3× for a Minecraft-Bedrock-like sweep.
        mouseDx += dx * touchLookScale * TOUCH_LOOK_MULT;
        tapTouch.lastX = fb.x;
        tapTouch.lastY = fb.y;
      }
      // 'util' touches don't track movement.
    }
  }

  function onTouchEnd(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      const role = touches.get(t.identifier);
      if (!role) continue;
      touches.delete(t.identifier);
      if (role === 'tap' && tapTouch.id === t.identifier) {
        const elapsed = nowMs - tapTouch.startMs;
        if (tapTouch.totalDist <= TAP_MAX_DIST_FB && elapsed <= TAP_MAX_MS) {
          fireShot();
        }
        tapTouch.id = -1;
      } else if (role.startsWith('util:')) {
        const label = role.slice(5);
        utilPressed[label] = 0;
      }
    }
  }

  if (isTouchDevice) {
    canvas.addEventListener('touchstart',  onTouchStart, { passive: false });
    canvas.addEventListener('touchmove',   onTouchMove,  { passive: false });
    canvas.addEventListener('touchend',    onTouchEnd,   { passive: false });
    canvas.addEventListener('touchcancel', onTouchEnd,   { passive: false });
  }

  // mobile-touch-overlay: DOM joystick handlers. The joystick is a fixed
  // bottom-left overlay (#touch-joy) layered above the canvas; its base is
  // hidden on desktop via the (pointer: coarse) media query. Listeners are
  // element-scoped, so a finger that drags off the base still drives the
  // joystick (W3C touch implicit pointer capture).
  function joyAnchorCss() {
    const r = joyEl.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function onJoyStart(e) {
    ensureAudio();
    audioStarted = true;
    e.preventDefault();
    if (joyTouchId !== -1) return;
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    joyVec.active = true;
    joyVec.x = 0;
    joyVec.y = 0;
    joyThumb.style.transform = 'translate(0px, 0px)';
  }

  function onJoyMove(e) {
    e.preventDefault();
    if (joyTouchId === -1) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier !== joyTouchId) continue;
      const a = joyAnchorCss();
      const dx = t.clientX - a.x;
      const dy = t.clientY - a.y;
      const len = Math.hypot(dx, dy);
      const clamped = Math.min(1, len / JOY_RADIUS_CSS);
      const nx = (len > 0) ? (dx / len) * clamped : 0;
      const ny = (len > 0) ? (dy / len) * clamped : 0;
      joyVec.x = (clamped < JOY_DEADZONE) ? 0 : nx;
      joyVec.y = (clamped < JOY_DEADZONE) ? 0 : ny;
      const tx = nx * JOY_RADIUS_CSS;
      const ty = ny * JOY_RADIUS_CSS;
      joyThumb.style.transform = 'translate(' + tx.toFixed(1) + 'px, ' + ty.toFixed(1) + 'px)';
      break;
    }
  }

  function onJoyEnd(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier !== joyTouchId) continue;
      joyTouchId = -1;
      joyVec.active = false;
      joyVec.x = 0;
      joyVec.y = 0;
      joyThumb.style.transform = 'translate(0px, 0px)';
      break;
    }
  }

  if (isTouchDevice) {
    joyEl.addEventListener('touchstart',  onJoyStart, { passive: false });
    joyEl.addEventListener('touchmove',   onJoyMove,  { passive: false });
    joyEl.addEventListener('touchend',    onJoyEnd,   { passive: false });
    joyEl.addEventListener('touchcancel', onJoyEnd,   { passive: false });
  }

  function isWall(mx, my) {
    if (mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H) return true;
    return MAP[my][mx] !== 0;
  }

  // Axis-resolved collision: treat the player as a small AABB of half-size r.
  function moveAxisX(delta) {
    if (delta === 0) return;
    const r = 0.2;
    const nx = player.x + delta;
    const probe = nx + (delta > 0 ? r : -r);
    const cellX = Math.floor(probe);
    const cellY1 = Math.floor(player.y - r);
    const cellY2 = Math.floor(player.y + r);
    if (!isWall(cellX, cellY1) && !isWall(cellX, cellY2)) {
      player.x = nx;
    }
  }
  function moveAxisY(delta) {
    if (delta === 0) return;
    const r = 0.2;
    const ny = player.y + delta;
    const probe = ny + (delta > 0 ? r : -r);
    const cellY = Math.floor(probe);
    const cellX1 = Math.floor(player.x - r);
    const cellX2 = Math.floor(player.x + r);
    if (!isWall(cellX1, cellY) && !isWall(cellX2, cellY)) {
      player.y = ny;
    }
  }

  // mobile-mc-feel: sticky-slowdown aim assist. Returns a multiplier in
  // [AIM_ASSIST_MIN_SCALE, 1] applied to mouseDx on touch devices when the
  // crosshair is angularly close to a visible alive enemy. Returns 1 when
  // no enemy qualifies (or on desktop) so the rotation accumulator is
  // untouched. Smallest qualifying scale wins, so overlapping enemies
  // don't compound the slowdown.
  function aimAssistScale() {
    if (!isTouchDevice || player.hp <= 0) return 1;
    let best = 1;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const lx = e.x - player.x;
      const ly = e.y - player.y;
      const tProj = lx * player.dirX + ly * player.dirY;
      if (tProj <= 0 || tProj > AIM_ASSIST_MAX_DIST) continue;
      const perpSign = lx * player.planeX + ly * player.planeY;
      const yawOffset = Math.atan2(perpSign, tProj);
      const absYaw = yawOffset < 0 ? -yawOffset : yawOffset;
      if (absYaw > AIM_ASSIST_ANGLE_RAD) continue;
      if (!enemyCanSeePlayer(e)) continue;
      const t = absYaw / AIM_ASSIST_ANGLE_RAD;
      const s = AIM_ASSIST_MIN_SCALE + (1 - AIM_ASSIST_MIN_SCALE) * t;
      if (s < best) best = s;
    }
    return best;
  }

  function update(dt) {
    if (player.hp <= 0) {
      // Frozen death state. Drain queued input so it cannot leak post-reset.
      mouseDx = 0;
      // mobile-touch-overlay: defensively zero the joystick so a finger that
      // was on it at death doesn't leak movement on respawn. The DOM element
      // is hidden below in the alive-gate; touch events for that finger
      // continue to fire (implicit pointer capture) but are no-ops here.
      joyVec.active = false;
      joyVec.x = 0;
      joyVec.y = 0;
      if (isTouchDevice && joyEl.style.display !== 'none') {
        joyEl.style.display = 'none';
      }
      // gun-viewmodel: keep the kick state machine ticking so any in-flight
      // recovery completes off-screen, and let the bob intensity decay so the
      // gun is at rest when the player respawns. The blit itself is gated on
      // hp > 0 inside drawGunViewmodel().
      tickKick(performance.now());
      bobIntensity += (0 - bobIntensity) * Math.min(1, 8 * dt);
      // gun-feel-polish: continue to decay FOV punch through death so the
      // world settles back to its idle FOV by the time the player presses R;
      // otherwise the death frame freezes mid-zoom if the killing shot fired
      // the same frame.
      fovPunch += (1.0 - fovPunch) * Math.min(1, FOV_PUNCH_DECAY * dt);
      return;
    }
    if (isTouchDevice && joyEl.style.display !== 'block') {
      joyEl.style.display = 'block';
    }
    const moveSpeed = 3.2;     // cells / second
    const rotSpeed  = 2.4;     // radians / second (keyboard)
    const mouseSens = 0.0022;  // radians per pixel of mouse movement

    // Doom-style strafe modifier: hold either Alt to make the arrows
    // strafe (mirroring A/D) instead of turning the camera.
    const altStrafe = keys['AltLeft'] || keys['AltRight'];

    let rot = 0;
    if (keys['ArrowLeft']  && !altStrafe) rot -= rotSpeed * dt;
    if (keys['ArrowRight'] && !altStrafe) rot += rotSpeed * dt;
    if ((pointerLocked || isTouchDevice) && mouseDx !== 0) {
      if (isTouchDevice) mouseDx *= aimAssistScale();
      rot += mouseDx * mouseSens;
    }
    mouseDx = 0;

    if (rot !== 0) {
      const cs = Math.cos(rot), sn = Math.sin(rot);
      const odx = player.dirX, ody = player.dirY;
      player.dirX = odx * cs - ody * sn;
      player.dirY = odx * sn + ody * cs;
      const opx = player.planeX, opy = player.planeY;
      player.planeX = opx * cs - opy * sn;
      player.planeY = opx * sn + opy * cs;
    }

    let mvX = 0, mvY = 0;
    if (keys['KeyW'] || keys['ArrowUp'])   { mvX += player.dirX;   mvY += player.dirY; }
    if (keys['KeyS'] || keys['ArrowDown']) { mvX -= player.dirX;   mvY -= player.dirY; }
    if (keys['KeyA'] || (altStrafe && keys['ArrowLeft']))  { mvX -= player.planeX; mvY -= player.planeY; }
    if (keys['KeyD'] || (altStrafe && keys['ArrowRight'])) { mvX += player.planeX; mvY += player.planeY; }
    // mobile-touch-controls: joystick output composes into the same move
    // vector as keyboard. jy < 0 (finger above anchor) = forward; jx > 0
    // = strafe right. The normalize below caps magnitude so a hybrid
    // touch-laptop user pressing W and pushing the joystick still moves
    // at exactly moveSpeed.
    if (isTouchDevice && joyVec.active) {
      mvX += player.dirX * (-joyVec.y) + player.planeX * joyVec.x;
      mvY += player.dirY * (-joyVec.y) + player.planeY * joyVec.x;
    }

    const mvLen = Math.hypot(mvX, mvY);
    if (mvLen > 0) {
      const s = (moveSpeed * dt) / mvLen;
      moveAxisX(mvX * s);
      moveAxisY(mvY * s);
    }

    // gun-viewmodel: bob + kick tick. bobIntensity is a low-pass on
    // (mvLen / moveSpeed) for a ~150 ms ramp; bobPhase advances while moving
    // and eases toward the nearest multiple of π when idle so the gun glides
    // to rest instead of snapping. tickKick advances the kick state machine.
    const targetBob = mvLen / moveSpeed;
    bobIntensity += (targetBob - bobIntensity) * Math.min(1, 8 * dt);
    if (mvLen > 0) {
      bobPhase += BOB_SPEED * dt * (mvLen / moveSpeed);
    } else {
      const restTarget = Math.round(bobPhase / Math.PI) * Math.PI;
      bobPhase += (restTarget - bobPhase) * Math.min(1, 8 * dt);
    }
    tickKick(performance.now());
    // gun-feel-polish: decay FOV punch toward 1.0 each frame. Exponential
    // decay with FOV_PUNCH_DECAY=12 reaches ~74% recovered in 110 ms — in
    // sync with the gun's own ~140 ms kick recovery.
    fovPunch += (1.0 - fovPunch) * Math.min(1, FOV_PUNCH_DECAY * dt);

    aiTick(dt);
    tickProjectiles(dt);
    applyContactDamage(dt);
    applyPickups();

    // level-exit-progression: stepping onto the exit cell auto-advances to a
    // fresh dungeon. The hp>0 guard is defensive — update() already early-
    // returns on death, but this documents intent and survives reorderings.
    if (player.hp > 0 &&
        Math.floor(player.x) === EXIT.cellX &&
        Math.floor(player.y) === EXIT.cellY) {
      advanceLevel();
    }
  }

  // Cast a single column with DDA. Returns hit info; does NOT draw.
  function castColumn(x) {
    const cameraX = (2 * x) / W - 1;
    const rayDirX = player.dirX + player.planeX * fovPunch * cameraX;
    const rayDirY = player.dirY + player.planeY * fovPunch * cameraX;

    let mapX = Math.floor(player.x);
    let mapY = Math.floor(player.y);

    const deltaDistX = rayDirX === 0 ? Infinity : Math.abs(1 / rayDirX);
    const deltaDistY = rayDirY === 0 ? Infinity : Math.abs(1 / rayDirY);

    let stepX, stepY, sideDistX, sideDistY;
    if (rayDirX < 0) { stepX = -1; sideDistX = (player.x - mapX) * deltaDistX; }
    else             { stepX =  1; sideDistX = (mapX + 1.0 - player.x) * deltaDistX; }
    if (rayDirY < 0) { stepY = -1; sideDistY = (player.y - mapY) * deltaDistY; }
    else             { stepY =  1; sideDistY = (mapY + 1.0 - player.y) * deltaDistY; }

    let side = 0;
    let wallType = 1;
    // Safety bound: any column resolves in <= MAP_W + MAP_H steps.
    let safety = MAP_W + MAP_H + 4;
    while (safety-- > 0) {
      if (sideDistX < sideDistY) {
        sideDistX += deltaDistX;
        mapX += stepX;
        side = 0;
      } else {
        sideDistY += deltaDistY;
        mapY += stepY;
        side = 1;
      }
      if (mapX < 0 || mapY < 0 || mapX >= MAP_W || mapY >= MAP_H) {
        wallType = 1;
        break;
      }
      const m = MAP[mapY][mapX];
      if (m > 0) { wallType = m; break; }
    }

    let perpWallDist;
    if (side === 0) perpWallDist = (mapX - player.x + (1 - stepX) * 0.5) / rayDirX;
    else            perpWallDist = (mapY - player.y + (1 - stepY) * 0.5) / rayDirY;
    if (!(perpWallDist > 0.0001)) perpWallDist = 0.0001;

    return { perpWallDist, side, wallType, rayDirX, rayDirY };
  }

  // Pack RGBA into a little-endian Uint32 (R = LSB).
  function rgba32(r, g, b) {
    return (255 << 24) | ((b & 0xff) << 16) | ((g & 0xff) << 8) | (r & 0xff);
  }

  // Linear interpolation between two [r,g,b] triples → packed rgba32.
  // The only color-blending primitive used by the texture generators below;
  // every output pixel is a lerp of palette anchors via mix or mix3.
  function mix(a, b, t) {
    const tt = t < 0 ? 0 : (t > 1 ? 1 : t);
    const r = (a[0] + (b[0] - a[0]) * tt) | 0;
    const g = (a[1] + (b[1] - a[1]) * tt) | 0;
    const bb = (a[2] + (b[2] - a[2]) * tt) | 0;
    return rgba32(r, g, bb);
  }

  // Three-stop lerp across a→b→c, t ∈ [0,1] → t<0.5 mixes a→b, t≥0.5 mixes b→c.
  // Drives shadow→base→highlight ramps for value-noise textures in one call.
  function mix3(a, b, c, t) {
    return (t < 0.5) ? mix(a, b, t * 2) : mix(b, c, (t - 0.5) * 2);
  }

  const HALF_H = (H / 2) | 0;

  // ---------------------------------------------------------------------------
  // Procedural textures — generated once at startup, sampled per pixel by the
  // raycaster. Each texture is a 64x64 Uint32Array of packed RGBA. Generators
  // are pure (deterministic via the seeded LCG below) so renders are byte-
  // identical run to run; Math.random is intentionally avoided here.
  // ---------------------------------------------------------------------------
  const TEX_SIZE = 64;
  const TEX_MASK = TEX_SIZE - 1;

  function lcg(seed) {
    let s = seed >>> 0;
    return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
  }

  // Bilinear-upsample an N×N value-noise grid into TEX_SIZE×TEX_SIZE, summing
  // into target with the given strength. Wraps both axes so the output is
  // seamless.
  function addOctave(target, scale, strength, rand) {
    const grid = new Float32Array(scale * scale);
    for (let i = 0; i < grid.length; i++) grid[i] = rand();
    const M = scale - 1;
    for (let y = 0; y < TEX_SIZE; y++) {
      const fy = (y * scale) / TEX_SIZE;
      const y0 = (fy | 0) & M;
      const y1 = (y0 + 1) & M;
      const fyt = fy - (fy | 0);
      for (let x = 0; x < TEX_SIZE; x++) {
        const fx = (x * scale) / TEX_SIZE;
        const x0 = (fx | 0) & M;
        const x1 = (x0 + 1) & M;
        const fxt = fx - (fx | 0);
        const a = grid[y0 * scale + x0];
        const b = grid[y0 * scale + x1];
        const c = grid[y1 * scale + x0];
        const d = grid[y1 * scale + x1];
        const top = a + (b - a) * fxt;
        const bot = c + (d - c) * fxt;
        target[y * TEX_SIZE + x] += (top + (bot - top) * fyt) * strength;
      }
    }
  }

  // Stable per-pixel splitmix32-style hash, keyed on a per-generator constant.
  // Returns the raw uint32 so callers can take small modulos for sparse
  // overlays (ember sparks, moss speckle, dirt grit) without consuming PRNG
  // state and without banding artifacts.
  function hashU32(x, y, seed) {
    let h = (Math.imul(x, 0x1f1f1f1f) ^ Math.imul(y, 0x9e3779b1) ^ seed) >>> 0;
    h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    return (h ^ (h >>> 16)) >>> 0;
  }

  // ---------------------------------------------------------------------------
  // Theme generators. Each takes a single `pal` argument (one of
  // THEME_PALETTES[i]) and returns a 64×64 Uint32Array of packed RGBA. Every
  // output pixel is a mix() / mix3() of palette anchors — no hardcoded RGB
  // literals — so all five generators within a theme share hue/value DNA and
  // the room reads as one coherent place. Per-generator lcg seeds stay
  // distinct so noise fields don't accidentally overlap; per-pixel hash seeds
  // (ember / speckle / grit) likewise.
  // ---------------------------------------------------------------------------

  // crypt base — gothic warm-brick wall, mortar = pal.shadow.
  function genCryptBrick(pal) {
    const { shadow, base, highlight, accent, extra } = pal;
    const tex = new Uint32Array(TEX_SIZE * TEX_SIZE);
    const rand = lcg(0xb12c50ed);
    const BRICK_H = 8;
    const BRICK_W = 16;
    const COLS = TEX_SIZE / BRICK_W;
    const ROWS = TEX_SIZE / BRICK_H;
    const variation = new Float32Array(ROWS * COLS);
    for (let i = 0; i < variation.length; i++) variation[i] = 0.78 + rand() * 0.42;
    const MORTAR = mix(shadow, shadow, 0);
    for (let y = 0; y < TEX_SIZE; y++) {
      const brickRow = (y / BRICK_H) | 0;
      const offsetX = (brickRow & 1) ? (BRICK_W >> 1) : 0;
      const ry = y - brickRow * BRICK_H;
      for (let x = 0; x < TEX_SIZE; x++) {
        const sx = x + offsetX;
        const inBrickX = sx % BRICK_W;
        const brickCol = ((sx / BRICK_W) | 0) % COLS;
        if (ry === 0 || inBrickX === 0) {
          tex[y * TEX_SIZE + x] = MORTAR;
          continue;
        }
        const v = variation[brickRow * COLS + brickCol];
        const faceT = 0.55 + 0.35 * v;
        const fr = shadow[0] + (accent[0] - shadow[0]) * faceT;
        const fg = shadow[1] + (accent[1] - shadow[1]) * faceT;
        const fb = shadow[2] + (accent[2] - shadow[2]) * faceT;
        let pr = fr, pg = fg, pb = fb;
        if (ry === 1) {
          pr = fr + (highlight[0] - fr) * 0.20;
          pg = fg + (highlight[1] - fg) * 0.20;
          pb = fb + (highlight[2] - fb) * 0.20;
        } else if (ry === BRICK_H - 1) {
          pr = fr + (shadow[0] - fr) * 0.30;
          pg = fg + (shadow[1] - fg) * 0.30;
          pb = fb + (shadow[2] - fb) * 0.30;
        }
        tex[y * TEX_SIZE + x] = rgba32(pr | 0, pg | 0, pb | 0);
      }
    }
    return tex;
  }

  // crypt primary accent — slate stone, three-octave value noise.
  function genCryptStone(pal) {
    const { shadow, base, highlight } = pal;

          continue;
        }
        tex[i] = mix3(shadow, base, highlight, 0.30 + 0.40 * n);
      }
    }
    return tex;
  }

  // atmosphere-lighting: distance fog and a vignette post-pass. Names + numeric
  // meanings here are the spec contract — renaming them under your watch
  // breaks downstream tuning specs. Sky/ground gradients were retired when
  // the textured per-row floor/ceiling cast took over the background.
  // ---------------------------------------------------------------------------
  const FOG_C = rgba32(70, 80, 110);  // desaturated blue-grey horizon
  const FOG_NEAR = 1.5;               // cells; no fog closer than this
  const FOG_FAR = 14.0;               // cells; fully fogged at/past this
  const VIGNETTE_INNER = 0.55;        // normalized r at which darkening starts
  const VIGNETTE_OUTER = 1.05;        // normalized r at which it saturates
  const VIGNETTE_DARKEN = 0.55;       // 1.0 = no effect, 0.0 = pure black

  // Precomputed per-pixel vignette multiplier in fixed-point /256. 256 = no
  // darkening; lower = darker. Bake once at startup; the per-frame pass is a
  // single multiply per channel per pixel against this table.
  const VIGNETTE = new Uint16Array(W * H);
  {
    const halfW = W * 0.5, halfH = H * 0.5;
    const denom = VIGNETTE_OUTER - VIGNETTE_INNER;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const dx = (x - halfW) / halfW;
        const dy = (y - halfH) / halfH;
        const r = Math.sqrt(dx * dx + dy * dy);
        let t = (r - VIGNETTE_INNER) / denom;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        const ts = t * t * (3 - 2 * t); // smoothstep
        const m = 1 + (VIGNETTE_DARKEN - 1) * ts;
        VIGNETTE[y * W + x] = (m * 256) | 0;
      }
    }
  }

  function buildFrame(rows, palette) {
    const out = new Uint32Array(SPRITE_SIZE * SPRITE_SIZE);

      const row = rows[y];

        const v = palette[c];
        if (v) out[y * SPRITE_SIZE + x] = v;

  // ---------------------------------------------------------------------------
  // Per-type stats. meleeRadius is consumed by the contact-damage check.
  const TYPE_TABLE = {
    imp:   { moveSpeed: 1.8, hp: 3, rangedDamage: 5,  meleeRadius: 0.6, windupMs: 350, cooldownMs: 700 },
    grunt: { moveSpeed: 1.0, hp: 5, rangedDamage: 10, meleeRadius: 0.6, windupMs: 900, cooldownMs: 1600 },
  };
  function makeEnemy(x, y, type) {
    const t = TYPE_TABLE[type];
    return {
      x, y, type,
      hp: t.hp,
      moveSpeed: t.moveSpeed,
      rangedDamage: t.rangedDamage,
      alive: true,
      animPhase: Math.random() * 1000, // de-sync animation between enemies
      dirX: 0, dirY: -1,
      hitFlashUntil: 0,
      fireFlashUntil: 0,
      mode: 'idle',
      modeUntil: 0,
      damage(amount) {
        if (!this.alive) return;
        this.hp -= amount;
        if (this.hp <= 0) this.alive = false;
      },
    };
  }

  // identical 2-copies and animPhase stays 0.
  function makePickup(x, y, type) {

      x, y, type,
      alive: true,

      mode: 'idle',
      modeUntil: 0,
    };
  }

  // entities (rebuilt by resetRun + advanceLevel).
  let pickupSpawns = [];
  let pickups = [];
  // enemy-projectile-attacks: in-flight straight-line projectiles spawned by
  // enemyFireShot. Compacted in-place each tick; cleared by
  // clearTransientFeedback on R-restart, N-regen, and level transitions.
  let projectiles = [];

  // level-exit-progression: shared by resetRun() (R after death + N debug regen)
  // and advanceLevel() (exit-step transition). Flushes leftover flashes / pops /
  // arrows / banner / queued input so they don't bleed across the boundary.
  // lastFireTime is intentionally NOT reset here: advanceLevel carries cooldown
  // forward (matching the HP/ammo carry-over), and resetRun clears it inline.
  function clearTransientFeedback() {
    muzzleFlashUntil = 0;
    hitTintUntil = 0;
    nextContactHurtMs = 0;
    dmgFlashUntil = 0;
    dmgFlashAt = 0;
    nextDmgFlashMs = 0;
    dmgArrow = null;
    killPops.length = 0;
    pickupPops.length = 0;
    levelBannerAtMs = 0;
    levelBannerUntilMs = 0;
    mouseDx = 0;
    // gun-viewmodel: spec #14 — gun reappears in idle on respawn, with
    // bobPhase = 0 and kickState = 'idle'. Same applies after N-regen and
    // level transitions, which both call this helper.
    bobPhase = 0;
    bobIntensity = 0;
    kickState = 'idle';
    kickKind = 'shot';
    kickStart = 0;
    // gun-feel-polish: world FOV settles at neutral on every R-reset /
    // N-regen / level transition, even if mid-decay. First-frame fovPunch
    // is initialized to 1.0, so the IIFE init's call resets 1.0 → 1.0
    // (a no-op that does not affect first-frame determinism).
    fovPunch = 1.0;
    // enemy-projectile-attacks: in-flight projectiles do not survive R-restart,
    // N-regen, or level transitions. update()'s death early-return already
    // freezes them in place during the death state; this clears them on reset.
    projectiles.length = 0;
    for (const k in keys) keys[k] = false;
  }

  function resetRun() {
    enemies = enemySpawns.map(s => makeEnemy(s.x, s.y, s.type));
    pickups = pickupSpawns.map(s => makePickup(s.x, s.y, s.type));
    player.x = PLAYER_SPAWN.x;
    player.y = PLAYER_SPAWN.y;
    player.dirX = PLAYER_SPAWN.dirX;
    player.dirY = PLAYER_SPAWN.dirY;
    player.planeX = PLAYER_SPAWN.planeX;
    player.planeY = PLAYER_SPAWN.planeY;
    player.hp = MAX_HP;
    ammo = MAX_AMMO;
    // shotgun-weapon-pickup: a fresh run is always pistol-only; the shotgun
    // must be found again in the world. Live `pickups` were rebuilt from
    // pickupSpawns above with no special-casing, so the new dungeon's single
    // shotgun pickup is back in place.
    weapon = 'pistol';
    hasShotgun = false;
    level = 1;
    lastFireTime = -Infinity;
    clearTransientFeedback();
  }

  // ---------------------------------------------------------------------------
  // Procedural dungeon: a seeded mulberry32 PRNG drives both map carving and
  // enemy placement. ?seed=<u32> in the URL pins the layout for bug reports;
  // pressing N generates a fresh seed and rebuilds the world.
  // ---------------------------------------------------------------------------
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function parseSeedFromUrl() {
    try {
      const sp = new URL(window.location.href).searchParams.get('seed');
      if (sp == null || sp === '') return null;
      const n = Number.parseInt(sp, 10);
      if (!Number.isFinite(n) || n < 0 || n > 0xFFFFFFFF) return null;
      return n >>> 0;
    } catch (_) {
      return null;
    }
  }

  function pickRandomSeed() {
    return Math.floor(Math.random() * 0x100000000) >>> 0;
  }

  function generateDungeon(seed) {
    const rand = mulberry32(seed);
    // 48x48 grid, in the spec's required 40-60 range.
    const W = 48, H = 48;
    const TARGET_MIN = 6, TARGET_MAX = 12;
    const ROOM_MIN = 4, ROOM_MAX = 8;
    const PLACE_ATTEMPTS = 80;
    const MAX_TRIES = 60;

    for (let attempt = 0; attempt < MAX_TRIES; attempt++) {
      // Allocate as walls; type assignment happens after carving.
      const map = new Array(H);
      for (let y = 0; y < H; y++) map[y] = new Array(W).fill(1);

      // Pick non-overlapping rooms with a 1-cell buffer between rooms and from
      // the outer boundary. Up to PLACE_ATTEMPTS tries, capped at TARGET_MAX.
      const rooms = [];
      for (let i = 0; i < PLACE_ATTEMPTS && rooms.length < TARGET_MAX; i++) {
        const w = ROOM_MIN + Math.floor(rand() * (ROOM_MAX - ROOM_MIN + 1));
        const h = ROOM_MIN + Math.floor(rand() * (ROOM_MAX - ROOM_MIN + 1));
        // 1-cell outer wall buffer: x in [1, W-w-1].
        const x = 1 + Math.floor(rand() * (W - w - 1));
        const y = 1 + Math.floor(rand() * (H - h - 1));
        let overlap = false;
        for (let r = 0; r < rooms.length; r++) {
          const o = rooms[r];
          // 1-cell wall buffer between rooms: their AABBs must be separated by
          // at least one cell on at least one axis.
          if (!(x + w + 1 <= o.x || o.x + o.w + 1 <= x ||
                y + h + 1 <= o.y || o.y + o.h + 1 <= y)) {
            overlap = true;
            break;
          }
        }
        if (!overlap) rooms.push({ x, y, w, h });
      }
      if (rooms.length < TARGET_MIN) continue;

      // Carve room interiors to floor.
      for (let r = 0; r < rooms.length; r++) {
        const room = rooms[r];
        for (let y = room.y; y < room.y + room.h; y++) {
          for (let x = room.x; x < room.x + room.w; x++) {
            map[y][x] = 0;
          }
        }
      }

      // L-corridors between consecutive rooms by carve order; this guarantees
      // connectivity by construction. The BFS below is a defensive sanity check.
      for (let i = 1; i < rooms.length; i++) {
        const a = rooms[i - 1];
        const b = rooms[i];
        const ax = a.x + ((a.w / 2) | 0);
        const ay = a.y + ((a.h / 2) | 0);
        const bx = b.x + ((b.w / 2) | 0);
        const by = b.y + ((b.h / 2) | 0);
        if (rand() < 0.5) {
          // HV: horizontal at ay from ax to bx, then vertical at bx from ay to by.
          for (let x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) map[ay][x] = 0;
          for (let y = Math.min(ay, by); y <= Math.max(ay, by); y++) map[y][bx] = 0;
        } else {
          // VH: vertical at ax from ay to by, then horizontal at by from ax to bx.
          for (let y = Math.min(ay, by); y <= Math.max(ay, by); y++) map[y][ax] = 0;
          for (let x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) map[by][x] = 0;
        }
      }

      // Pick starting room and player spawn at its center, facing a random
      // cardinal direction. plane is perpendicular to dir with magnitude 0.66.
      const startIdx = Math.floor(rand() * rooms.length);
      const startRoom = rooms[startIdx];
      const psCellX = startRoom.x + ((startRoom.w / 2) | 0);
      const psCellY = startRoom.y + ((startRoom.h / 2) | 0);
      const dirOpt = Math.floor(rand() * 4);
      let dirX, dirY, planeX, planeY;
      if (dirOpt === 0)      { dirX =  1; dirY =  0; planeX =  0;    planeY =  0.66; }
      else if (dirOpt === 1) { dirX = -1; dirY =  0; planeX =  0;    planeY = -0.66; }
      else if (dirOpt === 2) { dirX =  0; dirY =  1; planeX = -0.66; planeY =  0;    }
      else                   { dirX =  0; dirY = -1; planeX =  0.66; planeY =  0;    }
      const playerSpawn = {
        x: psCellX + 0.5, y: psCellY + 0.5,
        dirX, dirY, planeX, planeY,
      };

      // 4-connected BFS from the spawn cell. Anything unreachable triggers
      // a fresh attempt with a different room layout. The dist array doubles
      // as the connectivity check (any -1 floor cell at the end => unreachable)
      // and as the metric used to pick the farthest non-start room as the exit.
      const dist = new Array(H);
      for (let y = 0; y < H; y++) dist[y] = new Array(W).fill(-1);
      dist[psCellY][psCellX] = 0;
      const queue = [[psCellX, psCellY]];
      let head = 0, visitedCount = 1, totalFloor = 0;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) if (map[y][x] === 0) totalFloor++;
      }
      const dxs = [1, -1, 0, 0], dys = [0, 0, 1, -1];
      while (head < queue.length) {
        const c = queue[head++];
        const cx = c[0], cy = c[1];
        for (let n = 0; n < 4; n++) {
          const nx = cx + dxs[n], ny = cy + dys[n];
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          if (dist[ny][nx] !== -1) continue;
          if (map[ny][nx] !== 0) continue;
          dist[ny][nx] = dist[cy][cx] + 1;
          visitedCount++;
          queue.push([nx, ny]);
        }
      }
      if (visitedCount !== totalFloor) continue;

      // Pick the farthest non-start room (by BFS walking distance to its
      // center) as the exit. Tiebreak by smaller room index for determinism.
      let bestRoom = -1, bestD = -1;
      for (let i = 0; i < rooms.length; i++) {
        if (i === startIdx) continue;
        const r = rooms[i];
        const rx = r.x + ((r.w / 2) | 0);
        const ry = r.y + ((r.h / 2) | 0);
        const d = dist[ry][rx];
        if (d > bestD) { bestD = d; bestRoom = i; }
      }
      // bestRoom can't stay -1: TARGET_MIN >= 6 rooms and the BFS above
      // confirmed full connectivity, so every non-start room is reachable.
      const er = rooms[bestRoom];
      const exitCell = {
        x: er.x + ((er.w / 2) | 0),
        y: er.y + ((er.h / 2) | 0),
      };

      // Assign a theme and a single wall material to each room. No diversity
      // guard — a level may end up single-theme or single-material if RNG lands
      // that way; that's just a thematic level. Order of rand() calls
      // (themeIdx first, then materialIdx) is part of the seed contract.
      for (let r = 0; r < rooms.length; r++) {
        rooms[r].themeIdx    = Math.floor(rand() * THEMES.length);
        rooms[r].materialIdx = Math.floor(rand() * 3);
      }

      // Multi-source BFS to label every cell with its nearest room's theme AND
      // material. Seeds the queue with all room-interior floor cells
      // simultaneously, then propagates outward into corridor floor cells and
      // finally into wall cells. Tie-break is "first seeded wins" by room
      // iteration order — so the result is deterministic given the seeded
      // theme + material assignments. Corridors inherit nearest-room material
      // the same way they inherit theme: every wall cell of one room — and
      // every wall cell of the corridor leading away from it, until BFS hits
      // another room's territory — gets that one material.
      const themeMap    = new Uint8Array(W * H);
      const materialMap = new Uint8Array(W * H);
      const tDist = new Int16Array(W * H);
      tDist.fill(-1);
      const tQueue = new Int32Array(W * H);
      let tHead = 0, tTail = 0;
      for (let r = 0; r < rooms.length; r++) {
        const room = rooms[r];
        for (let yy = room.y; yy < room.y + room.h; yy++) {
          for (let xx = room.x; xx < room.x + room.w; xx++) {
            const i = yy * W + xx;
            themeMap[i]    = room.themeIdx;
            materialMap[i] = room.materialIdx;
            tDist[i] = 0;
            tQueue[tTail++] = i;
          }
        }
      }
      while (tHead < tTail) {
        const i = tQueue[tHead++];
        const cx = i % W, cy = (i / W) | 0;
        for (let n = 0; n < 4; n++) {
          const nx = cx + dxs[n], ny = cy + dys[n];
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const ni = ny * W + nx;
          if (tDist[ni] !== -1) continue;
          tDist[ni] = tDist[i] + 1;
          themeMap[ni]    = themeMap[i];
          materialMap[ni] = materialMap[i];
          tQueue[tTail++] = ni;
        }
      }

      // Per-cell wall texture index. Encoded as themeIdx*3 + materialIdx + 1,
      // with slot 0 reserved for empty cells. Material is read from the
      // BFS-propagated materialMap (per-room, not per-cell-hashed) — every
      // wall cell inside one room writes the same map value, and corridors
      // inherit from their nearest room. materialMap is consumed here only;
      // it is not retained past generateDungeon's return.
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          if (map[y][x] !== 0) {
            map[y][x] = themeMap[y * W + x] * 3 + materialMap[y * W + x] + 1;
          }
        }
      }

      // Enemy spawns: 1-3 per non-starting room at distinct interior floor
      // cells, capped at MAX_ENEMIES total. Type chosen per-spawn from the
      // existing TYPE_TABLE (imp / grunt only).
      const newSpawns = [];
      const MAX_ENEMIES = 36;
      for (let i = 0; i < rooms.length && newSpawns.length < MAX_ENEMIES; i++) {
        if (i === startIdx) continue;
        const room = rooms[i];
        const cells = [];
        for (let y = room.y; y < room.y + room.h; y++) {
          for (let x = room.x; x < room.x + room.w; x++) {
            if (map[y][x] === 0) cells.push({ x, y });
          }
        }
        // Fisher-Yates with the seeded PRNG.
        for (let s = cells.length - 1; s > 0; s--) {
          const j = Math.floor(rand() * (s + 1));
          const tmp = cells[s]; cells[s] = cells[j]; cells[j] = tmp;
        }
        const want = 1 + Math.floor(rand() * 3); // 1..3 inclusive
        const count = Math.min(want, cells.length);
        for (let k = 0; k < count && newSpawns.length < MAX_ENEMIES; k++) {
          const cell = cells[k];
          newSpawns.push({
            x: cell.x + 0.5,
            y: cell.y + 0.5,
            type: rand() < 0.5 ? 'imp' : 'grunt',
          });
        }
      }

      // pickups-health-ammo: 0-2 per non-starting room. Avoids cells
      // already claimed by enemy spawns in the same room. Roll order
      // (tier before kind) is the seeded-PRNG contract — reordering
      // changes the meaning of ?seed=<n> URLs.
      const newPickupSpawns = [];
      for (let i = 0; i < rooms.length && newPickupSpawns.length < MAX_PICKUPS; i++) {
        if (i === startIdx) continue;
        const room = rooms[i];
        const taken = new Set();
        for (let n = 0; n < newSpawns.length; n++) {
          const sp = newSpawns[n];
          const cx = Math.floor(sp.x), cy = Math.floor(sp.y);
          if (cx >= room.x && cx < room.x + room.w &&
              cy >= room.y && cy < room.y + room.h) {
            taken.add(cy + ',' + cx);
          }
        }
        const cells = [];
        for (let y = room.y; y < room.y + room.h; y++) {
          for (let x = room.x; x < room.x + room.w; x++) {
            if (map[y][x] === 0 && !taken.has(y + ',' + x)) cells.push({ x, y });
          }
        }
        for (let s = cells.length - 1; s > 0; s--) {
          const j = Math.floor(rand() * (s + 1));
          const tmp = cells[s]; cells[s] = cells[j]; cells[j] = tmp;
        }
        const count = Math.floor(rand() * (PICKUP_MAX_PER_ROOM + 1)); // 0..2
        const take = Math.min(count, cells.length);
        for (let k = 0; k < take && newPickupSpawns.length < MAX_PICKUPS; k++) {
          const cell = cells[k];
          const tier = rand() < PICKUP_LARGE_CHANCE ? 'large' : 'small';
          const kind = rand() < 0.5 ? 'health' : 'ammo';
          newPickupSpawns.push({
            x: cell.x + 0.5,
            y: cell.y + 0.5,
            type: kind + '_' + tier,
          });
        }
      }

      // shotgun-weapon-pickup: place exactly ONE weapon_shotgun pickup in an
      // open floor cell of a non-starting room, not on an enemy spawn or an
      // existing pickup cell. These rand() calls occur strictly AFTER the
      // pickup loop above and before the return, so no pre-existing roll's
      // consumed RNG value shifts — the byte-for-byte enemy / health-ammo /
      // tile layout for any existing ?seed= is preserved (AC #2). Same seed →
      // same shotgun cell. If no eligible cell exists (degenerate dungeon),
      // the dungeon ships without a shotgun pickup rather than crash. Appended
      // to newPickupSpawns so it participates in the normal pickup rebuild
      // with no special-casing.
      const sgOccupied = new Set();
      for (let n = 0; n < newSpawns.length; n++) {
        sgOccupied.add(Math.floor(newSpawns[n].y) + ',' + Math.floor(newSpawns[n].x));
      }
      for (let n = 0; n < newPickupSpawns.length; n++) {
        sgOccupied.add(Math.floor(newPickupSpawns[n].y) + ',' + Math.floor(newPickupSpawns[n].x));
      }
      const sgCells = [];
      for (let i = 0; i < rooms.length; i++) {
        if (i === startIdx) continue;
        const room = rooms[i];
        for (let y = room.y; y < room.y + room.h; y++) {
          for (let x = room.x; x < room.x + room.w; x++) {
            if (map[y][x] === 0 && !sgOccupied.has(y + ',' + x)) {
              sgCells.push({ x, y });
            }
          }
        }
      }
      if (sgCells.length > 0) {
        const sg = sgCells[Math.floor(rand() * sgCells.length)];
        newPickupSpawns.push({
          x: sg.x + 0.5,
          y: sg.y + 0.5,
          type: 'weapon_shotgun',
        });
      }

      return { map, mapW: W, mapH: H, rooms, playerSpawn, enemySpawns: newSpawns, pickupSpawns: newPickupSpawns, exitCell, themeMap, seed };
    }
    // Should be unreachable with sane parameters; guard against silent failure.
    throw new Error('dungeon generation failed after retries');
  }

  function applyDungeon(d) {
    MAP = d.map;
    MAP_W = d.mapW;
    MAP_H = d.mapH;
    THEME_MAP = d.themeMap;
    PLAYER_SPAWN = d.playerSpawn;
    enemySpawns = d.enemySpawns;
    pickupSpawns = d.pickupSpawns;
    EXIT = { cellX: d.exitCell.x, cellY: d.exitCell.y };
  }

  function regenerateDungeon() {
    const seed = pickRandomSeed();
    console.info('[seed] ' + seed);
    applyDungeon(generateDungeon(seed));
    resetRun();
    equipFramesLeft = EQUIP_FRAMES;
  }

  // level-exit-progression: triggered when the player steps onto the exit
  // cell. Carries HP, ammo, and lastFireTime forward; everything else is
  // a fresh dungeon. Always picks a random seed (?seed=<u32> only pins the
  // initial map, not transitions).
  // shotgun-weapon-pickup: `weapon` and `hasShotgun` are module-scope and
  // intentionally NOT touched here, so they carry forward across the level
  // exit exactly like HP / ammo / lastFireTime. The new dungeon's `pickups`
  // are rebuilt from pickupSpawns below, so it ships its own single shotgun
  // pickup with no special-casing.
  function advanceLevel() {
    const seed = pickRandomSeed();
    console.info('[seed] ' + seed);
    applyDungeon(generateDungeon(seed));
    level += 1;
    enemies = enemySpawns.map(s => makeEnemy(s.x, s.y, s.type));
    pickups = pickupSpawns.map(s => makePickup(s.x, s.y, s.type));
    player.x = PLAYER_SPAWN.x;
    player.y = PLAYER_SPAWN.y;
    player.dirX = PLAYER_SPAWN.dirX;
    player.dirY = PLAYER_SPAWN.dirY;
    player.planeX = PLAYER_SPAWN.planeX;
    player.planeY = PLAYER_SPAWN.planeY;
    clearTransientFeedback();
    sfxLevelExit();
    levelBannerAtMs = nowMs;
    levelBannerUntilMs = nowMs + 1200;
    equipFramesLeft = EQUIP_FRAMES;
  }

  // Initial dungeon: honour ?seed=<u32> when supplied so reloads reproduce a
  // bug-report layout exactly. Logged once per generation.
  {
    const initialSeed = parseSeedFromUrl();
    const seed = (initialSeed != null) ? initialSeed : pickRandomSeed();
    console.info('[seed] ' + seed);
    applyDungeon(generateDungeon(seed));
    resetRun();
  }

  // ---------------------------------------------------------------------------
  // AI: line-of-sight + per-enemy state machine. Modes:
  //   idle  — no LOS or LOS just lost; stand still, face the player.
  //   chase — LOS true and dist > ATTACK_RANGE; walk toward player.
  //   wind  — LOS true and dist <= ATTACK_RANGE; stop, telegraph red, fire on expiry.
  //   cool  — post-fire (hit or miss); freeze for TYPE_TABLE[type].cooldownMs, then re-evaluate.
  // ---------------------------------------------------------------------------

  // True iff a DDA ray from the enemy reaches player.{x,y} before any wall.
  // Other enemies do NOT block LOS — only walls do.
  function enemyCanSeePlayer(e) {
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 1e-6) return true;
    const rx = dx / dist, ry = dy / dist;
    let mx = Math.floor(e.x), my = Math.floor(e.y);
    const stepX = rx < 0 ? -1 : 1;
    const stepY = ry < 0 ? -1 : 1;
    const ddx = rx === 0 ? Infinity : Math.abs(1 / rx);
    const ddy = ry === 0 ? Infinity : Math.abs(1 / ry);
    let sideX = (rx < 0 ? e.x - mx : mx + 1 - e.x) * ddx;
    let sideY = (ry < 0 ? e.y - my : my + 1 - e.y) * ddy;
    let traveled = 0;
    // Bound the loop; DDA terminates well before this in any 16x16 map.
    let safety = MAP_W + MAP_H + 4;
    while (traveled < dist && safety-- > 0) {
      if (sideX < sideY) { traveled = sideX; sideX += ddx; mx += stepX; }
      else               { traveled = sideY; sideY += ddy; my += stepY; }
      if (mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H) return false;
      // If we hit a wall before reaching the player's distance, LOS is blocked.
      // traveled >= dist means the wall sits at-or-past the player — still visible.
      if (isWall(mx, my)) return traveled >= dist;
    }
    return true;
  }

  // Axis-resolved enemy collision; mirrors the player's moveAxisX/Y but on `e`.
  function moveEnemyAxisX(e, delta) {
    if (delta === 0) return;
    const r = ENEMY_AI_RADIUS;
    const nx = e.x + delta;
    const probe = nx + (delta > 0 ? r : -r);
    const cellX = Math.floor(probe);
    const cellY1 = Math.floor(e.y - r);
    const cellY2 = Math.floor(e.y + r);
    if (!isWall(cellX, cellY1) && !isWall(cellX, cellY2)) {
      e.x = nx;
    }
  }
  function moveEnemyAxisY(e, delta) {
    if (delta === 0) return;
    const r = ENEMY_AI_RADIUS;
    const ny = e.y + delta;
    const probe = ny + (delta > 0 ? r : -r);
    const cellY = Math.floor(probe);
    const cellX1 = Math.floor(e.x - r);
    const cellX2 = Math.floor(e.x + r);
    if (!isWall(cellX1, cellY) && !isWall(cellX2, cellY)) {
      e.y = ny;
    }
  }

  // Soft enemy-vs-enemy separation; O(N^2) over alive pairs (N <= 16).
  // Smaller push for wind/cool enemies so they don't visibly drift off aim.
  function separateEnemies() {
    const r = ENEMY_SEPARATION_R;
    const r2 = r * r;
    for (let i = 0; i < enemies.length; i++) {
      const a = enemies[i];
      if (!a.alive) continue;
      for (let j = i + 1; j < enemies.length; j++) {
        const b = enemies[j];
        if (!b.alive) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy;
        if (d2 >= r2) continue;
        const d = Math.sqrt(d2);
        if (d < 1e-6) continue;
        const overlap = r - d;
        const ux = dx / d, uy = dy / d;
        const aLocked = a.mode === 'wind' || a.mode === 'cool';
        const bLocked = b.mode === 'wind' || b.mode === 'cool';
        const aFactor = aLocked ? 0.15 : 0.5;
        const bFactor = bLocked ? 0.15 : 0.5;
        moveEnemyAxisX(a, -ux * overlap * aFactor);
        moveEnemyAxisY(a, -uy * overlap * aFactor);
        moveEnemyAxisX(b,  ux * overlap * bFactor);
        moveEnemyAxisY(b,  uy * overlap * bFactor);
      }
    }
  }

  // Per-type windup-tell. Plays exactly once on idle/chase → wind transitions;
  // cancellation paths (wind → idle/chase) must not call this.
  function enterWind(e, now) {
    e.mode = 'wind';
    e.modeUntil = now + TYPE_TABLE[e.type].windupMs;
    const vol = distanceVolume(e.x, e.y);
    if (e.type === 'imp') sfxImpWindup(vol);
    else if (e.type === 'grunt') sfxGruntWindup(vol);
  }

  // enemy-projectile-attacks: spawn-only. Pushes a finite-speed projectile
  // into `projectiles`; damage resolution happens in tickProjectiles when the
  // orb intersects the player. Walls absorb silently. enemyShotsFired counts
  // here at spawn; enemyShotsHit moves to onProjectileHitPlayer.
  function enemyFireShot(e, now) {
    stats.enemyShotsFired++;
    e.fireFlashUntil = now + ENEMY_FIRE_FLASH_MS;
    // Fire SFX sits above the alive guard so a windup-completed shot still
    // gets audible feedback even on the (defensive) dead-enemy path.
    const fireVol = distanceVolume(e.x, e.y);
    if (e.type === 'imp') sfxImpFire(fireVol);
    else if (e.type === 'grunt') sfxGruntFire(fireVol);

    if (!e.alive) return;

    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy);
    let lockX, lockY;
    if (d < 1e-6) { lockX = e.dirX; lockY = e.dirY; }
    else          { lockX = dx / d; lockY = dy / d; }

    let sx = e.x + lockX * PROJECTILE_SPAWN_OFFSET;
    let sy = e.y + lockY * PROJECTILE_SPAWN_OFFSET;
    // Defensive: a wall-hugging enemy could spawn the orb embedded in geometry.
    if (isWall(Math.floor(sx), Math.floor(sy))) {
      sx = e.x;
      sy = e.y;
    }

    projectiles.push({
      x: sx,
      y: sy,
      vx: lockX * PROJECTILE_SPEED,
      vy: lockY * PROJECTILE_SPEED,
      // `type` keys directly into SPRITES so drawSprites can reuse the
      // existing entity pipeline. Damage is captured at spawn so a mid-flight
      // enemy death cannot retroactively change it.
      type: e.type === 'grunt' ? 'grunt_proj' : 'imp_proj',
      damage: TYPE_TABLE[e.type].rangedDamage,
      sourceX: e.x,
      sourceY: e.y,
      alive: true,
      spawnedAtMs: now,
      // Duck-type fields read by drawSprites — projectiles never animate or
      // tint, so these stay at fixed values.
      animPhase: 0,
      hitFlashUntil: 0,
      mode: 'idle',
    });
  }

  function aiTick(dt) {
    const now = performance.now();
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      e.animPhase += dt * 4; // ~4 Hz between two frames

      // cool → idle on expiry; let the mode-eval block below pick the next mode.
      if (e.mode === 'cool' && now >= e.modeUntil) {
        e.mode = 'idle';
        e.modeUntil = 0;
      }

      const dx = player.x - e.x, dy = player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 1e-6) { e.dirX = dx / dist; e.dirY = dy / dist; }

      // wind → fire & cool on expiry. Fire happens before any cancellation check
      // so the player can't squeeze a one-frame escape after the windup elapses.
      if (e.mode === 'wind' && now >= e.modeUntil) {
        enemyFireShot(e, now);
        e.mode = 'cool';
        e.modeUntil = now + TYPE_TABLE[e.type].cooldownMs;
        continue;
      }

      const seen = enemyCanSeePlayer(e);

      if (e.mode === 'idle') {
        if (seen && dist <= ATTACK_RANGE) {
          enterWind(e, now);
        } else if (seen) {
          e.mode = 'chase';
        }
      } else if (e.mode === 'chase') {
        if (!seen) {
          e.mode = 'idle';
        } else if (dist <= ATTACK_RANGE) {
          enterWind(e, now);
        } else if (dist > 1e-6) {
          const stepLen = e.moveSpeed * dt;
          moveEnemyAxisX(e, (dx / dist) * stepLen);
          moveEnemyAxisY(e, (dy / dist) * stepLen);
        }
      } else if (e.mode === 'wind') {
        // Cancellation: lost LOS or stepped out of range → bail out without
        // costing a cooldown. Fired windups (above) go to cool instead.
        if (!seen) {
          e.mode = 'idle';
          e.modeUntil = 0;
        } else if (dist > ATTACK_RANGE + 0.5) {
          e.mode = 'chase';
          e.modeUntil = 0;
        }
      }
      // 'cool': hold position; re-evaluated when modeUntil expires next tick.
    }

    separateEnemies();
  }

  // enemy-projectile-attacks: per-frame straight-line integration. Substep
  // length is capped at 0.25 cells so a fast projectile cannot tunnel through
  // a 1-cell wall or skip past the player at low frame rates. Dead entries
  // are compacted in-place to avoid allocations and unbounded iteration cost.
  function tickProjectiles(dt) {
    const now = performance.now();
    const r2 = PROJECTILE_HIT_RADIUS * PROJECTILE_HIT_RADIUS;
    for (let i = 0; i < projectiles.length; i++) {
      const p = projectiles[i];
      if (!p.alive) continue;
      const travel = PROJECTILE_SPEED * dt;
      const steps = Math.max(1, Math.ceil(travel / 0.25));
      const sx = p.vx * dt / steps;
      const sy = p.vy * dt / steps;
      for (let s = 0; s < steps; s++) {
        p.x += sx;
        p.y += sy;
        if (isWall(Math.floor(p.x), Math.floor(p.y))) {
          p.alive = false;
          break;
        }
        const ddx = player.x - p.x, ddy = player.y - p.y;
        if (ddx * ddx + ddy * ddy <= r2 && player.hp > 0) {
          p.alive = false;
          onProjectileHitPlayer(p, now);
          break;
        }
      }
      if (p.alive && now - p.spawnedAtMs >= PROJECTILE_TTL_MS) {
        p.alive = false;
      }
    }
    let w = 0;
    for (let r = 0; r < projectiles.length; r++) {
      if (projectiles[r].alive) projectiles[w++] = projectiles[r];
    }
    projectiles.length = w;
  }

  // enemy-projectile-attacks: damage + feedback that used to live at the
  // bottom of enemyFireShot. Uses captured p.damage / p.sourceX / p.sourceY
  // so a mid-flight enemy death cannot retroactively change the impact.
  function onProjectileHitPlayer(p, now) {
    stats.enemyShotsHit++;
    player.hp -= p.damage;
    sfxHurt();
    triggerDamageFlash(now);
    setDamageArrowFromPoint(p.sourceX, p.sourceY, now);
    if (player.hp <= 0) {
      player.hp = 0;
      stats.deaths++;
    }
  }

  // DDA along an arbitrary unit ray. Mirrors castColumn's wall logic but
  // takes origin + direction explicitly; returns perpendicular wall distance.
  function castRay(originX, originY, rayDirX, rayDirY) {
    let mapX = Math.floor(originX);
    let mapY = Math.floor(originY);
    const deltaDistX = rayDirX === 0 ? Infinity : Math.abs(1 / rayDirX);
    const deltaDistY = rayDirY === 0 ? Infinity : Math.abs(1 / rayDirY);
    let stepX, stepY, sideDistX, sideDistY;
    if (rayDirX < 0) { stepX = -1; sideDistX = (originX - mapX) * deltaDistX; }
    else             { stepX =  1; sideDistX = (mapX + 1.0 - originX) * deltaDistX; }
    if (rayDirY < 0) { stepY = -1; sideDistY = (originY - mapY) * deltaDistY; }
    else             { stepY =  1; sideDistY = (mapY + 1.0 - originY) * deltaDistY; }
    let side = 0;
    let safety = MAP_W + MAP_H + 4;
    while (safety-- > 0) {
      if (sideDistX < sideDistY) { sideDistX += deltaDistX; mapX += stepX; side = 0; }
      else                       { sideDistY += deltaDistY; mapY += stepY; side = 1; }
      if (mapX < 0 || mapY < 0 || mapX >= MAP_W || mapY >= MAP_H) break;
      if (MAP[mapY][mapX] > 0) break;
    }
    let perp;
    if (side === 0) perp = (mapX - originX + (1 - stepX) * 0.5) / rayDirX;
    else            perp = (mapY - originY + (1 - stepY) * 0.5) / rayDirY;
    if (!(perp > 0.0001)) perp = 0.0001;
    return perp;
  }

  // shotgun-weapon-pickup: weapon selection. setWeapon re-arms the existing
  // equip slide-in only on an actual change (a redundant Digit1 while already
  // on the pistol is a no-op, so it never re-pops). The shotgun cannot be
  // selected while it is not owned. cycleWeapon is a no-op with pistol only.
  function setWeapon(id) {
    if (id === weapon) return;
    if (id === 'shotgun' && !hasShotgun) return;
    if (id !== 'pistol' && id !== 'shotgun') return;
    weapon = id;
    equipFramesLeft = EQUIP_FRAMES;
  }
  function cycleWeapon() {
    if (!hasShotgun) return; // pistol-only: visible no-op
    setWeapon(weapon === 'pistol' ? 'shotgun' : 'pistol');
  }

  // Fires the currently-selected weapon from its WEAPONS entry. The pistol
  // path is behaviorally identical to the original single-ray hitscan
  // (pellets = 1, spreadRad = 0 ⇒ a single ray straight along player.dir,
  // SHOT_DAMAGE, 250 ms cooldown, same flash/kick/SFX/hit-tint/dry-fire).
  // One trigger pull is exactly ONE Bernoulli trial regardless of weapon:
